<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f6fc">
<title>旅行打包清單</title>
<style id="css">
:root{
  --ink:#14161c;--sub:#7d8494;--faint:#a3a9b6;--line:rgba(20,30,60,.07);
  --coral:#ff6a5c;--blue:#2f7cf6;--grad:linear-gradient(135deg,#ff9554 0%,#ff6a5f 55%,#ff5b80 100%);
  --glow:0 12px 24px -10px rgba(255,92,100,.65);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;color:var(--ink);background:#eef1f8;overflow-x:hidden}
body{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans CJK TC","Noto Sans TC","Microsoft JhengHei",sans-serif;
  -webkit-font-smoothing:antialiased;min-height:100vh;overflow-x:hidden}
button,input,select{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer}
a{color:inherit;text-decoration:none}
svg{display:block}
.num{font-variant-numeric:tabular-nums}

/* ---------- 天空背景 ---------- */
.bg{position:fixed;inset:0;z-index:-2;background:
  radial-gradient(420px 320px at 6% 2%,rgba(186,212,255,.8),transparent 70%),
  radial-gradient(380px 320px at 104% 30%,rgba(222,212,255,.75),transparent 70%),
  radial-gradient(420px 320px at 90% 100%,rgba(255,208,186,.55),transparent 70%),
  radial-gradient(320px 280px at 0% 75%,rgba(200,226,255,.5),transparent 70%),
  linear-gradient(180deg,#f5f7fc,#eef1f8)}
.cloud{position:absolute;border-radius:50%;background:#fff;filter:blur(24px);opacity:.8;pointer-events:none;z-index:0}
.wrap{max-width:560px;margin:0 auto;position:relative;overflow-x:clip}

/* ---------- 頂部 ---------- */
.top{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top) + 14px) 18px 0;position:relative;z-index:6}
.circ{width:42px;height:42px;border-radius:50%;background:rgba(255,255,255,.88);display:grid;place-items:center;flex:none;
  box-shadow:0 8px 18px -10px rgba(40,60,110,.4);color:#2a2f3a;transition:transform .15s}
.circ:active{transform:scale(.92)}
.circ svg{width:19px;height:19px}
.tt{flex:1;text-align:center;min-width:0}
.tt b{font-size:19px;font-weight:800;display:block;letter-spacing:.02em;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small{font-size:12.5px;color:var(--sub);display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tt small em{font-style:normal;color:var(--coral);font-weight:700}

/* ---------- 地圖 ---------- */
.map{position:relative;height:280px;margin-top:-4px;overflow:hidden}
.map-in{position:absolute;left:50%;top:0;width:560px;height:300px;margin-left:-280px;
  -webkit-mask-image:linear-gradient(180deg,#000 72%,transparent);mask-image:linear-gradient(180deg,#000 72%,transparent)}
.intro .arc{stroke-dasharray:600;stroke-dashoffset:600;animation:draw 1.5s cubic-bezier(.4,0,.2,1) .2s forwards}
@keyframes draw{to{stroke-dashoffset:0}}
.intro .plane{opacity:0;animation:pop .5s ease 1.2s forwards}
@keyframes pop{from{opacity:0;transform:scale(.6)}to{opacity:1;transform:none}}
.pin{position:absolute;display:flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;padding:6px 11px 6px 9px;border-radius:12px;
  background:rgba(255,255,255,.88);box-shadow:0 8px 18px -10px rgba(40,60,110,.4);white-space:nowrap;z-index:3}
.pin i{width:9px;height:9px;border-radius:50%;background:var(--coral);box-shadow:0 0 0 4px rgba(255,106,92,.2)}
.pin.tr{font-size:11.5px;padding:5px 9px 5px 8px;color:#5d6475}
.pin.tr i{background:#8a94ff;box-shadow:0 0 0 4px rgba(138,148,255,.2)}
.cd{position:absolute;right:18px;top:10px;padding:11px 15px 10px;border-radius:18px;text-align:right;z-index:4;min-width:118px;
  background:rgba(255,255,255,.8);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border:1px solid #fff;box-shadow:0 14px 30px -14px rgba(50,70,130,.3)}
.cd .c1{font-size:11.5px;color:var(--sub);font-weight:600}
.cd b{font-size:27px;font-weight:800;color:var(--blue);display:block;line-height:1.1;letter-spacing:-.01em;margin:1px 0}
.cd b small{font-size:14px;font-weight:700;color:#7aa6f5;margin-left:2px}
.cd .c3{font-size:11px;color:var(--sub)}
.cd.set b{font-size:15px;color:var(--coral);margin:4px 0 2px}

/* ---------- 面板 ---------- */
.panel{position:relative;z-index:5;margin-top:-30px;border-radius:34px 34px 0 0;padding:10px 18px calc(env(safe-area-inset-bottom) + 118px);
  background:rgba(255,255,255,.84);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);
  box-shadow:0 -14px 40px -16px rgba(50,70,130,.25);border-top:1px solid #fff;min-height:calc(100vh - 280px)}
.grab{width:40px;height:5px;border-radius:3px;background:#d6dbe5;margin:0 auto 14px}
.vs{display:flex;padding:4px;border-radius:17px;background:#15161b;margin-bottom:20px;box-shadow:0 14px 26px -16px rgba(10,12,20,.7)}
.vs button{flex:1;height:42px;border-radius:13px;color:rgba(255,255,255,.62);font-weight:700;font-size:14.5px;display:flex;align-items:center;justify-content:center;gap:7px;transition:all .25s}
.vs button svg{width:17px;height:17px}
.vs button.on{background:#fff;color:var(--ink);box-shadow:0 4px 12px -4px rgba(0,0,0,.4)}

.stat{display:flex;align-items:flex-end;gap:10px}
.stat b{font-size:40px;font-weight:900;letter-spacing:-.03em;line-height:1}
.stat b small{font-size:19px;color:var(--faint);font-weight:700}
.stat .lb{font-size:13.5px;color:var(--sub);margin-bottom:5px}
.stat .r{margin-left:auto;text-align:right;font-size:12px;color:var(--sub)}
.stat .r strong{display:block;font-size:22px;color:var(--coral);font-weight:800;line-height:1.2}
.stat .r.ok strong{color:#20b555}
.seg3{display:flex;gap:4px;height:8px;margin:13px 0 16px}
.seg3 i{border-radius:4px;background:rgba(20,30,60,.08);position:relative;overflow:hidden;min-width:8px}
.seg3 u{position:absolute;left:0;top:0;bottom:0;border-radius:4px;transition:width .5s cubic-bezier(.2,.8,.2,1)}

.tabs{display:flex;gap:4px;padding:4px;border-radius:17px;background:rgba(225,230,240,.65);margin-bottom:12px;overflow-x:auto;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:1 0 auto;min-width:92px;height:40px;padding:0 12px;border-radius:13px;display:flex;align-items:center;justify-content:center;gap:6px;
  font-size:14.5px;font-weight:700;color:#5d6475;white-space:nowrap;transition:color .2s}
.tab svg{width:16px;height:16px;flex:none}
.tab em{font-style:normal;font-size:12px;font-weight:600;opacity:.75}
.tab.on{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.tab.on em{opacity:.9}
.tab.add{flex:0 0 40px;min-width:40px;padding:0;color:var(--sub)}

.tools{display:flex;align-items:center;gap:8px;margin:0 2px 12px}
.tools .h{flex:1;font-size:13px;color:var(--sub);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tools .h b{color:var(--ink);font-weight:700}
.pl{height:32px;padding:0 13px;border-radius:999px;background:#fff;font-size:13px;font-weight:700;color:#3b414f;flex:none;
  box-shadow:0 6px 14px -10px rgba(40,60,110,.45);border:1px solid rgba(20,30,60,.05);display:flex;align-items:center;gap:5px;white-space:nowrap}
.pl svg{width:14px;height:14px}
.pl.on{background:#15161b;color:#fff;border-color:#15161b}
.pl.g{background:var(--grad);color:#fff;border:0;box-shadow:var(--glow)}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.tile{min-height:54px;border-radius:17px;background:#fff;display:flex;align-items:center;gap:10px;padding:9px 12px;font-size:15.5px;text-align:left;line-height:1.3;
  box-shadow:0 6px 14px -10px rgba(40,60,110,.4);border:1px solid rgba(20,30,60,.04);transition:background .2s,transform .15s;position:relative;width:100%}
.anim .tile,.anim .fc,.anim .st{animation:rise .4s cubic-bezier(.2,.8,.2,1) both}
@keyframes rise{from{opacity:0;transform:translateY(6px)}}
.tile:active{transform:scale(.97)}
.tile .t{flex:1;min-width:0;word-break:break-word;transition:color .25s}
.tile .t s{text-decoration:none;background:linear-gradient(currentColor,currentColor) left 55%/0 1.4px no-repeat;transition:background-size .3s ease}
.ck{width:24px;height:24px;border-radius:50%;border:1.6px solid #c6ccd8;background:#fff;display:grid;place-items:center;flex:none;
  transition:background .2s,border-color .2s,transform .25s cubic-bezier(.3,1.6,.5,1)}
.ck svg{width:14px;height:14px;stroke:#fff;stroke-width:2.8;fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:20;stroke-dashoffset:20;transition:stroke-dashoffset .28s ease .05s}
.tile.on{background:#f5f6f9;box-shadow:none}
.tile.on .ck{background:#15161b;border-color:#15161b;transform:scale(1.05)}
.tile.on .ck svg{stroke-dashoffset:0}
.tile.on .t{color:var(--faint)}
.tile.on .t s{background-size:100% 1.4px}
.tile.leaving{animation:out .32s ease forwards}
@keyframes out{to{opacity:0;transform:scale(.94)}}
.tile .x{position:absolute;top:-7px;right:-7px;width:24px;height:24px;border-radius:50%;background:#ff453a;color:#fff;display:grid;place-items:center;
  box-shadow:0 4px 10px -4px rgba(255,69,58,.7)}
.tile .x svg{width:12px;height:12px}
.editing .tile .ck{display:none}
.editing .tile .t{color:var(--ink)}
.editing .tile .t s{background-size:0!important}
.editing .tile .pen{width:14px;height:14px;color:var(--faint);flex:none}
.addt{min-height:54px;border-radius:17px;border:1.5px dashed rgba(255,106,92,.45);color:var(--coral);font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.4);width:100%}
.addt svg{width:16px;height:16px}
.addf{grid-column:1/-1;display:flex;gap:8px;padding:6px;border-radius:18px;background:#fff;box-shadow:0 10px 24px -14px rgba(40,60,110,.45);border:1px solid rgba(255,106,92,.35)}
.addf input{flex:1;min-width:0;height:44px;border:0;outline:none;background:transparent;padding:0 10px;font-size:16px}
.addf button{height:44px;padding:0 16px;border-radius:13px;font-weight:700;font-size:14.5px}
.addf .go{background:var(--grad);color:#fff;box-shadow:var(--glow)}
.addf .no{background:#f0f2f7;color:#5d6475;padding:0 13px}
.empty{grid-column:1/-1;text-align:center;padding:26px 0 18px;color:var(--sub);font-size:14px;line-height:1.6}
.empty b{display:block;font-size:30px;margin-bottom:6px}
.allok{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:18px;margin:0 0 14px;font-size:14.5px;font-weight:700;color:#20b555;
  background:linear-gradient(135deg,rgba(48,209,88,.16),rgba(48,209,88,.05));border:1px solid rgba(48,209,88,.25)}
.allok svg{width:20px;height:20px;flex:none}

/* ---------- 行程・天氣 ---------- */
.sh{display:flex;align-items:center;gap:10px;margin:0 2px 12px}
.sh h2{margin:0;font-size:18px;font-weight:800;flex:1}
.sh h2 small{font-size:12.5px;color:var(--sub);font-weight:600;margin-left:6px}
.sec{margin-bottom:26px}
.fc{background:#fff;border-radius:22px;padding:14px 16px 15px;margin-bottom:10px;box-shadow:0 10px 24px -16px rgba(40,60,110,.45);border:1px solid rgba(20,30,60,.04);
  width:100%;text-align:left;display:block;position:relative;overflow:hidden}
.fc::before{content:"";position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--grad)}
.fc .r1{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--sub)}
.fc .no{font-size:15px;font-weight:800;color:var(--ink);letter-spacing:.03em}
.fc .r1 .pen{margin-left:auto;width:15px;height:15px;color:var(--faint)}
.fc .r2{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:8px;margin-top:10px}
.fc .ap b{display:block;font-size:26px;font-weight:900;letter-spacing:.01em;line-height:1}
.fc .ap .tm{font-size:16px;font-weight:800;margin-top:6px;display:flex;align-items:baseline;gap:4px}
.fc .ap .tm sup{font-size:11px;color:var(--coral);font-weight:800}
.fc .ap small{font-size:12px;color:var(--sub);display:block;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.fc .ap.r{text-align:right}
.fc .ap.r .tm{justify-content:flex-end}
.fc .mid{text-align:center;font-size:11.5px;color:var(--sub);min-width:92px}
.fc .mid .ln{display:flex;align-items:center;gap:4px;margin:5px 0}
.fc .mid .ln i{flex:1;border-top:1.5px dashed #cfd6e4}
.fc .mid .ln span{width:26px;height:26px;border-radius:50%;background:#fff3f0;color:var(--coral);display:grid;place-items:center}
.fc .mid .ln svg{width:14px;height:14px}
.fc .warn{color:#ff453a}
.st{background:#fff;border-radius:24px;padding:16px;margin-bottom:12px;box-shadow:0 10px 24px -16px rgba(40,60,110,.45);border:1px solid rgba(20,30,60,.04)}
.st .hd{display:flex;align-items:flex-start;gap:10px;width:100%;text-align:left}
.role{display:inline-flex;align-items:center;height:22px;padding:0 9px;border-radius:999px;font-size:11.5px;font-weight:800;letter-spacing:.04em;
  background:rgba(255,106,92,.12);color:var(--coral)}
.role.tr{background:rgba(138,148,255,.15);color:#6470f0}
.st .nm{flex:1;min-width:0}
.st .nm b{display:block;font-size:21px;font-weight:900;margin-top:6px;line-height:1.15}
.st .nm b span{font-size:15px;font-weight:700;color:var(--sub);margin-left:6px}
.st .nm small{font-size:12.5px;color:var(--sub)}
.st .clk{text-align:right;flex:none}
.st .clk b{display:block;font-size:26px;font-weight:800;letter-spacing:-.01em;line-height:1.05}
.st .clk small{display:block;font-size:11.5px;color:var(--sub);margin-top:3px}
.st .clk em{font-style:normal;display:inline-block;margin-top:5px;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:8px;background:#eef3ff;color:var(--blue)}
.st .dt{display:flex;align-items:center;gap:8px;margin:12px 0 12px;padding:10px 12px;border-radius:14px;background:#f5f7fb;font-size:13.5px;font-weight:600}
.st .dt svg{width:16px;height:16px;color:var(--sub)}
.st .dt span{margin-left:auto;color:var(--sub);font-weight:500;font-size:12.5px}
.wxs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin:0 -16px;padding:2px 16px 4px}
.wxs::-webkit-scrollbar{display:none}
.wd{flex:0 0 auto;min-width:82px;border-radius:17px;padding:10px 8px 9px;text-align:center;background:linear-gradient(180deg,#f3f7ff,#fbf5f6);border:1px solid rgba(20,30,60,.04)}
.wd .d{font-size:12px;font-weight:700}
.wd .d small{color:var(--sub);font-weight:600;margin-left:3px}
.wd svg{width:30px;height:30px;margin:6px auto 4px}
.wd .hl{font-size:16px;font-weight:800}
.wd .hl small{font-size:13px;color:var(--sub);font-weight:600}
.wd .cn{font-size:11px;color:var(--sub);font-weight:600;margin:-2px 0 2px}
.wxbar{display:flex;align-items:center;gap:10px;margin:-2px 2px 12px;font-size:12.5px;color:var(--sub)}
.wxbar span{flex:1;display:flex;align-items:center;gap:7px;min-width:0}
.wxbar .dot{width:7px;height:7px;border-radius:50%;background:#30d158;flex:none;box-shadow:0 0 0 3px rgba(48,209,88,.18)}
.wxbar .dot.off{background:#c6ccd8;box-shadow:none}
.wxbar .spin{width:12px;height:12px;border-radius:50%;border:2px solid #d6dbe5;border-top-color:var(--coral);animation:sp 0.8s linear infinite;flex:none}
@keyframes sp{to{transform:rotate(360deg)}}
.wxbar .pl[disabled]{opacity:.5}
.wd .fl2{font-size:11px;color:#ff7a59;font-weight:700;margin-top:3px}
.wd .fl2.na{color:var(--faint);font-weight:500}
.wd .p{font-size:11px;color:var(--blue);font-weight:700;margin-top:2px}
.wd.na{background:#f5f7fb}
.wd.na .hl{color:var(--faint);font-size:14px}
.wref{display:flex;align-items:center;gap:6px;font-size:12px;font-weight:700;color:#6470f0;margin:-2px 0 8px}
.wref svg{width:15px;height:15px}
.wxs.ref .wd{background:linear-gradient(180deg,#f5f6ff,#f8f6fb);border:1px dashed rgba(100,112,240,.3)}
.wnote .src{white-space:nowrap}
.wnote{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:var(--sub);flex-wrap:wrap}
.wnote a{margin-left:auto;font-weight:700;color:var(--blue);display:flex;align-items:center;gap:3px}
.wnote a svg{width:13px;height:13px}
.hint{font-size:13px;color:var(--sub);background:#f5f7fb;border-radius:14px;padding:12px 14px;line-height:1.6}
.hint b{color:var(--ink)}
.addrow{width:100%;height:52px;border-radius:18px;border:1.5px dashed rgba(255,106,92,.45);color:var(--coral);font-size:15px;font-weight:700;
  display:flex;align-items:center;justify-content:center;gap:6px;background:rgba(255,255,255,.45)}
.addrow svg{width:16px;height:16px}
.addrow.b{border-color:rgba(100,112,240,.4);color:#6470f0}

.sec-t{font-size:12.5px;letter-spacing:.14em;color:var(--sub);font-weight:700;margin:30px 4px 10px}
.log{background:rgba(255,255,255,.75);border-radius:20px;overflow:hidden;box-shadow:0 10px 24px -16px rgba(40,60,110,.4)}
.log div{display:flex;align-items:center;gap:12px;padding:13px 16px;font-size:14.5px}
.log div+div{border-top:1px solid var(--line)}
.log .d{font-size:12px;color:var(--sub);width:74px;flex:none}
.log .n{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.log .c{font-size:12.5px;color:var(--sub)}
.reset{width:100%;height:54px;border-radius:18px;margin-top:26px;background:#15161b;color:#fff;font-weight:700;font-size:15.5px;
  display:flex;align-items:center;justify-content:center;gap:8px;box-shadow:0 16px 30px -16px rgba(10,12,20,.6)}
.reset svg{width:17px;height:17px}
.foot{text-align:center;font-size:12px;color:var(--faint);margin-top:14px;line-height:1.7}
.foot i{display:inline-block;width:6px;height:6px;border-radius:50%;background:#30d158;margin-right:6px;vertical-align:1px}
.foot.pending i{background:#ff9554;animation:pulse 1s infinite}
.foot.local i{background:#c6ccd8}
.foot.error i{background:#ff453a}
@keyframes pulse{50%{opacity:.3}}

/* ---------- 底部導覽列 ---------- */
.nav{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 12px);width:min(calc(100% - 28px),420px);height:68px;border-radius:34px;display:flex;padding:0 6px;z-index:30;
  transform:translateX(-50%);transition:transform .35s cubic-bezier(.3,1.2,.5,1),opacity .25s;
  background:rgba(255,255,255,.58);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);
  border:1px solid rgba(255,255,255,.95);box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(20,30,60,.05),0 22px 40px -16px rgba(40,60,120,.5),0 2px 6px rgba(40,60,120,.06)}
.typing .nav{transform:translate(-50%,120px);opacity:0;pointer-events:none}
.nav .ind{position:absolute;left:6px;top:6px;bottom:6px;width:calc((100% - 12px)/5);transform:translateX(calc(var(--i)*100%));transition:transform .5s cubic-bezier(.3,1.25,.45,1);pointer-events:none;z-index:1}
.nav .ind::before{content:"";position:absolute;inset:0 3px;border-radius:28px;background:linear-gradient(180deg,rgba(255,255,255,.98),rgba(255,255,255,.62));border:1px solid #fff;
  box-shadow:inset 0 0 0 1px rgba(255,106,92,.16),inset 0 -6px 12px -6px rgba(255,120,110,.25),0 10px 20px -10px rgba(255,92,100,.55)}
.nav .ind::after{content:"";position:absolute;left:12px;right:12px;top:4px;height:12px;border-radius:10px;background:linear-gradient(180deg,rgba(255,255,255,.95),rgba(255,255,255,0))}
.nb{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;font-weight:700;color:#6b7284;position:relative;z-index:2;transition:color .3s,transform .15s}
.nb svg{width:22px;height:22px}
.nb.on{color:var(--coral)}
.nb:active{transform:scale(.9)}
.nfab{flex:1;display:grid;place-items:center;position:relative;z-index:3}

function wmo(c){

  if(c===0)return ['clear','晴'];if(c<=2)return ['part','晴時多雲'];if(c===3)return ['cloud','陰天'];
  if(c===45||c===48)return ['fog','霧'];if(c>=51&&c<=57)return ['rain','毛毛雨'];if(c>=61&&c<=67)return ['rain','下雨'];
  if(c>=71&&c<=77)return ['snow','下雪'];if(c>=80&&c<=82)return ['rain','陣雨'];if(c>=85&&c<=86)return ['snow','陣雪'];if(c>=95)return ['storm','雷雨'];
  return ['cloud','多雲'];
}

/* ---------- 時間與時區 ---------- */

  if(!str)return null;var a=str.split(/[-T:]/).map(Number);var g=Date.UTC(a[0],a[1]-1,a[2],a[3]||0,a[4]||0);
  var o1=tzOff(tz,new Date(g));if(o1==null)return null;var o2=tzOff(tz,new Date(g-o1*60000));return g-o2*60000;
}

  var d=offDiff(tz,TW,date);if(d==null)return '';

/* ---------- 行程推導 ---------- */
function sortedFlights(){return state.flights.slice().sort(function(a,b){return (a.dep||'').localeCompare(b.dep||'');});}

function tripDates(){
  var ds=[];state.flights.forEach(function(f){if(f.dep)ds.push(f.dep.slice(0,10));if(f.arr)ds.push(f.arr.slice(0,10));});
  state.stops.forEach(function(s){if(s.arrive)ds.push(s.arrive);if(s.leave)ds.push(s.leave);});
  if(!ds.length)return null;ds.sort();return {s:ds[0],e:ds[ds.length-1]};
}

  var r=tripDates();if(!r)return (state.flights.length||state.stops.length)?'尚未設定日期':'新增航班或停留地';
  if(r.s===r.e)return md(r.s);
  var n=daysBetween(r.s,r.e)+1;return md(r.s)+' – '+md(r.e)+' · '+n+' 天 '+(n-1)+' 夜';

  if(f&&f.dep){var tz=(apInfo(f.from)||{}).tz||TW;t=toUTC(f.dep,tz);}
  else if(r)t=pd(r.s).getTime();
  if(!t)return '';
  var end=r?pd(r.e).getTime()+864e5:t;
  if(now<t){var d=Math.ceil((t-now)/864e5);
    if(d<=1){var h=Math.max(1,Math.round((t-now)/36e5));return h<=24&&f?h+' 小時後起飛':'明天出發';}
    return d+' 天後出發';}
  if(now<end)return '旅途中';
  return '已返程';
}

  if(!s.arrive)return [];var out=[],d=pd(s.arrive),e=pd(s.leave||s.arrive);if(e<d)e=d;
  for(var i=0;i<20&&d<=e;i++){out.push(ymd(d));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);}
  return out;
}

/* ---------- 點陣地圖 ---------- */
var MAPD=(function(){
  var ox=85;
  function land(x,y){
    x-=ox;
    function e(cx,cy,rx,ry,a){a=a||0;var c=Math.cos(a),s=Math.sin(a),dx=x-cx,dy=y-cy,u=(dx*c+dy*s)/rx,v=(-dx*s+dy*c)/ry;return u*u+v*v<1;}
    return e(-30,150,150,185,.15)||e(70,40,120,46,-.1)||e(105,120,42,60,.3)||e(176,96,15,36,.25)||
      e(268,140,58,15,-.62)||e(320,78,15,34,.2)||e(232,170,26,11,-.2)||e(206,184,11,13)||e(352,32,24,18)||e(148,200,7,15,.25)||
      e(470,40,40,30,.3)||e(120,250,40,14)||e(30,250,60,20);
  }
  var d='';for(var y=6;y<298;y+=8)for(var x=4;x<560;x+=8)if(land(x,y))d+='M'+x+' '+y+'h0';
  return d;
})();

  }).join('');

    if(w[td]&&(!days.length||days.indexOf(td)>=0))key=td;

function tally(c){var d=0;c.items.forEach(function(i){if(i.d)d++;});return {d:d,t:c.items.length};}
function total(){var d=0,t=0;state.cats.forEach(function(c){var x=tally(c);d+=x.d;t+=x.t;});return {d:d,t:t};}
function toolTxt(c){var x=tally(c);return '<b>'+esc(c.name)+'</b> · '+(x.t-x.d?'剩 '+(x.t-x.d)+' 件':(x.t?'全部完成':'尚無項目'));}
/* ---------- 穿搭建議 ---------- */
function tripSpan(){
  var fl=sortedFlights().filter(function(f){return f.dep;});
  if(fl.length){var last=fl[fl.length-1],home=AP[state.from.code],la=AP[last.to];
    var back=last.to===state.from.code||!!(home&&la&&home.country===la.country),e=(last.arr||last.dep).slice(0,10);
    if(!back){var r0=tripDates();if(r0&&r0.e>e)e=r0.e;}
    return {s:fl[0].dep.slice(0,10),e:e,back:back};}
  var r=tripDates();return r?{s:r.s,e:r.e,back:true}:null;
}
function rangeDays(a,b){var out=[],d=pd(a),e=pd(b);for(var i=0;i<60&&d<=e;i++){out.push(ymd(d));d=new Date(d.getFullYear(),d.getMonth(),d.getDate()+1);}return out;}
function bizAuto(){return /出差|商務|公務|會議|拜訪/.test(state.trip)||state.cats.some(function(c){return c.items.some(function(i){return /上班|襯衫|西裝/.test(i.t);});});}
function isBiz(){return state.biz==null?bizAuto():!!state.biz;}
function clothesPlan(){
  var sp=tripSpan();if(!sp)return null;
  var D=Math.max(1,daysBetween(sp.s,sp.e)+1),N=D-1,C=Math.min(Math.max(N,1),7),biz=isBiz();
  // 停留期間（目的地，不含轉機）
  var stay={};state.stops.forEach(function(x){if(x.role!=='transit')stayDays(x).forEach(function(d){stay[d]=1;});});
  var sd=Object.keys(stay);if(!sd.length)sd=rangeDays(sp.s,sp.e);
  var wd=sd.filter(function(d){var w=pd(d).getDay();return w>0&&w<6;}).length;
  // 天氣：停留期間全部停留地
  var lo=null,hi=null,rain=[];
  state.stops.forEach(function(x){var w=state.wx[x.code];if(!w||!w.days)return;stayDays(x).forEach(function(d){var v=w.days[d];if(!v)return;
    var l=v.fl!=null?v.fl:v.lo;if(l!=null&&(lo==null||l<lo))lo=l;if(v.hi!=null&&(hi==null||v.hi>hi))hi=v.hi;if((v.p||0)>=50&&rain.indexOf(d)<0)rain.push(d);});});
  rain.sort();
  var shirts=biz?Math.max(1,Math.min(wd,5,C)):0,tops=Math.max(0,C-shirts),per=N>7?'以 7 晚為上限':'共 '+Math.max(N,1)+' 晚';
  var L=[
    {k:'under',n:'內衣褲',q:C,u:'套',why:per+'，每晚 1 套'},
    {k:'socks',n:'襪子',q:C,u:'雙',why:per+'，每晚 1 雙'}
  ];
  if(tops>0){L.push({k:'tops',n:'外出上衣',q:tops,u:'件',why:biz?C+' 套扣掉上班日 '+shirts+' 天':per+'，每晚 1 件'});
    L.push({k:'pants',n:'外出褲子',q:Math.min(3,Math.max(1,Math.ceil(tops/3))),u:'件',why:'約 3 晚 1 件'});}
  L.push({k:'sleep',n:'睡衣',q:N>5?2:1,u:'套',why:N>5?'住超過 5 晚帶 2 套':'1 套'});
  if(biz){L.push({k:'shirt',n:'上班襯衫',q:shirts,u:'件',why:'上班日 '+wd+' 天'});L.push({k:'suit',n:'西裝外套',q:1,u:'件',why:'正式場合'});}
  var coat=null;
  if(lo==null)coat={k:'coat',n:'外套',q:1,u:'件',why:'出發前看天氣再決定厚薄'};
  else if(lo<=5)coat={k:'coat',n:'保暖外套（羽絨或大衣）',q:1,u:'件',why:'最低體感 '+lo+'°'};
  else if(lo<=12)coat={k:'coat',n:'保暖外套',q:1,u:'件',why:'最低體感 '+lo+'°'};
  else if(lo<=18)coat={k:'coat',n:'薄外套',q:1,u:'件',why:'早晚 '+lo+'° 左右'};
  if(coat)L.push(coat);
  if(rain.length)L.push({k:'rain',n:'雨傘或雨衣',q:1,u:'把',why:rain.map(md).join('、')+' 可能下雨'});
  return {D:D,N:N,s:sp.s,e:sp.e,back:sp.back,wd:wd,biz:biz,lo:lo,hi:hi,rain:rain,laundry:N>7,list:L};
}
var CL_KEYS={under:[/內衣|內褲/],socks:[/襪/],sleep:[/睡覺|睡衣/],shirt:[/襯衫|上班/],suit:[/西裝/],tops:[/出外衣|外出衣|上衣|T恤|衣服/],
  pants:[/長褲|褲子|外出褲/],coat:[/外套|大衣|羽絨/],rain:[/雨傘|雨衣|雨具/]};
var CL_ORDER=['under','socks','sleep','shirt','suit','tops','pants','coat','rain'];
function clothesMatch(plan){
  var used={},map={};
  CL_ORDER.forEach(function(k){var sug=null;plan.list.forEach(function(x){if(x.k===k)sug=x;});if(!sug)return;
    var hit=null;state.cats.forEach(function(c){c.items.forEach(function(it){if(hit||used[it.id])return;
      if(k==='coat'&&/西裝/.test(it.t))return;if(k==='pants'&&/內|睡|襯衫/.test(it.t))return;
      if(CL_KEYS[k].some(function(re){return re.test(it.t);}))hit={it:it,c:c};});});
    if(hit){used[hit.it.id]=1;map[k]=hit;}});
  if(map.tops&&/褲/.test(map.tops.it.t)&&!map.pants)map.pants={combined:true};
  return map;
}
function clothesApply(){
  var plan=clothesPlan();if(!plan)return 0;var map=clothesMatch(plan),n=0;
  var wear=null;state.cats.forEach(function(c){if(!wear&&(c.icon==='shirt'||/穿|衣/.test(c.name)))wear=c;});
  if(!wear){wear={id:uid(),name:'穿著',icon:'shirt',color:COLORS[1],items:[]};state.cats.push(wear);}
  plan.list.forEach(function(x){var m=map[x.k];
    if(m&&m.combined)return;
    if(m){m.it.q=x.q;n++;}
    else{var tgt=wear;if(x.k==='rain'){state.cats.forEach(function(c){if(c.icon==='plane'||/出外|隨身/.test(c.name))tgt=c;});}
      tgt.items.push({id:uid(),t:x.n,d:false,q:x.q});n++;}
  });
  state.clApplied=plan.s+'~'+plan.e+(plan.biz?'b':'');
  return n;
}

function flightCard(f,i){
  var fa=apInfo(f.from),ta=apInfo(f.to),dep=fa?toUTC(f.dep,fa.tz):null,arr=ta?toUTC(f.arr,ta.tz):null;
  var dur=(dep!=null&&arr!=null)?Math.round((arr-dep)/60000):null,dt=durTxt(dur);
  var plus=(f.dep&&f.arr)?daysBetween(f.dep.slice(0,10),f.arr.slice(0,10)):0;
  return '<button class="fc" data-act="editflight" data-id="'+f.id+'" style="animation-delay:'+(i*40)+'ms"><div class="r1"><span class="no">'+esc(f.no||'航班')+'</span><span>'+mdw(f.dep)+'</span><span class="pen">'+ic('pen',2)+'</span></div>'+
   '<div class="r2"><div class="ap"><b>'+esc(f.from)+'</b><div class="tm num">'+(hm(f.dep)||'--:--')+'</div><small>'+esc(short(cityOf(f.from)))+'</small></div>'+
   '<div class="mid">'+(dt===null?'<span class="warn">時間有誤</span>':(dt||'飛行時間'))+'<div class="ln"><i></i><span>'+ic('plane',2.2)+'</span><i></i></div>'+(fa&&ta?esc(pairDiff(fa.tz,ta.tz,new Date(arr||dep||Date.now()))):'當地時間')+'</div>'+
   '<div class="ap r"><b>'+esc(f.to)+'</b><div class="tm num">'+(hm(f.arr)||'--:--')+(plus>0?'<sup>+'+plus+'</sup>':plus<0?'<sup>'+plus+'</sup>':'')+'</div><small>'+esc(short(cityOf(f.to)))+'</small></div></div></button>';
}
function stopCard(s,i,mode){
  if(typeof i!=='number')i=0;

          c==='image_rejected'?'這張照片無法讀取，請換一張或改用截圖。':(e&&e.message&&/下載|載入/.test(e.message))?'無法下載辨識引擎（需要網路）。可改用 iPhone 長按照片文字拷貝後「貼上文字」。':
          '辨識失敗，請再試一次或改用「貼上文字」。');
      });
    });
    function dupe(x){return state.flights.some(function(f){return f.no&&f.no===x.no&&(f.dep||'').slice(0,10)===(x.dep||'').slice(0,10);});}
    function review(src){
      stage('rv');
      if(!segs.length){$('rv').innerHTML='<div class="empty" style="padding:10px 0 14px">沒有找到航班資訊。</div>'+
        '<div class="fl">辨識出的文字（可修改後重新解析）</div><textarea class="fi ta" id="rt">'+esc(rawText)+'</textarea>'+
        '<div class="acts"><button data-k="again">重新選擇</button><button class="ok" data-k="reparse">重新解析</button></div>';return;}
      segs.forEach(function(x){x.on=!dupe(x)&&!!(x.from&&x.to&&x.dep);x.dupe=dupe(x);});
      $('rv').innerHTML='<div class="rvh"><b>找到 '+segs.length+' 段航班</b><span>'+src+' · 請確認後加入</span></div>'+
        segs.map(function(x,i){
          var warn=[];if(x.dupe)warn.push('行程裡已有這段');if(x.miss.length)warn.push('缺少：'+x.miss.join('、'));if(x.guessDate)warn.push('日期為推測，請確認');
          return '<div class="rseg'+(x.on?' on':'')+'" data-i="'+i+'"><label class="rck"><input type="checkbox" data-f="on"'+(x.on?' checked':'')+'><span></span></label>'+
            '<div class="rbody"><div class="rr"><input class="ri no up" data-f="no" value="'+esc(x.no)+'" placeholder="航班" maxlength="8">'+
            '<input class="ri ap up" data-f="from" value="'+esc(x.from)+'" placeholder="出發" maxlength="3"><span class="arw">→</span><input class="ri ap up" data-f="to" value="'+esc(x.to)+'" placeholder="抵達" maxlength="3"></div>'+
            '<div class="rr dts"><label>起飛<input class="ri dt" type="datetime-local" data-f="dep" value="'+esc(x.dep)+'"></label><label>抵達<input class="ri dt" type="datetime-local" data-f="arr" value="'+esc(x.arr)+'"></label></div>'+
            '<div class="rw" data-w>'+esc(warn.join(' · '))+'</div></div></div>';}).join('')+
        '<div class="err" id="rer"></div><div class="acts"><button data-k="again">重新選擇</button><button class="ok" data-k="add" id="addb"></button></div>'+
        (rawText?'<details class="raw"><summary>查看辨識出的文字</summary><textarea class="fi ta" id="rt">'+esc(rawText)+'</textarea><button class="pl" data-k="reparse">修改後重新解析</button></details>':'');
      count();
    }
    function count(){var n=segs.filter(function(x){return x.on;}).length,b=$('addb');if(b){b.textContent=n?'加入 '+n+' 段航班':'請勾選要加入的航班';b.disabled=!n;}}
    s.addEventListener('input',function(e){var f=e.target.dataset&&e.target.dataset.f,card=e.target.closest('.rseg');if(!f||!card)return;var x=segs[+card.dataset.i];
      if(f==='on'){x.on=e.target.checked;card.classList.toggle('on',x.on);count();return;}
      var v=e.target.value.trim();if(f==='no'||f==='from'||f==='to')v=v.toUpperCase().replace(/\s+/g,'');x[f]=v;});
    s.addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(!b)return;var k=b.dataset.k;
      if(k==='paste'){$('pa').style.display='';$('pt').focus();}
      else if(k==='parse'){rawText=$('pt').value;if(!rawText.trim()){$('pt').focus();return;}segs=getParser()(rawText).segs.map(cleanSeg);review('文字解析');}
      else if(k==='reparse'){rawText=($('rt')||{}).value||rawText;segs=getParser()(rawText).segs.map(cleanSeg);review('文字解析');}
      else if(k==='again'){segs=[];if(pf)pf.value='';stage('pk');}
      else if(k==='stop'){if(ctl)ctl.abort();stage('pk');}
      else if(k==='add'){
        var er=$('rer'),bad=null;
        segs.forEach(function(x,i){if(!x.on||bad)return;
          if(!x.from||!x.to||!x.dep){bad='第 '+(i+1)+' 段缺少出發、抵達機場或起飛時間';return;}
          var fa=apInfo(x.from),ta=apInfo(x.to);if(x.arr&&fa&&ta&&toUTC(x.arr,ta.tz)<=toUTC(x.dep,fa.tz))bad='第 '+(i+1)+' 段抵達時間早於起飛時間，請確認是否為當地時間';});
        if(bad){er.textContent=bad;return;}
        var n=0;segs.forEach(function(x){if(!x.on)return;state.flights.push({id:uid(),no:x.no,from:x.from,to:x.to,dep:x.dep,arr:x.arr});n++;});
        autoStops();closeSheet();ui.view='trip';saveUI();commit();render(true);setTimeout(function(){loadWx(false);},450);
        toast('已加入 '+n+' 段航班');
      }
    });
  });

}
function flightSheet(f){
  var isNew=!f,fl=sortedFlights(),last=fl[fl.length-1];
  var defFrom=f?f.from:(last?last.to:state.from.code), defTo=f?f.to:'';
  if(!f&&!last){var ms=mainStop();if(ms)defTo=ms.code;}
  var codes=[state.from.code];state.stops.forEach(function(x){if(codes.indexOf(x.code)<0)codes.push(x.code);});
  function chips(id){return '<div style="display:flex;gap:6px;flex-wrap:wrap;margin:-6px 0 14px">'+codes.map(function(c){return '<button type="button" class="pl" data-fill="'+id+'" data-c="'+c+'" style="height:28px;font-size:12.5px">'+c+'</button>';}).join('')+'</div>';}
  sheet('<h3>'+(isNew?'新增航班':'編輯航班')+'</h3><p>時間請填<b>當地時間</b>，App 會自動換算飛行時間與時差。新的抵達機場會自動加入停留地。</p>'+
    '<div class="fl">航班編號</div><input class="fi up" id="fn" maxlength="10" autocomplete="off" placeholder="例如 JX800" value="'+esc(f?f.no:'')+'" autofocus>'+
    '<div class="two"><div><div class="fl">出發機場</div><input class="fi up" id="ff" maxlength="4" placeholder="TPE" value="'+esc(defFrom)+'"></div><div><div class="fl">抵達機場</div><input class="fi up" id="ft" maxlength="4" placeholder="NRT" value="'+esc(defTo)+'"></div></div>'+
    chips('ft')+
    '<div class="fl" id="dlb">起飛（當地時間）</div><input class="fi" type="datetime-local" id="fd" value="'+esc(f?f.dep:'')+'">'+
    '<div class="fl" id="alb">抵達（當地時間）</div><input class="fi" type="datetime-local" id="fa" value="'+esc(f?f.arr:'')+'">'+
    '<div class="err" id="er"></div>'+
    '<div class="acts"><button data-s="cancel">取消</button><button data-s="ok" class="ok">'+(isNew?'加入':'儲存')+'</button></div>'+(isNew?'':'<button class="alt" data-s="del">刪除此航班</button>'),
  function(s){
    function lbl(){var a=AP[s.querySelector('#ff').value.trim().toUpperCase()],b=AP[s.querySelector('#ft').value.trim().toUpperCase()];
      s.querySelector('#dlb').textContent='起飛（'+(a?short(a.city)+' ':'')+'當地時間）';s.querySelector('#alb').textContent='抵達（'+(b?short(b.city)+' ':'')+'當地時間）';}
    lbl();s.querySelector('#ff').addEventListener('input',lbl);s.querySelector('#ft').addEventListener('input',lbl);
    s.querySelector('#fd').addEventListener('change',function(e){var a=s.querySelector('#fa');if(!a.value&&e.target.value)a.value=e.target.value;});
    s.addEventListener('click',function(e){
      var b=e.target.closest('button');if(!b)return;
      if(b.dataset.fill){s.querySelector('#'+b.dataset.fill).value=b.dataset.c;lbl();}
      else if(b.dataset.s==='ok'){
        var er=s.querySelector('#er');function v(id){return s.querySelector('#'+id).value.trim();}
        var o={no:v('fn').toUpperCase(),from:v('ff').toUpperCase(),to:v('ft').toUpperCase(),dep:v('fd'),arr:v('fa')};
        if(!o.from||!o.to){er.textContent='請填出發與抵達機場';return;}
        if(!o.dep){er.textContent='請填起飛時間';return;}
        var fa=apInfo(o.from),ta=apInfo(o.to);
        if(o.arr&&fa&&ta&&toUTC(o.arr,ta.tz)<=toUTC(o.dep,fa.tz)){er.textContent='抵達時間早於起飛時間，請確認是否為當地時間';return;}
        var tgt=f||{id:uid()};Object.keys(o).forEach(function(k){tgt[k]=o[k];});if(isNew)state.flights.push(tgt);
        autoStops();closeSheet();ui.view='trip';saveUI();commit();render();setTimeout(function(){loadWx(false);},450);
      }
      else if(b.dataset.s==='del'){closeSheet();confirmDel('刪除航班 '+(f.no||'')+'？','停留地不會被刪除。',function(){state.flights=state.flights.filter(function(x){return x!==f;});autoStops();commit();render();});}
    });
  });
}
function autoStops(){
  var fl=sortedFlights();
  fl.forEach(function(f,i){
    if(!f.to||f.to===state.from.code||!AP[f.to])return;
    var home=AP[state.from.code],onward=fl.slice(i+1).some(function(g){return g.from===f.to;});
    if(home&&AP[f.to].country===home.country&&!onward)return;
    var st=null;
    state.stops.forEach(function(x){if(!st&&x.auto&&x.fid===f.id)st=x;});
    if(!st)state.stops.forEach(function(x){if(!st&&x.auto&&!x.fid&&x.code===f.to)st=x;});
    if(!st)state.stops.forEach(function(x){if(!st&&!x.auto&&x.code===f.to&&(!x.arrive||x.arrive===(f.arr||f.dep||'').slice(0,10)))st=x;});
    var next=null;for(var j=i+1;j<fl.length;j++){if(fl[j].from===f.to){next=fl[j];break;}}
    var arrD=(f.arr||f.dep||'').slice(0,10),role='dest',leave='';
    if(next&&next.dep){var tz=AP[f.to].tz,gap=(toUTC(next.dep,tz)-toUTC(f.arr||f.dep,tz))/36e5;if(gap>=0&&gap<24)role='transit';leave=next.dep.slice(0,10);}
    if(!st)state.stops.push({id:uid(),code:f.to,role:role,arrive:arrD,leave:leave,auto:true,fid:f.id});
    else if(st.auto){st.fid=f.id;st.role=role;st.arrive=arrD;st.leave=leave;}
    else{if(!st.arrive)st.arrive=arrD;if(!st.leave&&leave)st.leave=leave;}
  });
  state.stops=state.stops.filter(function(x){return !x.auto||(x.fid?fl.some(function(f){return f.id===x.fid;}):fl.some(function(f){return f.to===x.code;}));});
}
function menuSheet(){
  var c=curCat();
  sheet('<h3>更多</h3><div class="menu">'+
    '<button data-m="trip"><span class="mi">'+ic('cal')+'</span>旅程設定<small>名稱、出發地</small></button>'+
    (c?'<button data-m="all"><span class="mi">'+ic('checks',2)+'</span>「'+esc(c.name)+'」全部勾選</button>':'')+
    '<button data-m="edit" class="'+(ui.edit?'on':'')+'"><span class="mi">'+ic('grid')+'</span>編輯打包項目<small>刪除、改名</small></button>'+
    '<button data-m="export"><span class="mi">'+ic('folder')+'</span>匯出備份<small>複製或下載</small></button>'+
    '<button data-m="import"><span class="mi">'+ic('reset',2)+'</span>匯入備份<small>還原資料</small></button>'+
    '<button data-m="reset" class="red"><span class="mi">'+ic('reset',2)+'</span>重設，準備下一趟</button></div>',
  function(s){s.addEventListener('click',function(e){var b=e.target.closest('[data-m]');if(!b)return;var m=b.dataset.m;closeSheet(true);
    if(m==='trip')tripSheet();else if(m==='flight')flightSheet(null);else if(m==='stop')stopSheet(null);else if(m==='newcat')catSheet(null);
    else if(m==='edit'){ui.edit=!ui.edit;ui.adding=false;ui.view='pack';saveUI();render();}
    else if(m==='all'){c.items.forEach(function(i){i.d=true;});commit();render();}
    else if(m==='export')exportSheet();else if(m==='import')importSheet();
    else if(m==='reset')resetSheet();});});
}
function backupJSON(){var o=JSON.parse(JSON.stringify(state));o.app='packing-list';o.exported=new Date().toISOString();return JSON.stringify(o);}
function exportSheet(){
  var txt=backupJSON(),canDl=!art&&typeof Blob!=='undefined',d=new Date();
  var fn='打包清單備份-'+d.getFullYear()+String(d.getMonth()+1).padStart(2,'0')+String(d.getDate()).padStart(2,'0')+'.json';
  sheet('<h3>匯出備份</h3><p>資料包含打包清單、航班、停留地與旅程紀錄。換手機或重新下載 App 後，用「匯入備份」即可還原。</p>'+
    '<textarea class="fi ta" id="bx" readonly>'+esc(txt)+'</textarea><div class="err" id="er" style="color:#20b555"></div>'+
    '<div class="acts"><button data-s="cancel">關閉</button>'+(canDl?'<button data-k="dl">下載檔案</button>':'')+'<button data-k="cp" class="ok">複製</button></div>',
  function(s){s.addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(!b)return;var er=s.querySelector('#er'),ta=s.querySelector('#bx');
    if(b.dataset.k==='cp'){
      var done=function(){er.textContent='已複製，可貼到備忘錄或傳給自己保存';};
      var fallback=function(){ta.removeAttribute('readonly');ta.focus();ta.select();try{document.execCommand('copy');done();}catch(x){er.style.color='';er.textContent='請長按文字框手動全選複製';}ta.setAttribute('readonly','');};
      try{navigator.clipboard.writeText(txt).then(done,fallback);}catch(x){fallback();}
    }else if(b.dataset.k==='dl'){
      try{var u=URL.createObjectURL(new Blob([txt],{type:'application/json'})),a=document.createElement('a');a.href=u;a.download=fn;document.body.appendChild(a);a.click();a.remove();setTimeout(function(){URL.revokeObjectURL(u);},4000);er.textContent='已下載 '+fn;}
      catch(x){er.style.color='';er.textContent='此環境無法下載，請改用「複製」';}
    }});});
}
function importSheet(){
  sheet('<h3>匯入備份</h3><p>貼上先前「匯出備份」複製的內容，或選擇備份檔。<b>目前的資料會被取代。</b></p>'+
    '<textarea class="fi ta" id="bx" placeholder="在此貼上備份內容"></textarea>'+
    '<label class="filebtn">選擇備份檔<input type="file" id="bf" accept=".json,application/json,text/plain"></label>'+
    '<div class="err" id="er"></div><div class="acts"><button data-s="cancel">取消</button><button data-s="ok" class="ok">匯入</button></div>',
  function(s){
    s.querySelector('#bf').addEventListener('change',function(e){var f=e.target.files&&e.target.files[0];if(!f)return;var r=new FileReader();r.onload=function(){s.querySelector('#bx').value=String(r.result||'');};r.readAsText(f);});
    s.querySelector('[data-s="ok"]').addEventListener('click',function(){
      var er=s.querySelector('#er'),o;
      try{o=JSON.parse(s.querySelector('#bx').value.trim());}catch(x){er.textContent='內容格式不正確，請確認是完整的備份文字';return;}
      if(!o||!Array.isArray(o.cats)||!o.cats.every(function(c){return c&&Array.isArray(c.items);})){er.textContent='這不是打包清單的備份資料';return;}
      delete o.app;delete o.exported;state=o;migrate();state.updated=Date.now();ui.cur=null;
      closeSheet();commit();render(true);setTimeout(function(){loadWx(false);},400);
    });
  });
}
function resetSheet(){
  var T=total(),hasTrip=state.flights.length||state.stops.length;
  sheet('<h3>重設清單，準備下一趟？</h3><p>會把「'+esc(state.trip)+'」（已打包 '+T.d+' / '+T.t+' 件）記到旅程紀錄，然後取消所有勾選。你新增的打包項目都會保留。</p>'+
    (hasTrip?'<label style="display:flex;align-items:center;gap:10px;font-size:15px;margin:-4px 0 18px"><input type="checkbox" id="cl" checked style="width:20px;height:20px;accent-color:#ff6a5c">一併清除航班與停留地</label>':'')+
    '<div class="acts"><button data-s="cancel">取消</button><button data-s="ok" class="ok">重設</button></div>',
  function(s){s.querySelector('[data-s="ok"]').addEventListener('click',function(){
    var clr=s.querySelector('#cl'),d=new Date(),ds=d.getFullYear()+'/'+String(d.getMonth()+1).padStart(2,'0')+'/'+String(d.getDate()).padStart(2,'0');
    var ms=mainStop(),dest=ms?short(cityOf(ms.code,ms)):'';
    if(T.d>0){state.log.push({date:ds,trip:state.trip+(dest?' · '+dest:''),d:T.d,t:T.t});if(state.log.length>50)state.log=state.log.slice(-50);}
    state.cats.forEach(function(c){c.items.forEach(function(i){i.d=false;});});
    if(clr&&clr.checked){state.flights=[];state.stops=[];state.wx={};}
    state.trip='下一趟旅程';ui.todo=false;ui.view='pack';saveUI();closeSheet();commit();render();window.scrollTo({top:0,behavior:'smooth'});});});
}

/* ---------- 互動 ---------- */
app.addEventListener('submit',function(e){
  e.preventDefault();var c=curCat(),inp=document.getElementById('addin'),v=inp.value.trim();
  if(!v){inp.focus();return;}c.items.push({id:uid(),t:v,d:false});commit();render();
});
app.addEventListener('click',function(e){
  var b=e.target.closest('[data-act]');if(!b)return;
  var act=b.dataset.act,c=curCat(),tile=b.closest('[data-item]'),it=null;
  if(tile&&c)c.items.forEach(function(x){if(x.id===tile.dataset.item)it=x;});
  function byId(arr){var r=null;arr.forEach(function(x){if(x.id===b.dataset.id)r=x;});return r;}
  switch(act){
    case 'toggle':
      it.d=!it.d;tile.classList.toggle('on',it.d);commit();refresh(c);
      if(ui.todo&&it.d){setTimeout(function(){tile.classList.add('leaving');},250);setTimeout(render,580);}
      break;
    case 'view':setView(b.dataset.v);break;
    case 'view-trip':setView('trip');break;
    case 'view-wx':setView('wx');break;
    case 'addmenu':addMenu();break;
    case 'photo':photoSheet();break;
    case 'tab':ui.cur=b.dataset.id;ui.adding=false;saveUI();render(true);break;
    case 'todo':ui.todo=!ui.todo;saveUI();render(true);break;
    case 'edit':ui.edit=!ui.edit;ui.adding=false;render();break;
    case 'addopen':ui.adding=true;render();break;
    case 'addcancel':ui.adding=false;render();break;
    case 'delitem':e.stopPropagation();
      var t=b.closest('[data-item]'),id=t.dataset.item;t.classList.add('leaving');
      setTimeout(function(){c.items=c.items.filter(function(x){return x.id!==id;});commit();render();},280);break;
    case 'renitem':itemSheet(it);break;
    case 'cstog':ui.clClosed=!ui.clClosed;saveUI();render();break;
    case 'biz':state.biz=!isBiz();commit();render();break;
    case 'capply':var n=clothesApply();ui.clClosed=true;saveUI();commit();render();toast('已更新 '+n+' 個項目的數量');break;
    case 'catedit':catSheet(c);break;
    case 'newcat':catSheet(null);break;
    case 'trip':tripSheet();break;
    case 'menu':menuSheet();break;
    case 'reset':resetSheet();break;
    case 'addflight':flightSheet(null);break;
    case 'editflight':flightSheet(byId(state.flights));break;
    case 'addstop':stopSheet(null);break;
    case 'editstop':stopSheet(byId(state.stops));break;
    case 'wxreload':loadWx(true);break;
  }
});
document.body.classList.add('intro');render(true);setTimeout(swipeTip,1600);setTimeout(function(){loadWx(false);},300);setTimeout(function(){document.body.classList.remove('intro');},2800);
})();
</script>
