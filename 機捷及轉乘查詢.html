<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="機捷轉乘">
<meta name="theme-color" content="#0C0C0E">
<title>桃園機捷時刻查詢</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;600;700&display=swap');
:root{
  --bg:#0C0C0E;--card:#18181C;--card2:#222226;
  --copper:#D4956B;--copper-l:#E8B898;--copper-d:#B87A4F;
  --copper-g:rgba(212,149,107,.15);--copper-g2:rgba(212,149,107,.08);
  --text:#F0EBE6;--text2:#8A8488;--text3:#5A5558;--border:#2A2A2E;
  --express:#D4956B;--commuter:#7A9EC2;
  --ok:#6BBF7B;--err:#E05A5A;--r:16px;
}
*{margin:0;padding:0;box-sizing:border-box}
html{-ms-text-size-adjust:100%;-webkit-text-size-adjust:100%;touch-action:manipulation}
body{font-family:'Noto Sans TC',-apple-system,system-ui,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;-webkit-font-smoothing:antialiased;overflow-x:hidden}
input,select,textarea{font-size:16px!important;touch-action:manipulation}
.app{max-width:430px;margin:0 auto;padding-bottom:100px;position:relative}

/* Hero */
.hero{position:relative;padding:56px 24px 32px;overflow:hidden;
  background:linear-gradient(180deg,#3D2A1A 0%,#C4794C 35%,#D4956B 50%,#B87A4F 65%,#2A1D14 85%,var(--bg) 100%)}
.hero::before{content:'';position:absolute;top:30%;left:50%;transform:translate(-50%,-50%);width:280px;height:280px;
  background:radial-gradient(circle,rgba(255,220,180,.35) 0%,rgba(212,149,107,.15) 40%,transparent 70%);border-radius:50%;pointer-events:none}
.hero::after{content:'';position:absolute;bottom:0;left:0;right:0;height:80px;background:linear-gradient(180deg,transparent,var(--bg));pointer-events:none}
.hero-top{display:flex;align-items:center;justify-content:space-between;position:relative;z-index:1;margin-bottom:24px}
.hero-brand{display:flex;align-items:center;gap:8px}
.hero-logo{font-size:22px;opacity:.9}.hero-name{font-size:18px;font-weight:700;letter-spacing:1px}
.hero-loc{font-size:11px;color:rgba(255,255,255,.7);background:rgba(255,255,255,.12);padding:4px 12px;border-radius:20px;display:flex;align-items:center;gap:6px}
.hero-status{width:7px;height:7px;border-radius:50%;flex-shrink:0}
.hero-status.live{background:#6BBF7B;box-shadow:0 0 6px #6BBF7B;animation:pulse 2s infinite}
.hero-status.offline{background:#8A8488}
.hero-status.err{background:#E05A5A}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.3}}

.date-strip{display:flex;justify-content:center;gap:6px;position:relative;z-index:1;margin-bottom:28px}
.date-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer}
.date-num{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;
  background:rgba(255,255,255,.1);color:rgba(255,255,255,.7)}
.date-item.active .date-num{background:rgba(255,255,255,.25);color:#fff;box-shadow:0 0 20px rgba(255,255,255,.15);font-size:16px;width:46px;height:46px}
.date-day{font-size:10px;color:rgba(255,255,255,.5);font-weight:500}
.date-item.active .date-day{color:rgba(255,255,255,.85)}

.hero-time{text-align:center;position:relative;z-index:1;margin-bottom:8px}
.hero-time .big{font-size:48px;font-weight:300;letter-spacing:4px;color:#fff}
.hero-time .label{font-size:12px;color:rgba(255,255,255,.5);margin-top:2px}

/* Favs */
.fav-bar{padding:16px 20px 0;display:flex;gap:8px;overflow-x:auto;scrollbar-width:none}
.fav-bar::-webkit-scrollbar{display:none}
.fav-bar:empty{display:none}
.fav-chip{flex-shrink:0;display:flex;align-items:center;gap:6px;padding:8px 14px;background:var(--card);border:1px solid var(--border);border-radius:20px;font-size:12px;font-weight:500;cursor:pointer;white-space:nowrap;color:var(--text2);transition:all .2s}
.fav-chip:hover{border-color:var(--copper);color:var(--copper)}
.fav-chip .fs{color:var(--copper);font-size:10px}
.fav-chip .fa{opacity:.4;font-size:11px}
.fav-chip .fd{opacity:.3;font-size:13px;margin-left:2px;transition:all .2s}
.fav-chip:hover .fd{opacity:1;color:var(--err)}

/* Selector */
.sel-area{padding:16px 20px}
.sel-card{background:var(--card2);border-radius:var(--r);overflow:hidden;border:1px solid rgba(212,149,107,.15)}
.stn-row{display:flex;align-items:center;padding:0 18px;height:62px;gap:14px;cursor:pointer;transition:background .15s;position:relative}
.stn-row:hover{background:var(--copper-g2)}
.stn-dot{width:12px;height:12px;border-radius:50%;border:2.5px solid var(--copper);flex-shrink:0}
.stn-dot.dest{background:var(--copper)}
.stn-line{position:absolute;left:32px;width:2px;background:var(--copper);opacity:.4}
.ol{top:40px;height:22px}.dl{top:0;height:22px}
.stn-lbl{font-size:11px;color:var(--copper);font-weight:600;width:32px;flex-shrink:0}
.stn-disp{flex:1;font-size:15px;font-weight:600}
.stn-disp.ph{color:var(--text2);font-weight:400}
.stn-chev{color:var(--text2);font-size:13px}

.swap-zone{display:flex;justify-content:center;position:relative;height:0;z-index:2}
.swap-btn{position:absolute;top:-19px;width:38px;height:38px;border-radius:50%;border:3px solid var(--card2);background:var(--copper);color:#fff;display:flex;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 16px rgba(212,149,107,.3);transition:transform .3s,background .2s}
.swap-btn:hover{background:var(--copper-d)}
.swap-btn:active{transform:rotate(180deg)}
.swap-btn svg{width:16px;height:16px}

/* Actions */
.actions{padding:0 20px;margin-top:14px;display:flex;gap:10px}
.btn-pri{flex:1;height:50px;border:none;border-radius:25px;font-size:15px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:8px;font-family:inherit;background:var(--copper);color:#fff;transition:all .2s}
.btn-pri:hover{background:var(--copper-d)}
.btn-pri:disabled{background:var(--card2);color:var(--text3);cursor:not-allowed}
.btn-fav{width:50px;height:50px;border:1.5px solid var(--border);border-radius:50%;background:var(--card);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0;color:var(--text3);transition:all .2s}
.btn-fav:hover{border-color:var(--copper)}
.btn-fav.is-fav{color:var(--copper);border-color:var(--copper);background:var(--copper-g)}

/* Settings panel */
.settings{margin:14px 20px 0;background:var(--card);border-radius:var(--r);border:1px solid var(--border);overflow:hidden}
.set-hd{display:flex;align-items:center;gap:8px;padding:14px 18px;cursor:pointer}
.set-hd .set-ic{color:var(--copper);font-size:14px}
.set-hd .set-tt{flex:1;font-size:13px;font-weight:600;color:var(--copper)}
.set-hd .set-tg{font-size:11px;color:var(--text3);transition:transform .3s}
.set-hd .set-tg.open{transform:rotate(180deg)}
.set-bd{display:none;padding:0 18px 16px}
.set-bd.show{display:block}
.set-desc{font-size:11px;color:var(--text3);line-height:1.6;margin-bottom:12px}
.set-desc a{color:var(--copper);text-decoration:none}
.set-row{margin-bottom:10px}
.set-row label{display:block;font-size:11px;color:var(--text2);margin-bottom:4px;font-weight:500}
.set-row input{width:100%;height:44px;border:1px solid var(--border);border-radius:10px;padding:0 14px;font-size:16px;font-family:inherit;background:var(--card2);color:var(--text);outline:none}
.set-row input:focus{border-color:var(--copper)}
.set-row input::placeholder{color:var(--text3)}
.set-actions{display:flex;gap:8px}
.set-btn{flex:1;height:38px;border:none;border-radius:19px;font-size:13px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .2s}
.set-btn.pri{background:var(--copper);color:#fff}
.set-btn.pri:hover{background:var(--copper-d)}
.set-btn.sec{background:var(--card2);color:var(--text2);border:1px solid var(--border)}
.set-status{margin-top:10px;padding:10px;border-radius:8px;font-size:11px;line-height:1.5;display:none;white-space:pre-wrap;word-break:break-all}
.set-status.ok{display:block;background:rgba(107,191,123,.1);color:var(--ok)}
.set-status.err{display:block;background:rgba(224,90,90,.1);color:var(--err)}
.set-status.info{display:block;background:var(--copper-g2);color:var(--text2)}

/* Results */
.results-area{padding:16px 20px}
.res-hd{display:flex;align-items:center;justify-content:space-between;margin-bottom:14px}
.res-title{font-size:16px;font-weight:700}
.res-route{font-size:11px;color:var(--text2)}
.ftabs{display:flex;gap:4px;margin-bottom:16px;background:var(--card);padding:3px;border-radius:25px;border:1px solid var(--border)}
.ftab{flex:1;height:32px;border:none;border-radius:22px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;background:transparent;color:var(--text3);transition:all .2s}
.ftab.act{background:var(--copper);color:#fff}

.tc{background:var(--card);border-radius:14px;padding:16px 18px;margin-bottom:8px;display:flex;align-items:center;gap:14px;position:relative;overflow:hidden;border:1px solid var(--border);transition:border-color .2s}
.tc.nt{border-color:var(--copper)}
.tc.nt::after{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,var(--copper),var(--copper-l),var(--copper))}
.next-lbl{position:absolute;top:6px;right:12px;font-size:9px;font-weight:600;color:var(--copper);letter-spacing:.5px}
.tc-badge{width:42px;flex-shrink:0;text-align:center}
.tc-badge .bd{display:inline-block;padding:4px 0;width:42px;border-radius:8px;font-size:10px;font-weight:700}
.bd.eb{background:var(--copper-g);color:var(--copper)}
.bd.cb{background:rgba(122,158,194,.12);color:var(--commuter)}
.tc-times{flex:1;display:flex;align-items:center;gap:8px}
.tc-t{text-align:center}
.tc-t .tl{font-size:9px;color:var(--text3);margin-bottom:3px;font-weight:500}
.tc-t .tv{font-size:20px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px}
.tc-arr{color:var(--text3);font-size:14px;flex-shrink:0}
.tc-dur{text-align:right;flex-shrink:0}
.tc-dur .dv{font-size:15px;font-weight:600;color:var(--copper)}
.tc-dur .dl2{font-size:9px;color:var(--text3)}
.no-res{text-align:center;padding:40px 20px;color:var(--text3)}
.no-res .nri{font-size:36px;margin-bottom:12px;opacity:.5}
.empty-st{text-align:center;padding:48px 30px;color:var(--text3)}
.empty-st .esi{font-size:44px;margin-bottom:16px;opacity:.5}
.empty-st .est{font-size:15px;font-weight:600;color:var(--text);margin-bottom:6px}
.empty-st .ess{font-size:12px;line-height:1.7;color:var(--text2)}
.load-more{text-align:center;padding:12px}
.load-more button{background:transparent;border:1px solid var(--border);border-radius:20px;padding:8px 28px;font-size:12px;color:var(--copper);cursor:pointer;font-family:inherit;font-weight:500}
.load-more button:hover{background:var(--copper-g)}

/* ===== LIVE TRACKER ===== */
.tracker{margin:0 0 16px;background:var(--card);border-radius:var(--r);border:1px solid var(--copper);overflow:hidden;position:relative}
.tracker::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:linear-gradient(90deg,transparent,var(--copper),var(--copper-l),var(--copper),transparent)}
.tracker-top{display:flex;align-items:center;padding:18px 20px 0}
.tracker-badge{display:flex;align-items:center;gap:8px;flex:1}
.tracker-badge .trkb{font-size:10px;font-weight:700;padding:4px 10px;border-radius:6px}
.tracker-badge .trk-status{font-size:11px;color:var(--text2);font-weight:500}
.tracker-countdown{text-align:right}
.tracker-countdown .cd-num{font-size:72px;font-weight:700;letter-spacing:2px;font-variant-numeric:tabular-nums;color:var(--copper-l);line-height:1}
.tracker-countdown .cd-lbl{font-size:10px;color:var(--text3);margin-top:-2px}

.tracker-times{display:flex;align-items:center;justify-content:center;gap:16px;padding:12px 20px 0;font-size:13px;color:var(--text2)}
.tracker-times .tt-dep,.tracker-times .tt-arr{font-weight:600;color:var(--text);font-size:15px;font-variant-numeric:tabular-nums}
.tracker-times .tt-arrow{color:var(--text3);font-size:12px}
.tracker-times .tt-dur{font-size:11px;color:var(--copper);font-weight:600;margin-left:4px}

/* Track animation */
.track-wrap{padding:20px 20px 18px;position:relative}
.track-line{position:relative;height:40px;display:flex;align-items:center}
.track-rail{position:absolute;left:16px;right:16px;height:3px;background:var(--border);border-radius:2px;top:50%;transform:translateY(-50%)}
.track-progress{position:absolute;left:16px;height:3px;background:linear-gradient(90deg,var(--copper),var(--copper-l));border-radius:2px;top:50%;transform:translateY(-50%);transition:width .8s ease}
.track-train{position:absolute;width:22px;height:22px;border-radius:50%;background:var(--copper);border:3px solid var(--bg);display:flex;align-items:center;justify-content:center;font-size:10px;top:50%;transform:translate(-50%,-50%);transition:left .8s ease;z-index:3;box-shadow:0 0 12px rgba(212,149,107,.5),0 0 24px rgba(212,149,107,.2)}
.track-train::after{content:'';position:absolute;inset:-4px;border-radius:50%;border:2px solid rgba(212,149,107,.3);animation:trainPulse 2s infinite}
@keyframes trainPulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:0;transform:scale(1.6)}}

.track-stations{position:relative;display:flex;justify-content:space-between;padding:0 10px;margin-top:4px}
.track-stn{display:flex;flex-direction:column;align-items:center;position:relative;z-index:2}
.track-stn-dot{width:10px;height:10px;border-radius:50%;background:var(--border);border:2px solid var(--card);margin-bottom:4px;transition:background .3s}
.track-stn-dot.passed{background:var(--copper)}
.track-stn-dot.origin,.track-stn-dot.dest{width:12px;height:12px;background:var(--copper)}
.track-stn-name{font-size:9px;color:var(--text3);white-space:nowrap;max-width:48px;overflow:hidden;text-overflow:ellipsis;text-align:center}
.track-stn-name.endpoint{color:var(--text);font-weight:600;font-size:10px;max-width:60px}

.tracker-eta{text-align:center;padding:0 20px 16px;font-size:12px;color:var(--text2)}
.tracker-eta strong{color:var(--copper-l);font-size:14px;font-weight:600}
.track-stn-dot.prev{width:10px;height:10px;border:2px dashed var(--text3);background:transparent}
.track-stn-dot.prev.passed{border-style:solid;border-color:var(--copper);background:var(--copper)}
@keyframes cardFlash{0%{opacity:.4;transform:scale(.97)}100%{opacity:1;transform:scale(1)}}

/* Mini tracker (en-route, shrunk) */
.tracker-mini{margin:0 0 10px;background:var(--card);border-radius:12px;border:1px solid var(--border);padding:12px 16px;display:flex;align-items:center;gap:12px;position:relative;overflow:hidden}
.tracker-mini::before{content:'';position:absolute;top:0;left:0;right:0;height:2px;background:var(--ok)}
.tm-badge span{display:inline-block;padding:3px 8px;border-radius:5px;font-size:9px;font-weight:700}
.tm-info{flex:1;display:flex;align-items:center;gap:8px;font-size:12px}
.tm-info .tm-times{font-weight:600;font-variant-numeric:tabular-nums}
.tm-info .tm-arrow{color:var(--text3);font-size:10px}
.tm-info .tm-status{color:var(--ok);font-size:10px;font-weight:600}
.tm-cd{text-align:right;flex-shrink:0}
.tm-cd .tm-cd-num{font-size:18px;font-weight:300;color:var(--ok);font-variant-numeric:tabular-nums;letter-spacing:1px}
.tm-cd .tm-cd-lbl{font-size:9px;color:var(--text3)}
.tm-progress{position:absolute;bottom:0;left:0;height:2px;background:var(--ok);transition:width .8s ease}

/* Tab bar */
.tab-bar{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:430px;padding:10px 16px calc(10px + env(safe-area-inset-bottom));background:rgba(12,12,14,.88);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-top:1px solid rgba(255,255,255,.06);display:flex;align-items:center;justify-content:space-around;z-index:50}
.tab-item{display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;padding:6px 10px;color:var(--text3);transition:color .2s;-webkit-tap-highlight-color:transparent;user-select:none}
.tab-item.active{color:var(--copper)}
.tab-item .tab-ic{font-size:22px;line-height:1}
.tab-item .tab-lb{font-size:12px;font-weight:600;letter-spacing:.3px}
.tab-center{width:56px;height:56px;border-radius:50%;background:var(--copper);display:flex;align-items:center;justify-content:center;font-size:24px;color:#fff;cursor:pointer;box-shadow:0 4px 20px rgba(212,149,107,.35);margin-top:-22px;transition:transform .15s;-webkit-tap-highlight-color:transparent;user-select:none}
.tab-center:active{transform:scale(.9)}

/* Modal */
.modal-ov{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:100;display:none;align-items:flex-end;justify-content:center;backdrop-filter:blur(6px)}
.modal-ov.show{display:flex}
.modal{background:var(--card);width:100%;max-width:430px;max-height:85vh;border-radius:24px 24px 0 0;overflow:hidden;display:flex;flex-direction:column;animation:slideUp .3s ease-out}
@keyframes slideUp{from{transform:translateY(100%)}to{transform:translateY(0)}}
.modal-hd{padding:20px 20px 14px;display:flex;align-items:center;justify-content:space-between}
.modal-hd h2{font-size:17px;font-weight:700}
.modal-cl{width:30px;height:30px;border-radius:50%;border:none;background:var(--card2);cursor:pointer;font-size:14px;display:flex;align-items:center;justify-content:center;color:var(--text2)}
.modal-sr{padding:0 20px 12px}
.modal-sr input{width:100%;height:44px;border:1px solid var(--border);border-radius:22px;padding:0 18px;font-size:16px;font-family:inherit;background:var(--card2);color:var(--text);outline:none}
.modal-sr input:focus{border-color:var(--copper)}
.modal-sr input::placeholder{color:var(--text3)}
.stn-list{flex:1;overflow-y:auto;padding:4px 0 28px}
.stn-item{display:flex;align-items:center;padding:14px 20px;gap:14px;cursor:pointer;transition:background .15s}
.stn-item:hover{background:var(--copper-g2)}
.stn-item.sel{background:var(--copper-g)}
.stn-item.dis{opacity:.25;cursor:not-allowed}
.stn-code{font-size:11px;font-weight:700;color:var(--bg);background:var(--copper);width:38px;height:24px;border-radius:7px;display:flex;align-items:center;justify-content:center;flex-shrink:0}
.stn-code.co{background:var(--commuter)}
.stn-info{flex:1}
.stn-info .nm{font-size:15px;font-weight:600}
.stn-info .tgs{display:flex;gap:6px;margin-top:3px}
.tg{font-size:9px;padding:2px 7px;border-radius:4px;font-weight:600}
.tg.ex{background:var(--copper-g);color:var(--copper)}
.tg.cm{background:rgba(122,158,194,.1);color:var(--commuter)}
.stn-chk{color:var(--copper);font-size:16px;font-weight:700}

.toast{position:fixed;bottom:100px;left:50%;transform:translateX(-50%) translateY(60px);background:var(--card2);color:var(--text);border:1px solid var(--border);padding:10px 22px;border-radius:25px;font-size:13px;font-weight:500;z-index:200;transition:transform .3s,opacity .3s;pointer-events:none;white-space:nowrap;opacity:0}
.toast.show{transform:translateX(-50%) translateY(0);opacity:1}
.disclaimer{text-align:center;padding:20px 24px;font-size:10px;color:var(--text3);line-height:1.6}

/* 返家按鈕（hero 內） */
.home-wrap{position:relative;z-index:1;display:none;flex-direction:column;align-items:center;gap:10px;margin-top:18px}
.home-wrap.show{display:flex}
.home-seg{display:flex;padding:3px;border-radius:20px;background:rgba(12,12,14,.35);border:1px solid rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.home-seg button{height:32px;padding:0 16px;border:none;border-radius:16px;background:transparent;color:rgba(255,255,255,.65);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;-webkit-tap-highlight-color:transparent}
.mode-seg button{font-size:12px;padding:0 11px;height:30px;white-space:nowrap}
.home-seg button.act{background:rgba(255,255,255,.92);color:#2A1D14}
.home-seg button:focus-visible{outline:2px solid #fff;outline-offset:2px}
.home-when{display:flex;gap:8px;align-items:center}
.home-when>button,.when-time{height:36px;border-radius:18px;border:1px solid rgba(255,255,255,.2);background:rgba(12,12,14,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:rgba(255,255,255,.7);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.home-when>button{padding:0 16px}
.home-when>button.act,.when-time.act{background:rgba(255,255,255,.92);color:#2A1D14;border-color:transparent}
.when-time{display:flex;align-items:center;gap:8px;padding:0 14px}
.when-time b{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:1px}
.when-time svg{opacity:.55}

/* 高鐵站 chip（hero）與選擇器 */
.hsr-chip{display:flex;align-items:center;gap:8px;height:32px;padding:0 6px 0 14px;border-radius:16px;border:1px solid rgba(255,255,255,.2);background:rgba(12,12,14,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.hsr-chip i{width:8px;height:8px;border-radius:50%;background:var(--hsr)}
.hsr-chip span{font-size:11px;font-weight:500;color:rgba(255,255,255,.7);background:rgba(255,255,255,.12);padding:3px 9px;border-radius:11px}
.hs-body{padding:0 20px;overflow-y:auto}
.hs-sec{margin-bottom:14px}
.hs-tt{font-size:12px;color:var(--text2);font-weight:600;margin-bottom:8px}
.hs-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.hs-st{position:relative;height:44px;border-radius:10px;border:1px solid var(--border);background:var(--card2);color:var(--text);font-family:inherit;font-size:14px;font-weight:500;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.hs-st small{font-size:9px;color:var(--text3);font-weight:500;margin-top:2px}
.hs-st:hover{border-color:var(--hsr)}
.hs-st:disabled{opacity:.25;cursor:not-allowed;border-color:var(--border)}
.hs-st.on{background:var(--hsr);border-color:var(--hsr);color:#1A0F08;font-weight:700}
.hs-st.on small{color:rgba(26,15,8,.7)}
.hs-hint{font-size:11px;color:var(--text3);padding:0 20px;line-height:1.6}
/* ===== 滾輪時間選擇 ===== */
.wh-modal{padding-bottom:calc(18px + env(safe-area-inset-bottom))}
.wh-grab{width:38px;height:4px;border-radius:2px;background:var(--border);margin:10px auto 0}
.wh-date{text-align:center;font-size:12px;color:var(--text2);margin:-4px 0 6px}
.wh-read{text-align:center;font-size:14px;margin-top:-6px;color:var(--copper-l);font-weight:600;min-height:20px;margin-bottom:8px}
.wh-wrap{position:relative;display:flex;justify-content:center;align-items:center;gap:6px;height:220px;margin:0 24px;
  -webkit-mask-image:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent 100%);mask-image:linear-gradient(180deg,transparent 0,#000 30%,#000 70%,transparent 100%)}
.wh-band{position:absolute;left:0;right:0;top:88px;height:44px;border-radius:12px;background:var(--copper-g);border:1px solid rgba(212,149,107,.35);pointer-events:none}
.wh-col{position:relative;width:88px;height:220px;overflow-y:scroll;scroll-snap-type:y mandatory;overscroll-behavior:contain;scrollbar-width:none;perspective:600px;outline:none;-webkit-overflow-scrolling:touch}
.wh-col::-webkit-scrollbar{display:none}
.wh-col:focus-visible{box-shadow:inset 0 0 0 2px var(--copper);border-radius:12px}
.wh-pad{height:88px}
.wh-it{height:44px;display:flex;align-items:center;justify-content:center;scroll-snap-align:center;font-size:22px;font-weight:300;color:var(--text2);font-variant-numeric:tabular-nums;letter-spacing:1px;cursor:pointer;transform-origin:center;will-change:transform,opacity;user-select:none;-webkit-user-select:none}
.wh-it.on{color:var(--text);font-weight:500;font-size:28px}
.wh-colon{font-size:28px;font-weight:300;color:var(--copper);padding-bottom:4px;position:relative;z-index:1}
.wh-unit{position:absolute;top:100px;font-size:11px;color:var(--text3);pointer-events:none}
.wh-quick{display:flex;justify-content:center;gap:8px;margin:14px 20px 0;flex-wrap:wrap}
.wh-quick button{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--border);background:var(--card2);color:var(--text2);font-family:inherit;font-size:12px;font-weight:500;cursor:pointer}
.wh-quick button:hover{border-color:var(--copper);color:var(--copper)}
.wh-act{display:flex;gap:10px;margin:16px 20px 0}
.wh-act button{flex:1;height:48px;border-radius:24px;font-family:inherit;font-size:15px;font-weight:600;cursor:pointer;border:none}
.wh-now{background:var(--card2)!important;color:var(--text2);border:1px solid var(--border)!important}
.wh-ok{background:var(--copper);color:#fff}
.wh-ok:hover{background:var(--copper-d)}
@media (prefers-reduced-motion:reduce){.wh-it{transform:none!important}}
.when-lbl{font-size:11px;color:rgba(255,255,255,.6);margin-top:-2px}
.date-item{-webkit-tap-highlight-color:transparent}
.date-item:focus-visible .date-num{outline:2px solid #fff;outline-offset:2px}
.home-btn{position:relative;display:flex;margin:0;height:48px;padding:0 26px;border-radius:24px;border:1px solid rgba(255,255,255,.35);background:rgba(12,12,14,.35);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);color:#fff;font-family:inherit;font-size:16px;font-weight:700;letter-spacing:2px;justify-content:center;min-width:160px;cursor:pointer;align-items:center;gap:10px;-webkit-tap-highlight-color:transparent}
.home-btn:active{transform:scale(.97)}
.home-btn small{font-size:11px;font-weight:500;color:rgba(255,255,255,.7)}
.home-btn:focus-visible{outline:2px solid #fff;outline-offset:3px}
/* ===== 頁籤可見性 ===== */
body:not(.tab-xfer) .date-strip,body:not(.tab-xfer) .home-wrap,body:not(.tab-xfer) #xferCont{display:none!important}
body.tab-xfer .fav-bar,body.tab-xfer .sel-area,body.tab-xfer .actions,body.tab-xfer #resCont{display:none!important}
body.tab-settings .fav-bar,body.tab-settings .sel-area,body.tab-settings .actions{display:none!important}
body:not(.tab-xfer) .hero-time{margin-bottom:0}
/* ===== 轉乘規劃 (機捷 + 高鐵 + 台鐵) ===== */
:root{--mrt:#A58BE3;--hsr:#FF7A3D;--tra:#6C9DF0;--wait:#3A3A40}
.xfer{padding:8px 20px 4px}
.xfer:empty{display:none}
.xf-hd{display:flex;align-items:baseline;justify-content:space-between;margin:8px 0 12px}
.xf-title{font-size:16px;font-weight:700}
.xf-upd{font-size:11px;color:var(--text3);background:none;border:none;font-family:inherit;cursor:pointer;padding:4px 0}
.xf-upd:hover{color:var(--copper)}
.xf-ctrl{display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap}
.xf-home{display:flex;align-items:center;gap:6px;height:34px;padding:0 12px;border-radius:17px;background:var(--card);border:1px solid var(--border);font-size:12px;color:var(--text);cursor:pointer;font-family:inherit}
.xf-home i{width:8px;height:8px;border-radius:50%;background:var(--mrt);font-style:normal}
.xf-home .chev{color:var(--text3)}
.xf-off{display:flex;background:var(--card);border:1px solid var(--border);border-radius:17px;padding:2px;height:34px}
.xf-off button{border:none;background:transparent;color:var(--text3);font-family:inherit;font-size:12px;font-weight:600;padding:0 10px;border-radius:15px;cursor:pointer}
.xf-off button.act{background:var(--copper);color:#fff}
.xf-alert{font-size:11px;line-height:1.6;color:#F2C46B;background:rgba(242,196,107,.08);border:1px solid rgba(242,196,107,.25);border-radius:10px;padding:8px 12px;margin-bottom:12px}

.xd{background:var(--card);border:1px solid var(--border);border-radius:var(--r);margin-bottom:12px;overflow:hidden}
.xd-hd{display:flex;align-items:center;justify-content:space-between;padding:16px 18px 0}
.xd-dir{font-size:13px;font-weight:700}
.xd-dir small{color:var(--text3);font-weight:500;margin-left:6px;font-size:11px}
.xd-cd{font-size:11px;color:var(--copper-l);font-variant-numeric:tabular-nums}
.xd-sum{display:flex;align-items:flex-end;gap:10px;padding:12px 18px 0}
.xd-big{font-size:34px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px;line-height:1}
.xd-big sup{font-size:10px;color:var(--text3);letter-spacing:0;margin-left:2px;vertical-align:top}
.xd-lbl{font-size:10px;color:var(--text3);margin-bottom:4px}
.xd-mid{flex:1;text-align:center;padding-bottom:4px}
.xd-mid .tot{font-size:13px;font-weight:600;color:var(--copper)}
.xd-mid .xfn{font-size:10px;color:var(--text3)}
.xd-tags{display:flex;gap:6px;padding:10px 18px 0;flex-wrap:wrap}
.xtag{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;background:var(--copper-g);color:var(--copper)}
.xtag.g{background:rgba(107,191,123,.12);color:var(--ok)}
.xtag.r{background:rgba(224,90,90,.12);color:var(--err)}

/* journey strip: time-proportional, one segment per leg, gaps = waiting */
.xstrip{display:flex;height:8px;margin:14px 18px 0;border-radius:4px;overflow:hidden;background:var(--wait);gap:2px}
.xstrip b{display:block;height:100%}
.xstrip .mrt{background:var(--mrt)}.xstrip .hsr{background:var(--hsr)}.xstrip .tra{background:var(--tra)}.xstrip .w{background:var(--wait)}

.xtl{padding:16px 18px 8px}
.xleg{position:relative}
.xleg::before{content:'';position:absolute;left:62px;top:11px;bottom:11px;width:3px;border-radius:2px;background:var(--m)}
.xrow{display:flex;align-items:center;min-height:24px}
.xt{width:46px;padding-right:11px;text-align:right;font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;flex-shrink:0}
.xt small{display:block;font-size:9px;color:var(--text3);font-weight:500;line-height:1}
.xdot{width:11px;height:11px;border-radius:50%;border:2.5px solid var(--m);background:var(--card);flex-shrink:0;position:relative;z-index:1;margin-left:1px;margin-right:12px}
.xs{font-size:13px;font-weight:600}
.xride{padding:6px 0 8px 82px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:11px;color:var(--text2)}
.xb{font-size:10px;font-weight:700;padding:3px 8px;border-radius:6px;color:#0C0C0E;background:var(--m)}
.xdl{font-size:10px;font-weight:600}
.xdl.ok{color:var(--ok)}.xdl.late{color:var(--err)}
.xopt{margin:0 0 10px 82px;padding:8px 10px 6px;border-radius:10px;background:rgba(108,157,240,.06);border:1px solid rgba(108,157,240,.18)}
.xopt-tt{font-size:10px;color:var(--text3);margin-bottom:4px}
.xopt-r{display:grid;grid-template-columns:26px 38px 1fr auto;align-items:center;column-gap:6px;font-size:12px;color:var(--text2);padding:3px 0;font-variant-numeric:tabular-nums}
.xopt-tr{display:flex;align-items:center;gap:4px;min-width:0;white-space:nowrap;overflow:hidden}
.xopt-a{text-align:right;white-space:nowrap}
.xopt-a small{display:block;font-size:9px;color:var(--text3);line-height:1}
.xopt-r b{font-weight:600;color:var(--text2)}
.xopt-r.on b,.xopt-r.on .xopt-a{color:var(--text)}
.xopt-n{font-size:10px;font-weight:700;color:var(--text3);width:30px}
.xopt-r.on .xopt-n{color:var(--tra)}
.xopt-no{color:var(--text3);font-size:11px}
.xwalk{position:relative;padding:8px 0 8px 82px;font-size:11px;color:var(--text3)}
.xwalk::before{content:'';position:absolute;left:62px;top:2px;bottom:2px;border-left:3px dotted var(--text3);opacity:.6}
.xwalk.tight{color:var(--err)}

.xalts{border-top:1px solid var(--border)}
.xalt{display:flex;align-items:center;gap:12px;padding:12px 18px;cursor:pointer;border-bottom:1px solid var(--border)}
.xalt:last-child{border-bottom:none}
.xalt:hover{background:var(--copper-g2)}
.xa-t{font-size:14px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
.xa-strip{flex:1;display:flex;height:5px;border-radius:3px;overflow:hidden;gap:2px;background:var(--wait)}
.xa-strip b{display:block;height:100%}
.xa-strip .mrt{background:var(--mrt)}.xa-strip .hsr{background:var(--hsr)}.xa-strip .tra{background:var(--tra)}.xa-strip .w{background:var(--wait)}
.xa-d{font-size:12px;color:var(--text2);font-variant-numeric:tabular-nums;white-space:nowrap}
.xalt-body{display:none;border-bottom:1px solid var(--border);background:var(--card2)}
.xalt-body.show{display:block}
.xalt-body .xleg::before{}
.xalt-body .xdot{background:var(--card2)}
.xd-more{font-size:11px;color:var(--text3);padding:10px 18px}
.xd-msg{padding:22px 18px;font-size:12px;color:var(--text2);line-height:1.7}
.xd-msg button{margin-top:10px;height:36px;padding:0 18px;border:none;border-radius:18px;background:var(--copper);color:#fff;font-family:inherit;font-size:13px;font-weight:600;cursor:pointer}
.xd-load{padding:26px 18px;font-size:12px;color:var(--text3);display:flex;align-items:center;gap:10px}
.xd-load i{width:14px;height:14px;border-radius:50%;border:2px solid var(--border);border-top-color:var(--copper);animation:xspin .8s linear infinite}
@keyframes xspin{to{transform:rotate(360deg)}}
.xlegend{display:flex;gap:14px;font-size:10px;color:var(--text3);margin:-4px 0 12px}
.xlegend span{display:flex;align-items:center;gap:5px}
.xlegend i{width:10px;height:4px;border-radius:2px}
.set-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.set-row select{width:100%;height:44px;border:1px solid var(--border);border-radius:10px;padding:0 12px;font-family:inherit;background:var(--card2);color:var(--text);outline:none}
.pk-list{overflow-y:auto;padding:0 16px calc(20px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:10px}
.pk-opt{text-align:left;width:100%;background:var(--card2);border:1px solid var(--border);border-radius:14px;padding:14px 16px;color:var(--text);font-family:inherit;cursor:pointer;-webkit-tap-highlight-color:transparent}
.pk-opt:hover,.pk-opt:focus-visible{border-color:var(--copper);outline:none}
.pk-opt:active{transform:scale(.99)}
.pk-top{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.pk-no{font-size:12px;font-weight:700;color:var(--text2);margin-right:2px}
.pk-wait{margin-left:auto;font-size:11px;color:var(--copper-l)}
.pk-times{display:flex;align-items:baseline;justify-content:space-between;font-size:26px;font-weight:300;font-variant-numeric:tabular-nums;letter-spacing:1px}
.pk-times sup{font-size:9px;color:var(--text3)}
.pk-dur{font-size:13px;font-weight:600;color:var(--copper);letter-spacing:0}
.pk-sub{display:flex;justify-content:space-between;font-size:10px;color:var(--text3);margin-top:2px}
.pk-strip{margin:10px 0}
.pk-legs{display:flex;flex-wrap:wrap;gap:6px}
.pk-leg{font-size:11px;padding:3px 8px;border-radius:6px;background:rgba(255,255,255,.05);border-left:3px solid var(--text3);font-variant-numeric:tabular-nums}
.pk-leg.mrt{border-color:var(--mrt)}.pk-leg.hsr{border-color:var(--hsr)}.pk-leg.tra{border-color:var(--tra)}
.xall{border-top:1px solid var(--border)}
.xall-hd{width:100%;display:flex;align-items:center;gap:8px;padding:14px 18px;background:none;border:none;color:var(--text);font-family:inherit;font-size:13px;font-weight:600;cursor:pointer;text-align:left}
.xall-hd span{font-size:11px;color:var(--text3);font-weight:500}
.xall-hd i{margin-left:auto;font-style:normal;color:var(--text3);transition:transform .2s}
.xall-hd[aria-expanded="true"] i{transform:rotate(90deg)}
.xall-body{display:none}
.xall-body.show{display:block}
.xh-row{display:flex;gap:14px;padding:11px 18px;border-top:1px solid var(--border);cursor:pointer}
.xh-row:hover{background:var(--copper-g2)}
.xh-row.dim{cursor:default}
.xh-row.dim:hover{background:none}
.xh-row.dim .xh-t,.xh-row.dim .xh-top{opacity:.45}
.xh-t{width:46px;flex-shrink:0;font-variant-numeric:tabular-nums;text-align:right}
.xh-t b{display:block;font-size:15px;font-weight:600}
.xh-t span{font-size:11px;color:var(--text3)}
.xh-m{flex:1;min-width:0}
.xh-top{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;flex-wrap:wrap}
.xh-dur{font-size:11px;color:var(--text3);font-weight:500}
.xh-sub{font-size:11px;color:var(--text2);margin-top:3px;line-height:1.6}
.xh-why{color:var(--err)}
.xh-type{font-size:10px;font-weight:700;padding:2px 6px;border-radius:5px;margin-right:2px}
.xh-type.ex{background:rgba(108,157,240,.18);color:var(--tra)}
.xh-type.mid{background:rgba(242,196,107,.14);color:#F2C46B}
.xh-type.loc{background:rgba(255,255,255,.06);color:var(--text2)}
.xh-note{color:var(--text3)}
@media (prefers-reduced-motion:reduce){.xd-load i{animation:none}}

const TDX_TOKEN_URL='https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token';

// 內建金鑰：設定頁另外輸入的金鑰會優先使用；清除後回到內建金鑰
const TDX_BUILTIN={id:'aodamp2026-b67b522b-afcd-4cab',secret:'2c3eecd9-5649-4199-b723-bffd288ff1ac'};
function loadOwnCreds(){
  try{return{id:localStorage.getItem('tdx_id')||'',secret:localStorage.getItem('tdx_secret')||''}}
  catch(e){return{id:'',secret:''}}
}
function loadCreds(){
  const o=loadOwnCreds();
  return (o.id&&o.secret)?o:{...TDX_BUILTIN};
}
function saveCreds(id,secret){
  try{localStorage.setItem('tdx_id',id);localStorage.setItem('tdx_secret',secret)}catch(e){}
}

async function getToken(id,secret){
  const res=await fetch(TDX_TOKEN_URL,{
    method:'POST',
    headers:{'Content-Type':'application/x-www-form-urlencoded'},
    body:`grant_type=client_credentials&client_id=${encodeURIComponent(id)}&client_secret=${encodeURIComponent(secret)}`
  });
  if(!res.ok){
    let why='';try{const j=await res.json();why=j.error_description||j.error||''}catch(e){}
    throw new Error(`Auth failed: ${res.status}${why?' ('+why+')':''}`);
  }
  const data=await res.json();
  tdxToken=data.access_token;
  tdxExpiry=Date.now()+(data.expires_in-60)*1000;
  return tdxToken;
}

// TDX 有每秒呼叫上限：所有請求排隊、間隔 400ms；遇到 429 依序等 1.5／3／6 秒重試
let tdxNext=0;
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function tdxGate(){
  const now=Date.now(),t=Math.max(now,tdxNext);
  tdxNext=t+400;
  if(t>now) await sleep(t-now);
}
async function tdxFetch(url,attempt=0){
  const creds=loadCreds();
  if(!creds.id||!creds.secret) throw new Error('NO_CREDS');
  if(!tdxToken||Date.now()>tdxExpiry) await getToken(creds.id,creds.secret);
  await tdxGate();
  const go=()=>fetch(url,{headers:{Authorization:`Bearer ${tdxToken}`}});
  let res=await go();
  if(res.status===401){tdxToken=null;await getToken(creds.id,creds.secret);await tdxGate();res=await go()}
  if(res.status===429){
    const waits=[1500,3000,6000];
    if(attempt<waits.length){
      const ra=parseInt(res.headers.get('Retry-After'));
      const w=!isNaN(ra)?ra*1000:waits[attempt];
      tdxNext=Math.max(tdxNext,Date.now()+w);   // 整條佇列一起暫停
      await sleep(w);
      return tdxFetch(url,attempt+1);
    }
    throw new Error('RATE_LIMIT');
  }
  if(!res.ok) throw new Error(`API ${res.status}`);
  return res.json();
}

  if(idEl&&clean(idEl.value)){const i=clean(idEl.value),k=clean(secEl.value);saveCreds(i,k);idEl.value=i;secEl.value=k}

  const creds=loadCreds();

    tabAction('settings');

  dot.className='hero-status offline';
  // silent — header dot shows status

  try{
    await getToken(creds.id, creds.secret);

    // silent success — green dot in header is enough
    updateSetStatus();

  }catch(e){
    tdxToken=null;apiTimetable=null;
    dot.className='hero-status err';
    if(e.message==='NO_CREDS') tdxStatusMsg='info|請先填入 TDX API 金鑰';

    else if(/Auth failed: (400|401)/.test(e.message)) tdxStatusMsg=`err|✕ 金鑰驗證失敗：TDX 不接受這組 Client ID／Secret。${/invalid_client|Invalid client/i.test(e.message)?'（TDX 回應：金鑰無效）':''}\n${e.message}`;
    else tdxStatusMsg=`err|✕ 連線失敗：${e.message}。`;
    // silent — header dot turns red
    updateSetStatus();
  }
}

// ========== TDX DATA PARSING ==========
const SVC_DAYS=['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
function svcMatch(e,wd){
  const sd=e.ServiceDay||e.serviceDay;
  if(!sd) return true;                       // 沒有服務日資訊就視為每天
  const v=sd[SVC_DAYS[wd]];
  return v===1||v===true||v==='1';
}
function parseTDXTrains(originCode, destCode, dayOff=0){
  if(!apiTimetable) return null;
  const wd=(()=>{const d=new Date();d.setDate(d.getDate()+dayOff);return d.getDay()})();
  // TDX StationTimeTable format: array of {StationID, Direction, Timetables:[{DepartureTime, TrainType}]}
  const data = Array.isArray(apiTimetable) ? apiTimetable : (apiTimetable.StationTimetables || apiTimetable);
  if(!Array.isArray(data)||!data.length) return null;

  const oIdx=STATIONS.findIndex(s=>s.c===originCode);
  const dIdx=STATIONS.findIndex(s=>s.c===destCode);
  if(oIdx<0||dIdx<0) return null;
  const direction = oIdx < dIdx ? 0 : 1; // 0=south, 1=north

  // Find timetable entries for origin station in the right direction
  const originEntries = data.filter(e=>{
    const sid = e.StationID || e.stationID;
    const dir = e.Direction !== undefined ? e.Direction : e.direction;
    return sid === originCode && dir === direction;
  });
  // 只取該日（星期）適用的時刻表；若資料沒標到該日則保留全部
  const dayEntries=originEntries.filter(e=>svcMatch(e,wd));
  if(dayEntries.length) originEntries.splice(0,originEntries.length,...dayEntries);

  if(!originEntries.length) return null;

  // Collect departure times from origin
  const results=[];
  originEntries.forEach(entry=>{
    // TrainType / TrainTypeName may be at entry level OR inside each timetable item
    const entryTypeName=(entry.TrainTypeName?.Zh_tw||entry.TrainTypeName?.zh_tw||'');
    const entryTrainType=entry.TrainType??entry.trainType;

    const tt = entry.Timetables || entry.timetables || [];
    tt.forEach(t=>{
      const depTime = t.DepartureTime || t.departureTime;
      if(!depTime) return;
      const [hh,mm] = depTime.split(':').map(Number);
      const depMin = hh*60+mm;

      // Determine type: check timetable-level first, then entry-level
      const tTypeName=(t.TrainTypeName?.Zh_tw||t.TrainTypeName?.zh_tw||t.trainTypeName?.Zh_tw||'');
      const tTrainType=t.TrainType??t.trainType??entryTrainType;
      const combinedName=tTypeName||entryTypeName;

      let isExpress=false;
      if(combinedName){
        // Text-based detection (most reliable)
        isExpress=combinedName.includes('直達')||combinedName.includes('Express');
      } else if(tTrainType!==undefined&&tTrainType!==null){
        // Numeric fallback: TYMC uses 1=普通, 2=直達
        isExpress=(tTrainType===2||tTrainType==='2');
      }
      const type = isExpress ? 'e' : 'c';

      // Calculate arrival: use embedded travel times as reference
      const oS=STATIONS[oIdx], dS=STATIONS[dIdx];
      let dur;
      if(isExpress && oS.ex && dS.ex){
        dur = Math.abs(dS.em - oS.em);
      } else {
        dur = Math.abs(dS.cm - oS.cm);
      }
      results.push({t:type, dep:depMin, arr:depMin+dur, dur});
    });
  });

  // Deduplicate by departure time + type
  const seen=new Set();
  const unique=results.filter(r=>{
    const key=`${r.dep}-${r.t}`;
    if(seen.has(key)) return false;
    seen.add(key);return true;
  });
  unique.sort((a,b)=>a.dep-b.dep);
  return unique.length ? unique : null;
}

// Trains (embedded fallback)
function genFallback(oi,di){
  const south=oi<di,res=[];
  const cs=SC.c;
  if(south){const ot=STATIONS[oi].cm,dt=STATIONS[di].cm,dur=dt-ot;for(let d=cs.fA;d<=cs.lA;d+=cs.iv)res.push({t:'c',dep:d+ot,arr:d+dt,dur})}
  else{const ot=TC-STATIONS[oi].cm,dt=TC-STATIONS[di].cm,dur=dt-ot;for(let d=cs.fB;d<=cs.lB;d+=cs.iv)res.push({t:'c',dep:d+ot,arr:d+dt,dur})}
  if(STATIONS[oi].ex&&STATIONS[di].ex){
    const es=SC.e;
    if(south){const ot=STATIONS[oi].em,dt=STATIONS[di].em,dur=dt-ot;for(let d=es.fA;d<=es.lA;d+=es.iv)res.push({t:'e',dep:d+ot,arr:d+dt,dur})}
    else{const ot=TE-STATIONS[oi].em,dt=TE-STATIONS[di].em,dur=dt-ot;for(let d=es.fB;d<=es.lB;d+=es.iv)res.push({t:'e',dep:d+ot,arr:d+dt,dur})}
  }
  res.sort((a,b)=>a.dep-b.dep);return res;
}

// ========== LIVE TRACKER ==========
let trackerInterval=null;

let allTrackerTrains=[];

function getStationsBetween(oi,di){
  const start=Math.min(oi,di),end=Math.max(oi,di),stns=[];
  for(let i=start;i<=end;i++) stns.push({idx:i,code:STATIONS[i].c,name:STATIONS[i].n,ex:STATIONS[i].ex});
  if(oi>di) stns.reverse();
  return stns;
}

function getStationsWithPrev(oi,di){
  const stns=getStationsBetween(oi,di);
  const goingSouth=oi<di;
  const prevIdx=goingSouth?oi-1:oi+1;
  if(prevIdx>=0&&prevIdx<STATIONS.length){
    const ps=STATIONS[prevIdx];
    stns.unshift({idx:prevIdx,code:ps.c,name:ps.n,ex:ps.ex,isPrev:true});
  }
  return stns;
}

      <span class="tt-arr">${hm(train.arr)}</span><span class="tt-arrow">抵達</span><span class="tt-dur">${train.dur}分</span>
    </div>
    <div class="track-wrap">

        <div class="track-train" id="trkTrain" style="left:16px">\ud83d\ude88</div>
      </div>
      <div class="track-stations" id="trkStations">${stnDotsHTML}</div>
    </div>
    <div class="tracker-eta" id="trkEta">即時追蹤中\u22ef</div>
  </div>`;
}

function startTracker(train,stns){
  trackerTrain=train;trackerStations=stns;
  if(trackerInterval)clearInterval(trackerInterval);
  const originStnIdx=stns.findIndex(s=>!s.isPrev);
  const hasPrev=originStnIdx>0;
  const originFrac=hasPrev?(originStnIdx/(stns.length-1)):0;
  const journeyFrac=1-originFrac;
  let wasDeparted=false; // track if train was already departed when tracker started

  function update(){
    const d=new Date();
    const currentMin=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
    const countdown=document.getElementById('trkCountdown');
    if(!countdown)return;

    if(currentMin>=train.dep&&!wasDeparted){
      // Train just departed from origin → re-render to swap to mini + next
      wasDeparted=true;
      clearInterval(trackerInterval);
      setTimeout(()=>advanceToNextTrain(),500);
      return;
    }

    if(currentMin>=train.dep){
      // Already departed state - should not happen since we re-render above
      // But as safety: if no next train, show en-route in full card
      wasDeparted=true;
    }

    const cdLabel=document.getElementById('trkCdLabel');
    const status=document.getElementById('trkStatus');
    const progress=document.getElementById('trkProgress');
    const trainEl=document.getElementById('trkTrain');
    const eta=document.getElementById('trkEta');
    const trackLine=document.querySelector('.track-line');
    if(!trackLine)return;
    const railLeft=16,railRight=trackLine.offsetWidth-16,railWidth=railRight-railLeft;
    const originPos=railLeft+originFrac*railWidth;

    if(currentMin<train.dep){
      const remain=train.dep-currentMin;
      const mins=Math.ceil(remain);
      countdown.textContent=`${mins}`;
      cdLabel.textContent='分鐘後進站';
      status.textContent='列車接近中';
      status.style.color='var(--copper-l)';
      const approachWindow=3;
      const approachPct=Math.max(0,Math.min(1,1-remain/approachWindow));
      let pos=hasPrev?railLeft+approachPct*originFrac*railWidth:railLeft;
      progress.style.width='0%';
      trainEl.style.left=pos+'px';
      const prevName=hasPrev?stns[0].name:'';
      const origName=stns[originStnIdx].name;
      if(remain>approachWindow) eta.innerHTML=`列車將於 <strong>${mins} 分鐘</strong>後抵達 ${origName}`;
      else eta.innerHTML=`列車已從 ${prevName} 出發，<strong>${mins} 分鐘</strong>後進站`;
      document.querySelectorAll('.track-stn-dot').forEach(dot=>dot.classList.remove('passed'));
      if(hasPrev&&approachPct>0)document.querySelector('.track-stn-dot.prev')?.classList.add('passed');
    } else if(currentMin<train.arr){
      // This branch only runs when there's no next train (safety fallback)
      const elapsed=currentMin-train.dep;
      const total=train.arr-train.dep;
      const pct=Math.min(elapsed/total,1);
      const remain=train.arr-currentMin;
      const mins=Math.ceil(remain);
      countdown.textContent=`${mins}`;
      cdLabel.textContent='分鐘後抵達';
      status.textContent='行駛中';
      status.style.color='var(--ok)';
      const pos=originPos+pct*journeyFrac*railWidth;
      progress.style.width=((originFrac+pct*journeyFrac)*100)+'%';
      trainEl.style.left=pos+'px';
      const journeyStns=stns.slice(originStnIdx);
      const jsLen=journeyStns.length;
      const curIdx=Math.min(Math.floor(pct*(jsLen-1)),jsLen-2);
      const fromStn=journeyStns[curIdx];
      const toStn=journeyStns[Math.min(curIdx+1,jsLen-1)];
      eta.innerHTML=`${fromStn.name} → ${toStn.name}，預計 <strong>${mins} 分鐘</strong>後抵達 ${stns[stns.length-1].name}`;
      document.querySelectorAll('.track-stn-dot').forEach((dot,i)=>{
        const allDots=document.querySelectorAll('.track-stn-dot');
        const stnPct=i/(allDots.length-1);
        const trainPct=originFrac+pct*journeyFrac;
        if(stnPct<=trainPct)dot.classList.add('passed');else dot.classList.remove('passed');
      });
    } else {
      countdown.textContent='0';cdLabel.textContent='已抵達';
      status.textContent='已到站';status.style.color='var(--copper-l)';
      progress.style.width='100%';trainEl.style.left=railRight+'px';
      document.querySelectorAll('.track-stn-dot').forEach(d=>d.classList.add('passed'));
      eta.innerHTML=`已抵達 <strong>${stns[stns.length-1].name}</strong>`;
      clearInterval(trackerInterval);
      setTimeout(()=>advanceToNextTrain(),5000);
    }
  }
  // If train already departed when tracker starts, mark it
  if(nowM()>=train.dep) wasDeparted=true;
  update();
  trackerInterval=setInterval(update,1000);
}

let miniInterval=null;
let miniTrain=null;

function startMiniTracker(train){
  miniTrain=train;
  if(miniInterval) clearInterval(miniInterval);
  function update(){
    const d=new Date();
    const cur=d.getHours()*60+d.getMinutes()+d.getSeconds()/60;
    const cd=document.getElementById('miniCd');
    const prog=document.getElementById('miniProgress');
    const st=document.getElementById('miniStatus');
    if(!cd) return;
    if(cur<train.arr){
      const remain=train.arr-cur;
      const mins=Math.ceil(remain);
      cd.textContent=`${mins}`;
      const pct=Math.min((cur-train.dep)/(train.arr-train.dep),1);
      prog.style.width=(pct*100)+'%';
      st.textContent='行駛中';
    } else {
      cd.textContent='0';
      st.textContent='已到站';
      prog.style.width='100%';
      clearInterval(miniInterval);
      // Remove mini card after 3s
      setTimeout(()=>{const el=document.getElementById('miniTracker');if(el)el.style.display='none'},3000);
    }
  }
  update();
  miniInterval=setInterval(update,1000);
}

function render(noScroll){
  if(trackerInterval){clearInterval(trackerInterval);trackerInterval=null}
  if(miniInterval){clearInterval(miniInterval);miniInterval=null}
  const ct=document.getElementById('resCont');
  const oCode=STATIONS[selO].c,dCode=STATIONS[selD].c;
  let all=parseTDXTrains(oCode,dCode);
  let source='TDX';
  if(!all){all=genFallback(selO,selD);source='內建'}
  const now=nowM();
  const bothExpress=STATIONS[selO].ex&&STATIONS[selD].ex;
  if(!bothExpress) all=all.filter(t=>t.t!=='e');
  let trains=all;

  allTrackerTrains=trains;

  // Find en-route train (already departed, not yet arrived) — strict < now
  let enRouteTrain=null;
  for(let i=trains.length-1;i>=0;i--){
    if(trains[i].dep<now&&trains[i].arr>now){enRouteTrain=trains[i];break}
  }

  // Find next upcoming train (not yet departed) — >= now
  let ni=trains.findIndex(t=>t.dep>=now);
  let upcomingTrain=ni>=0?trains[ni]:null;

  // If upcoming and en-route are the same train (edge case), keep as upcoming only
  if(enRouteTrain&&upcomingTrain&&enRouteTrain.dep===upcomingTrain.dep){
    enRouteTrain=null;
  }

  // Main tracker target: upcoming if exists, otherwise en-route
  let trackerTarget=upcomingTrain||enRouteTrain;
  if(trackerTarget) trackerTrainIdx=trains.indexOf(trackerTarget);

  const futureTrains=trains.filter(t=>t.arr>=now);
  const sh=futureTrains.slice(0,dc),more=futureTrains.length>dc;
  const stns=getStationsWithPrev(selO,selD);

  // Build HTML: mini card for en-route + full card for upcoming
  let miniHTML='';
  let trackerHTML='';
  if(enRouteTrain&&upcomingTrain){
    // Train departed → show mini card for it, full card for next train
    miniHTML=buildMiniTrackerHTML(enRouteTrain);
    trackerHTML=buildTrackerHTML(upcomingTrain,stns);
  } else if(enRouteTrain&&!upcomingTrain){
    // Only en-route, no next → show full card for en-route
    trackerHTML=buildTrackerHTML(enRouteTrain,stns);
    trackerTarget=enRouteTrain;
  } else if(upcomingTrain){
    // Upcoming train not yet departed → show full card
    trackerHTML=buildTrackerHTML(upcomingTrain,stns);
  }

  const nowStr=hm(now);
  let h=`<div class="results-area">
    ${miniHTML}
    ${trackerHTML}
    <div class="res-hd"><div class="res-title">即將到來班次 <span style="font-size:12px;color:var(--text3);font-weight:500">(${source}・${nowStr} 起)</span></div><div class="res-route">${STATIONS[selO].n} \u2192 ${STATIONS[selD].n}</div></div>`;

  if(!sh.length){h+=`<div class="no-res"><div class="nri">\ud83d\udd0d</div><div>無可用班次</div></div>`}
  else{sh.forEach((t,i)=>{
    const isN=t===trackerTarget;
    h+=`<div class="tc${isN?' nt':''}">
    ${isN?'<div class="next-lbl">NEXT</div>':''}
    <div class="tc-badge"><span class="bd ${t.t==='e'?'eb':'cb'}">${t.t==='e'?'直達':'普通'}</span></div>
    <div class="tc-times"><div class="tc-t"><div class="tl">出發</div><div class="tv">${hm(t.dep)}</div></div>
    <div class="tc-arr">\u2192</div><div class="tc-t"><div class="tl">抵達</div><div class="tv">${hm(t.arr)}</div></div></div>
    <div class="tc-dur"><div class="dv">${t.dur} 分</div><div class="dl2">車程</div></div></div>`});
    if(more)h+=`<div class="load-more"><button onclick="dc+=10;render()">顯示更多班次</button></div>`}
  h+='</div>';ct.innerHTML=h;

  // Start trackers
  if(enRouteTrain&&upcomingTrain){
    setTimeout(()=>{startMiniTracker(enRouteTrain);startTracker(upcomingTrain,stns)},100);
  } else if(trackerTarget){
    const target=enRouteTrain||upcomingTrain;
    if(target) setTimeout(()=>startTracker(target,stns),100);
  }
  if(!noScroll) setTimeout(()=>{const el=document.querySelector('.tracker');if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},200);
}

function showTDXDebug(){

  if(!Array.isArray(data)){el.textContent='資料格式非陣列';return}

  // Show summary of first few entries with TrainType info
  let out='共 '+data.length+' 筆 entry\n\n';
  const sample=data.slice(0,6);
  sample.forEach((e,i)=>{
    out+=`--- Entry ${i} ---\n`;
    out+=`StationID: ${e.StationID||e.stationID}\n`;
    out+=`Direction: ${e.Direction??e.direction}\n`;
    out+=`TrainType (entry): ${e.TrainType??e.trainType??'(無)'}\n`;
    out+=`TrainTypeName (entry): ${JSON.stringify(e.TrainTypeName||e.trainTypeName||'(無)')}\n`;
    const tt=e.Timetables||e.timetables||[];
    out+=`Timetables: ${tt.length} 筆\n`;
    if(tt.length>0){
      const t0=tt[0];
      out+=`  [0] DepartureTime=${t0.DepartureTime||t0.departureTime}\n`;
      out+=`      TrainType=${t0.TrainType??t0.trainType??'(無)'}\n`;
      out+=`      TrainTypeName=${JSON.stringify(t0.TrainTypeName||t0.trainTypeName||'(無)')}\n`;
      if(tt.length>1){
        const t1=tt[1];
        out+=`  [1] DepartureTime=${t1.DepartureTime||t1.departureTime}\n`;
        out+=`      TrainType=${t1.TrainType??t1.trainType??'(無)'}\n`;
      }
    }
    out+='\n';
  });

  // Count express vs commuter
  let eCnt=0,cCnt=0;
  data.forEach(e=>{
    const eType=e.TrainType??e.trainType;
    const tt=e.Timetables||e.timetables||[];
    tt.forEach(t=>{
      const tType=t.TrainType??t.trainType??eType;
      const name=(t.TrainTypeName?.Zh_tw||e.TrainTypeName?.Zh_tw||'');
      let isExp=false;
      if(name) isExp=name.includes('直達');
      else if(tType!==undefined) isExp=(tType===2||tType==='2');
      if(isExp) eCnt++; else cCnt++;
    });
  });
  out+=`\n=== 車種統計 ===\n直達車: ${eCnt} 筆\n普通車: ${cCnt} 筆\n`;

  el.textContent=out;
}

function whBuild(el,vals,key){
  el.innerHTML='<div class="wh-pad"></div>'+vals.map((v,i)=>`<div class="wh-it" data-i="${i}">${String(v).padStart(2,'0')}</div>`).join('')+'<div class="wh-pad"></div>';
  el.addEventListener('scroll',()=>{requestAnimationFrame(()=>whPaint(el,key,vals))},{passive:true});
  el.addEventListener('click',e=>{const it=e.target.closest('.wh-it');if(it)el.scrollTo({top:+it.dataset.i*WH,behavior:'smooth'})});
  el.addEventListener('keydown',e=>{
    if(e.key==='ArrowDown'||e.key==='ArrowUp'){e.preventDefault();el.scrollBy({top:e.key==='ArrowDown'?WH:-WH,behavior:'smooth'})}
    if(e.key==='Enter') whConfirm();
  });
}
function whPaint(el,key,vals){
  const c=el.scrollTop/WH;
  el.querySelectorAll('.wh-it').forEach((it,i)=>{
    const d=i-c,a=Math.min(Math.abs(d),3);
    it.style.transform=`rotateX(${(-d*22).toFixed(1)}deg) scale(${(1-a*.06).toFixed(3)})`;
    it.style.opacity=Math.max(.12,1-a*.32).toFixed(2);
    it.classList.toggle('on',Math.abs(d)<.5);
  });
  const idx=Math.max(0,Math.min(vals.length-1,Math.round(c)));
  whSel[key]=vals[idx];
  whRead();
}
function whRead(){
  const m=whSel.h*60+whSel.m;
  document.getElementById('whRead').textContent=`${dayFull(xDay)} ${hm(m)} 出發`;
}
function whSetTo(min,smooth){
  min=((Math.round(min/5)*5)%1440+1440)%1440;
  const h=Math.floor(min/60),m=min%60;
  const hE=document.getElementById('whH'),mE=document.getElementById('whM');
  if(smooth){hE.scrollTo({top:h*WH,behavior:'smooth'});mE.scrollTo({top:(m/5)*WH,behavior:'smooth'})}
  else{hE.scrollTop=h*WH;mE.scrollTop=(m/5)*WH}
  if(!smooth){whPaint(document.getElementById('whH'),'h',WH_H);whPaint(document.getElementById('whM'),'m',WH_M)}
}

const xInflight={};
const persistable=u=>/DailyTimetable\/OD|DailyTrainTimetable\/OD|\/TRA\/Station\?/.test(u);
async function cfetch(url,ttl){
  const c=xCache[url];
  if(c&&Date.now()-c.t<ttl) return c.d;
  if(persistable(url)){
    try{const j=JSON.parse(localStorage.getItem('tdxc:'+url)||'null');
      if(j&&Date.now()-j.t<ttl){xCache[url]=j;return j.d}}catch(e){}
  }
  if(xInflight[url]) return xInflight[url];
  xInflight[url]=(async()=>{
    try{
      const d=await tdxFetch(url);
      xCache[url]={t:Date.now(),d};
      if(persistable(url)){
        try{localStorage.setItem('tdxc:'+url,JSON.stringify(xCache[url]))}
        catch(e){pruneTdxCache(true);try{localStorage.setItem('tdxc:'+url,JSON.stringify(xCache[url]))}catch(e2){}}
      }
      return d;
    }finally{delete xInflight[url]}
  })();
  return xInflight[url];
}
// 清掉過期（前一天以前）的時刻表快取
function pruneTdxCache(all){
  try{
    const today=ymd(0);
    Object.keys(localStorage).filter(k=>k.startsWith('tdxc:')).forEach(k=>{
      const m=k.match(/\/(\d{4}-\d{2}-\d{2})\?/);
      if(all||(m&&m[1]<today)||/\/4350\//.test(k)) localStorage.removeItem(k);   // 也清掉舊版誤用的 4350 資料
    });
  }catch(e){}
}

// ---- 解析 ----
function parseTHSR(data,off){
  const list=Array.isArray(data)?data:(data?.DailyTimetables||data?.TrainTimetables||[]);
  return list.map(x=>{
    const no=x.DailyTrainInfo?.TrainNo||x.TrainInfo?.TrainNo||x.TrainNo;
    const d=toMin(x.OriginStopTime?.DepartureTime||x.OriginStopTime?.ArrivalTime);
    const a=toMin(x.DestinationStopTime?.ArrivalTime||x.DestinationStopTime?.DepartureTime);
    if(d==null||a==null) return null;
    let dep=d+off*1440,arr=a+off*1440;if(arr<dep)arr+=1440;
    return {mode:'hsr',no,type:'',dep,arr};
  }).filter(Boolean);
}
function traType(n){
  if(!n) return '台鐵';
  if(n.includes('普悠瑪')) return '普悠瑪';
  if(n.includes('太魯閣')) return '太魯閣';
  if(n.includes('3000')) return '自強3000';
  if(n.includes('區間快')) return '區間快';
  return n.split('(')[0].replace('號','')||'台鐵';
}
function parseTRA(data,oId,dId,off){
  const list=data?.TrainTimetables||(Array.isArray(data)?data:[]);
  return list.map(x=>{
    const info=x.TrainInfo||x.DailyTrainInfo||{};
    const st=x.StopTimes||[];
    const o=st.find(z=>z.StationID===oId)||x.OriginStopTime;
    const t=st.find(z=>z.StationID===dId)||x.DestinationStopTime;
    if(!o||!t) return null;
    const d=toMin(o.DepartureTime||o.ArrivalTime),a=toMin(t.ArrivalTime||t.DepartureTime);
    if(d==null||a==null) return null;
    let dep=d+off*1440,arr=a+off*1440;if(arr<dep)arr+=1440;
    return {mode:'tra',no:String(info.TrainNo||''),type:traType(info.TrainTypeName?.Zh_tw),dep,arr};
  }).filter(Boolean);
}
function mrtTrips(from,to,off){
  const oi=STATIONS.findIndex(x=>x.c===from),di=STATIONS.findIndex(x=>x.c===to);
  let all=parseTDXTrains(from,to,off)||genFallback(oi,di);
  if(!(STATIONS[oi].ex&&STATIONS[di].ex)) all=all.filter(t=>t.t!=='e');
  return all.map(t=>({mode:'mrt',no:'',type:t.t==='e'?'直達車':'普通車',dep:t.dep+off*1440,arr:t.arr+off*1440}));
}

  const f=n=>list.find(x=>(x.StationName?.Zh_tw||'').replace('臺','台')===n)?.StationID;
  const a=f('新左營'),b=f('屏東');
  if(a&&b){TRA_ID={XZY:a,PT:b};return true}

async function loadHSR(o,d,days){
  let out=[];
  for(const off of days) out=out.concat(parseTHSR(await cfetch(`${THSR_BASE}/DailyTimetable/OD/${o}/to/${d}/${ymd(off)}?$top=2000&$format=JSON`,216e5),off));
  // 剩餘座位：查不到不影響規劃
  try{
    const seats=await loadSeats(o,d,days);
    out.forEach(t=>{const v=seats[Math.floor(t.dep/1440)+'|'+normNo(t.no)];if(v)t.seat=v});
  }catch(e){}
  try{hsrFare[o+'|'+d]=await loadFare(o,d)}catch(e){}
  return out.sort((a,b)=>a.dep-b.dep);
}

const hsrFare={};
const normNo=n=>String(n??'').replace(/^0+/,'');
function seatVal(v){
  const x=String(v??'').trim().toUpperCase();
  if(x==='O'||x==='AVAILABLE'||x==='1') return 'ok';
  if(x==='L'||x==='LIMITED'||x==='2') return 'few';
  if(x==='X'||x==='FULL'||x==='SOLDOUT'||x==='3') return 'full';
  return null;
}
function parseSeats(data,d,off,out){
  const list=Array.isArray(data)?data:(data?.AvailableSeats||data?.ODAvailableSeats||data?.AvailableSeatList||[]);
  list.forEach(x=>{
    const no=x.TrainNo||x.TrainInfo?.TrainNo||x.DailyTrainInfo?.TrainNo;if(!no) return;
    let std=x.StandardSeatStatus,biz=x.BusinessSeatStatus;
    if(std==null&&Array.isArray(x.StopStations)){
      const st=x.StopStations.find(z=>z.StationID===d)||x.StopStations[x.StopStations.length-1];
      if(st){std=st.StandardSeatStatus;biz=st.BusinessSeatStatus}
    }
    const v={std:seatVal(std),biz:seatVal(biz)};
    if(v.std||v.biz) out[off+'|'+normNo(no)]=v;
  });
}
async function loadSeats(o,d,days){
  const out={};
  for(const off of days){
    const data=await cfetch(`${THSR_BASE}/AvailableSeatStatus/Train/OD/${o}/to/${d}/TrainDate/${ymd(off)}?$top=2000&$format=JSON`,12e4);

// ---- 規劃：對每班「最後一段」列車往回找能接上的最晚班次，再取 Pareto 前緣 ----
function planRoutes(legs,bufs,T0){
  const n=legs.length;
  const last=legs[n-1].filter(t=>t.dep>=T0&&t.arr<=T0+HORIZON).sort((a,b)=>a.arr-b.arr);
  const plans=[];
  for(const L of last){
    const chain=[L];let need=L.dep,ok=true;
    for(let i=n-2;i>=0;i--){
      const lim=need-bufs[i];let best=null;
      for(const t of legs[i]){
        if(t.arr<=lim&&t.dep>=T0&&(!best||t.dep>best.dep||(t.dep===best.dep&&t.arr<best.arr))) best=t;
      }
      if(!best){ok=false;break}
      chain.unshift(best);need=best.dep;
    }
    if(ok) plans.push({legs:chain,dep:chain[0].dep,arr:L.arr});
  }
  plans.sort((a,b)=>a.arr-b.arr||b.dep-a.dep);
  const out=[];let maxDep=-Infinity;
  for(const p of plans){if(p.dep>maxDep){out.push(p);maxDep=p.dep}}
  return out.slice(0,MAX_PLANS);
}

function applyDelay(trips,delays){
  return trips.map(t=>{
    const dl=t.dep<1440?delays[t.no]:undefined;
    if(dl===undefined) return {...t,live:null};
    return {...t,live:dl,sdep:t.dep,dep:t.dep+dl,arr:t.arr+dl};
  });
}

// ---- 主流程 ----
async function runTransfer(){
  xBook=[];
  xDirty=false;
  const box=document.getElementById('xferCont');
  const creds=loadCreds();
  const home=getHome();
  renderXferShell();
  if(!creds.id||!creds.secret){
    (xOnly?[xOnly]:['S','N']).forEach(k=>document.getElementById('xd'+k).innerHTML=xdHead(k)+`<div class="xd-msg">高鐵與台鐵時刻需要 TDX 金鑰。設定好之後按查詢，就會自動規劃這趟轉乘。<br><button onclick="tabAction('settings')">前往設定</button></div>`);
    return;
  }
  const T0=xT0();
  const days=(T0+HORIZON>(xDay+1)*1440)?[xDay,xDay+1]:[xDay];
  const mrtDays=days;
  const buf=getBuf();
  const reqId=Date.now();runTransfer.req=reqId;

  let delays={};
  if(useTra()) try{delays=await loadDelays()}catch(e){}

  const dirs=[
    {k:'S',build:async()=>{
      const legs=[],bufs=[],meta=[];
      if(useMrt()){
        const hub=mrtHub();
        let m=[];mrtDays.forEach(o=>m=m.concat(mrtTrips(home,hub.c,o)));
        legs.push(m.sort((a,b)=>a.dep-b.dep));meta.push(['機捷',stnName(home),hub.n]);bufs.push(buf.mh);
      }
      const hp=getHsrPair();
      const hi=legs.length;legs.push(await loadHSR(hp.n,hp.s,days));meta.push(['高鐵',hsrN(hp.n),hsrN(hp.s)]);
      if(useTra()){bufs.push(buf.ht);legs.push(applyDelay(await loadTRA('S',days),delays));meta.push(['台鐵','新左營','屏東'])}
      return {...planPreferFast(legs,hi,bufs,T0),meta,bufs,missing:meta.filter((m,i)=>!legs[i].length).map(m=>m[0]),legs,hi};
    }},
    {k:'N',build:async()=>{
      const legs=[],bufs=[],meta=[];
      if(useTra()){legs.push(applyDelay(await loadTRA('N',days),delays));meta.push(['台鐵','屏東','新左營']);bufs.push(buf.th)}
      const hp=getHsrPair();
      const hi=legs.length;legs.push(await loadHSR(hp.s,hp.n,days));meta.push(['高鐵',hsrN(hp.s),hsrN(hp.n)]);
      if(useMrt()){
        bufs.push(buf.hm);
        const hub=mrtHub();
        let m=[];mrtDays.forEach(o=>m=m.concat(mrtTrips(hub.c,home,o)));
        legs.push(m.sort((a,b)=>a.dep-b.dep));meta.push(['機捷',hub.n,stnName(home)]);
      }
      return {...planPreferFast(legs,hi,bufs,T0),meta,bufs,missing:meta.filter((m,i)=>!legs[i].length).map(m=>m[0]),legs,hi};
    }}
  ];
  for(const d of dirs.filter(d=>!xOnly||d.k===xOnly)){
    try{
      const r=await d.build();
      if(runTransfer.req!==reqId) return;
      xState[d.k]={...r,T0};
      renderDir(d.k,r,T0);
      if(xPickPending&&xOnly===d.k){xPickPending=false;if(r.plans.length)openPlanPicker(d.k)}
    }catch(e){
      if(runTransfer.req!==reqId) return;
      document.getElementById('xd'+d.k).innerHTML=xdHead(d.k)+`<div class="xd-msg">${e.message==='RATE_LIMIT'?'TDX 暫時限制查詢次數（請求太密集）。等 10 秒左右再按上方「更新」。':e.message==='NO_CREDS'?'尚未設定 TDX 金鑰。':`查詢失敗：${e.message}。按上方「更新」再試一次。`}</div>`;
    }
  }
  xState.upd=new Date();
  const u=document.getElementById('xUpd');if(u)u.textContent=`${String(xState.upd.getHours()).padStart(2,'0')}:${String(xState.upd.getMinutes()).padStart(2,'0')} 更新`;
  loadAlerts().then(a=>{
    if(runTransfer.req!==reqId||!a.length) return;
    const el=document.getElementById('xAlert');
    if(el){el.style.display='';el.innerHTML=a.slice(0,3).map(x=>x.replace(/</g,'&lt;')).join('<br>')}
  });
}

// 高鐵車程上限：優先只用 ≤ 上限的班次；完全排不出方案時才退回全部班次
function getHsrMax(){try{const v=parseInt(localStorage.getItem('xfer_hsrmax'));return isNaN(v)?100:v}catch(e){return 100}}
function setHsrMax(v){xDirty=true;const n=Math.max(0,Math.min(240,parseInt(v)||0));try{localStorage.setItem('xfer_hsrmax',String(n))}catch(e){}}
function planPreferFast(legs0,hi,bufs,T0){
  let legs=legs0;
  if(getSkipFull()){
    const ok=legs0[hi].filter(t=>t.seat?.std!=='full');
    if(ok.length&&ok.length<legs0[hi].length){legs=legs0.slice();legs[hi]=ok}
  }
  let max=getHsrMax();
  if(!max) return {plans:planRoutes(legs,bufs,T0),hsrMax:0,fallback:false};
  const hp=getHsrPair();
  if(!(hp.n==='1020'&&hp.s==='1070')&&legs[hi].length){
    // 其他站別：以當天最快班次 +12 分鐘當上限（等同只挑快車）
    max=Math.min(...legs[hi].map(t=>t.arr-t.dep))+12;
  }
  const fastLegs=legs.slice();fastLegs[hi]=legs[hi].filter(t=>t.arr-t.dep<=max);
  const plans=planRoutes(fastLegs,bufs,T0);
  if(plans.length) return {plans,hsrMax:max,fallback:false};
  return {plans:planRoutes(legs,bufs,T0),hsrMax:max,fallback:true};
}

    h+=`<div class="xleg" style="--m:${colors[l.mode]}">
      <div class="xrow"><div class="xt">${hm(l.dep)}${sched}</div><i class="xdot"></i><div class="xs">${from}</div></div>
      <div class="xride"><span class="xb">${legName(l)}</span><span${l.mode==='hsr'&&getHsrMax()&&l.arr-l.dep>getHsrMax()?' style="color:var(--err)"':''}>${fmtDur(l.arr-l.dep)}</span>${live}${l.mode==='hsr'?seatHTML(l):''}${bookBtnHTML(l,from,to)}</div>
      ${l.mode==='tra'?traOptionsHTML(p,i,meta,bufs,r):''}
      <div class="xrow"><div class="xt">${hm(l.arr)}</div><i class="xdot"></i><div class="xs">${to}</div></div>
    </div>`;
    if(i<p.legs.length-1){
      const gap=p.legs[i+1].dep-l.arr,spare=gap-bufs[i];
      const tight=spare<3;
      h+=`<div class="xwalk${tight?' tight':''}">轉乘 ${fmtDur(gap)}（需 ${bufs[i]} 分${tight?'，時間偏緊':''}）</div>`;
    }
  });
  return h+'</div>';
}

function renderDir(k,r,T0,sel=0){
  r.T0=T0;
  const el=document.getElementById('xd'+k);
  const {plans,meta,bufs,hsrMax,fallback}=r;
  if(!plans.length&&r.missing&&r.missing.length){
    el.innerHTML=xdHead(k)+`<div class="xd-msg">TDX 目前查不到 ${dayFull(Math.floor(T0/1440))} 的${[...new Set(r.missing)].join('、')}時刻（可能還沒公布，或這天停駛）。換個日期試試，或稍後按上方「更新」。</div>`;
    return;
  }
  if(!plans.length){
    el.innerHTML=xdHead(k)+`<div class="xd-msg">${dayFull(Math.floor(T0/1440))} ${hm(T0)} 之後 6 小時內沒有接得上的班次。試試調整出發時間，或到設定縮短轉乘時間。</div>`+allHsrHTML(k,r,T0);
    return;
  }
  if(sel>=plans.length) sel=0;
  const best=plans[sel];
  const minDur=Math.min(...plans.map(p=>p.arr-p.dep));
  const tags=[];
  if(sel===0) tags.push(`<span class="xtag">最早抵達</span>`);
  if(sel>0) tags.push(`<span class="xtag">你選的方案</span>`);
  if(hsrMax&&!fallback) tags.push(`<span class="xtag g">高鐵 ${fmtDur(hsrMax)}內</span>`);
  if(best.arr-best.dep===minDur) tags.push(`<span class="xtag g">最短時間</span>`);
  const tight=best.legs.some((l,i)=>i<best.legs.length-1&&best.legs[i+1].dep-l.arr-bufs[i]<3);
  if(tight) tags.push(`<span class="xtag r">轉乘偏緊</span>`);
  const nX=best.legs.length-1;
  el.innerHTML=xdHead(k,`<span data-dep="${best.dep}"></span>`)+(xOnly===k&&plans.length>1?`<button class="xf-upd" style="display:block;margin:6px 18px 0;color:var(--copper);font-weight:800;font-size:14px" onclick="openPlanPicker('${k}')">換一個方案</button>`:'')+`
    <div class="xd-sum">
      <div><div class="xd-lbl">出發</div><div class="xd-big">${hmx(best.dep)}</div></div>
      <div class="xd-mid"><div class="tot">${fmtDur(best.arr-best.dep)}</div><div class="xfn">轉乘 ${nX} 次</div></div>
      <div style="text-align:right"><div class="xd-lbl">抵達${meta[meta.length-1][2]}</div><div class="xd-big">${hmx(best.arr)}</div></div>
    </div>
    ${stripHTML(best,'xstrip')}
    <div class="xd-tags">${tags.join('')}</div>
    ${fallback?`<div class="xd-more" style="color:#F2C46B;padding-bottom:0">6 小時內沒有車程 ${fmtDur(hsrMax)}內的高鐵接得上，以下改列全部班次。</div>`:''}
    ${timelineHTML(best,meta,bufs,r)}
    ${plans.length>1?`<div class="xalts">${plans.filter(p=>p!==best).map((p,i)=>{
      const d=p.arr-p.dep;
      return `<div class="xalt" onclick="this.nextElementSibling.classList.toggle('show')">
        <span class="xa-t">${hm(p.dep)} – ${hm(p.arr)}</span>${stripHTML(p,'xa-strip')}<span class="xa-d">${fmtDur(d)}${d===minDur&&best.arr-best.dep!==minDur?' 最短':''}</span>
      </div><div class="xalt-body">${timelineHTML(p,meta,bufs,r)}</div>`}).join('')}</div>`:''}
    ${allHsrHTML(k,r,T0)}`;
  tickXfer();
}

function waitLabel(dep,now=nowM()){
  const off=Math.floor(dep/1440);
  if(off>0) return `${dayLabel(off)} ${hm(dep)} 出發`;
  const r=Math.round(dep-now);
  return r>0?`${fmtDur(r)}後出發`:(r>-2?'現在出發':'已發車');
}
// ---- 全部高鐵班次：每班能不能接、沒列入方案的原因 ----
function chainAround(legs,hi,bufs,meta,T0,h){
  const n=legs.length,chain=[];chain[hi]=h;
  let need=h.dep;
  for(let i=hi-1;i>=0;i--){
    const lim=need-bufs[i];let best=null,early=null;
    for(const t of legs[i]){
      if(t.dep<T0) continue;
      if(!early||t.arr<early.arr) early=t;
      if(t.arr<=lim&&(!best||t.dep>best.dep)) best=t;
    }
    if(!best) return {why:early?`${meta[i][0]}最快 ${hm(early.arr)} 才到 ${meta[i][2]}，含轉乘 ${bufs[i]} 分趕不上`:`${hm(T0)} 之後沒有${meta[i][0]}可接`};
    chain[i]=best;need=best.dep;
  }
  let ready=h.arr;
  for(let i=hi+1;i<n;i++){
    ready+=bufs[i-1];let best=null;
    for(const t of legs[i]) if(t.dep>=ready&&(!best||t.arr<best.arr)) best=t;
    if(!best) return {why:`之後沒有${meta[i][0]}可接`};
    chain[i]=best;ready=best.arr;
  }
  return {plan:{legs:chain,dep:chain[0].dep,arr:chain[n-1].arr}};
}
function allHsrHTML(k,r,T0){
  if(!r.legs||r.hi==null) return '';
  const tri=r.meta.findIndex(m=>m[0]==='台鐵');
  return allLegHTML(k,r,T0,r.hi)+(tri>=0?allLegHTML(k,r,T0,tri):'');
}
function allLegHTML(k,r,T0,hi){
  const {legs,bufs,meta,plans}=r;
  const isHsr=legs[hi][0]?.mode==='hsr'||meta[hi][0]==='高鐵';
  const hsrMax=isHsr?r.hsrMax:0;
  let trains=legs[hi].filter(h=>h.dep>=T0&&h.dep<=T0+HORIZON).sort((a,b)=>a.dep-b.dep);
  // 後段（例如南下的台鐵）前面一大串一定接不上的班次只留最後 2 班，說明為何趕不上
  if(hi>0){const f=trains.findIndex(h=>!chainAround(legs,hi,bufs,meta,T0,h).why);if(f>2) trains=trains.slice(f-2)}
  if(!trains.length) return '';
  const dest=meta[meta.length-1][2];
  const rows=trains.map(h=>{
    const res=chainAround(legs,hi,bufs,meta,T0,h);
    const dur=h.arr-h.dep,slow=hsrMax&&dur>hsrMax;
    const pi=plans.findIndex(p=>p.legs[hi]===h);
    const tags=[];
    if(pi>=0) tags.push(`<span class="xtag">方案 ${pi+1}</span>`);
    if(slow) tags.push(`<span class="xtag r">慢車</span>`);
    let sub,cls='';
    if(res.why){sub=`<span class="xh-why">${res.why}</span>`;cls=' dim'}
    else{
      const p=res.plan;
      const pre=hi>0?`${meta[0][0]} ${hm(p.dep)} 出發・`+(isHsr?'':(()=>{const hs=p.legs.find(l=>l.mode==='hsr');return hs?`接高鐵 ${hs.no}・`:''})()):'';
      sub=`${pre}<b class="xh-arr">抵達${dest} ${hmx(p.arr)}</b>`;
      if(pi<0&&h.seat?.std==='full'&&getSkipFull()){
        sub+=`<br><span class="xh-note">標準車廂已售完，所以沒列入方案</span>`;
      }else if(pi<0){
        const better=plans.find(q=>q.dep>=p.dep&&q.arr<=p.arr);
        if(better) sub+=`<br><span class="xh-note">${hm(better.dep)} 出發也能 ${hm(better.arr)} 到，所以沒列入方案</span>`;
        else if(slow) sub+=`<br><span class="xh-note">車程 ${fmtDur(dur)} 超過上限 ${fmtDur(hsrMax)}，所以沒列入方案</span>`;
        else sub+=`<br><span class="xh-note">排在前 ${MAX_PLANS} 個方案之後</span>`;
      }
    }
    const body=res.plan?`<div class="xalt-body">${timelineHTML(res.plan,meta,bufs,r)}</div>`:'';
    return `<div class="xh-row${cls}"${res.plan?` onclick="this.nextElementSibling.classList.toggle('show')"`:''}>
      <div class="xh-t"><b>${hm(h.dep)}</b><span>${hm(h.arr)}</span></div>
      <div class="xh-m"><div class="xh-top">${isHsr?`高鐵 ${h.no}`:`<span class="xh-type ${traCls(h.type)}">${h.type}</span>${h.no}`}<span class="xh-dur">${fmtDur(dur)}</span>${isHsr?seatHTML(h,true):''}${h.live>0?`<span class="xdl late">晚 ${h.live} 分</span>`:''}${tags.join('')}</div><div class="xh-sub">${sub}</div></div>
    </div>${body}`;
  }).join('');
  let summary=`${trains.length} 班・${meta[hi][1].replace('高鐵','')} → ${meta[hi][2].replace('高鐵','')}`;
  if(!isHsr){
    const cnt={};trains.forEach(t=>cnt[t.type]=(cnt[t.type]||0)+1);
    summary=`${meta[hi][1]} → ${meta[hi][2]}・`+Object.entries(cnt).sort((a,b)=>b[1]-a[1]).map(([t,n])=>`${t} ${n}`).join('、');
  }
  return `<div class="xall"><button class="xall-hd" aria-expanded="false" onclick="const b=this.nextElementSibling;b.classList.toggle('show');this.setAttribute('aria-expanded',b.classList.contains('show'))">全部${meta[hi][0]}班次<span>${summary}</span><i>›</i></button><div class="xall-body">${rows}</div></div>`;
}

function traCls(t){return /自強|普悠瑪|太魯閣/.test(t)?'ex':/莒光/.test(t)?'mid':'loc'}
function tickXfer(){
  const now=nowM();
  document.querySelectorAll('[data-dep]').forEach(e=>{
    e.textContent=waitLabel(+e.dataset.dep,now);
  });
}

// Init
async function init(){
  loadF();renderF();upUI();updateClock();renderDateStrip();
  setInterval(updateClock,30000);
  document.getElementById('resCont').innerHTML=`<div class="empty-st"><div class="esi">🚈</div><div class="est">選擇起訖站開始查詢</div><div class="ess">選好出發站與到達站<br>按下查詢即可查看班次時刻</div></div>`;

  // Auto-connect if saved creds exist
  updateHomeBtn();pruneTdxCache();syncWhen();
  const creds=loadCreds();
  const wantHome=/[#?&]home\b/.test(location.hash+location.search);
  if(creds.id&&creds.secret){
    await connectTDX();
    if(wantHome) goHome();
  } else {
    document.getElementById('heroStat').className='hero-status offline';
  }
}
init();
</script>
