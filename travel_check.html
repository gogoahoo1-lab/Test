<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI 智能旅行證件檢核器</title>
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        @page {
            size: A4;
            margin: 15mm 12mm;
            background-color: #faf8f5;
        }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; 
            text-align: center; 
            padding: 20px; 
            background: #faf8f5; 
            color: #333; 
            margin: 0;
        }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        video, canvas, img { max-width: 100%; width: 100%; border-radius: 8px; margin-top: 10px; }
        select, button, input { width: 100%; padding: 12px; margin: 10px 0; font-size: 16px; border-radius: 6px; border: 1px solid #ccc; box-sizing: border-box; }
        button { background: #543729; color: white; border: none; font-weight: bold; cursor: pointer; }
        button:active { background: #3c271c; }
        #result { margin-top: 20px; text-align: left; background: #f9f9fb; padding: 15px; border-radius: 8px; border: 1px solid #e1e1e8; display: none; }
        .loading { color: #666; font-style: italic; }
        .config-box { background: #fdfbf7; padding: 12px; border-radius: 6px; margin-bottom: 15px; border: 1px dashed #dcd6cd; text-align: left; font-size: 14px; }
        .config-box label { display: block; margin-bottom: 5px; font-weight: bold; color: #543729; }
    </style>
</head>
<body>

<div class="container">
    <h2>✈️ AI 證件與簽證檢核</h2>
    
    <div class="config-box">
        <label for="api-key">Claude API Key (僅存於你的手機瀏覽器)：</label>
        <input type="password" id="api-key" placeholder="請輸入 sk-ant-api03-..." />
    </div>

    <label for="destination">請選擇目的地國家：</label>
    <select id="destination">
        <option value="Japan">日本 (Japan)</option>
        <option value="Schengen">申根區 (Schengen / 歐洲)</option>
        <option value="USA">美國 (USA)</option>
        <option value="Korea">韓國 (Korea)</option>
    </select>

    <button id="start-camera">開啟手機相機</button>
    <video id="video" autoplay playsinline style="display:none;"></video>
    <button id="capture" style="display:none;">拍照並送交 AI 檢核</button>
    
    <canvas id="canvas" style="display:none;"></canvas>
    <img id="photo" alt="拍攝結果" style="display:none;">

    <div id="result">
        <h3>📋 檢核結果：</h3>
        <p id="output-text" class="loading">準備中...</p>
    </div>
</div>

<script>
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    const photo = document.getElementById('photo');
    const startBtn = document.getElementById('start-camera');
    const captureBtn = document.getElementById('capture');
    const resultDiv = document.getElementById('result');
    const outputText = document.getElementById('output-text');
    const destinationSelect = document.getElementById('destination');
    const apiKeyInput = document.getElementById('api-key');

    let stream = null;

    startBtn.addEventListener('click', async () => {
        const apiKey = apiKeyInput.value.trim();
        if (!apiKey) {
            alert('請先在上方欄位輸入您的 Claude API Key 才能使用 AI 辨識！');
            return;
        }

        try {
            stream = await navigator.mediaDevices.getUserMedia({ 
                video: { facingMode: { exact: "environment" } } 
            }).catch(() => {
                return navigator.mediaDevices.getUserMedia({ video: true }); 
            });
            
            video.srcObject = stream;
            video.style.display = 'block';
            captureBtn.style.display = 'block';
            startBtn.style.display = 'none';
            resultDiv.style.display = 'none';
        } catch (err) {
            alert('無法開啟相機，請檢查瀏覽器權限：' + err);
        }
    });

    captureBtn.addEventListener('click', async () => {
        const apiKey = apiKeyInput.value.trim();
        const destination = destinationSelect.value;

        const width = video.videoWidth;
        const height = video.videoHeight;
        canvas.width = width;
        canvas.height = height;
        
        const context = canvas.getContext('2d');
        context.drawImage(video, 0, 0, width, height);
        
        const dataUrl = canvas.toDataURL('image/jpeg');
        photo.src = dataUrl;
        photo.style.display = 'block';
        video.style.display = 'none';
        captureBtn.style.display = 'none';

        if (stream) {
            stream.getTracks().forEach(track => track.stop());
        }

        resultDiv.style.display = 'block';
        outputText.className = 'loading';
        outputText.innerText = `正在呼叫 Claude AI 進行 [${destination}] 入境規定比對，請稍候...`;

        try {
            // 直接呼叫 Anthropic Claude API (使用 claude-3-5-sonnet)
            const response = await fetch('https://api.anthropic.com/v1/messages', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'x-api-key': apiKey,
                    'anthropic-version': '2023-06-01',
                    'anthropic-dangerous-direct-browser-access': 'true' // 允許直接從瀏覽器端呼叫
                },
                body: JSON.stringify({
                    model: "claude-3-5-sonnet-20241022",
                    max_tokens: 1000,
                    messages: [
                        {
                            role: "user",
                            content: [
                                {
                                    type: "image",
                                    source: {
                                        type: "base64",
                                        media_type: "image/jpeg",
                                        data: dataUrl.replace(/^data:image\/jpeg;base64,/, ""),
                                    },
                                },
                                {
                                    type: "text",
                                    text: `這是一張旅客的旅行證件。請幫我檢查它是否符合前往「${destination}」的常見規定（例如護照效期是否需剩餘 6 個月以上、是否需要簽證或電子簽證提示等）。請條列式給出：1. 辨識出的證件資訊 2. 是否符合規定 3. 建議與注意事項。`
                                }
                            ]
                        }
                    ]
                })
            });

            const data = await response.json();
            
            outputText.className = '';
            if (response.ok && data.content && data.content[0]) {
                outputText.innerHTML = `<strong>審查完畢：</strong><br>` + data.content[0].text.replace(/\n/g, '<br>');
            } else {
                outputText.innerText = '檢核失敗：' + (data.error?.message || JSON.stringify(data));
            }
        } catch (err) {
            outputText.className = '';
            outputText.innerText = '連線失敗或發生錯誤：' + err.message;
        }
    });
</script>

</body>
</html>
