<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<title>WiFi 測速記錄器</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@300;400;500;700&family=Noto+Serif+TC:wght@500;700&family=IBM+Plex+Mono:wght@400;500&family=Sora:wght@200;300;400&family=Instrument+Serif&family=Big+Shoulders+Display:wght@800&family=Archivo:wght@300;500;800;900&display=swap">
<style>
/* 一個 App、五種外觀：1 精密儀表 / 2 夜曲錶盤 / 3 便當格 / 4 聲波週報 / 5 瑞士網格。共用測速引擎與設定面板。 */
:root{
  --sans:"Noto Sans TC","PingFang TC",system-ui,sans-serif;
  --serif:"Noto Serif TC","Songti TC",serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none!important}
html,body{margin:0;min-height:100%}
body{font-family:var(--sans);-webkit-font-smoothing:antialiased;transition:background .3s}
body[data-skin="1"]{background:#EDEEEC}
body[data-skin="2"]{background:#0A0E1A}
body[data-skin="3"]{background:#EBEBEE}
body[data-skin="4"]{background:#F5F5F2}
body[data-skin="5"]{background:#FFFFFF}
.app{max-width:440px;margin:0 auto;padding-top:calc(env(safe-area-inset-top,0px) + 12px);padding-bottom:calc(env(safe-area-inset-bottom,0px) + 24px)}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
svg{display:block}
.skin{min-height:60vh}

/* ===== 1 精密儀表 ===== */
.s1{color:#1E2326;padding:0 max(20px,env(safe-area-inset-left,0px)) 0 max(20px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.s1 .top{display:flex;justify-content:space-between;align-items:center}
.s1 .brand{font-size:11px;letter-spacing:.32em;font-weight:500}
.s1 .stamp{font-family:var(--mono);font-size:10.5px;color:#6E7477;letter-spacing:.06em}
.s1 .gear{width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%;border:1px solid #C9CCC8}
.s1 .dial{background:radial-gradient(circle at 50% 42%,#FBFBF9 0%,#F2F3F0 62%,#E3E5E1 100%);border-radius:24px;
  box-shadow:inset 0 1px 0 #fff,inset 0 -1px 0 rgba(0,0,0,.06),0 1px 2px rgba(0,0,0,.06);padding:6px 4px 0}
.s1 .row3{display:grid;grid-template-columns:repeat(3,1fr);border-top:1px solid #1E2326;border-bottom:1px solid #1E2326}
.s1 .row3>div{padding:9px 0 8px 10px;border-left:1px solid #C9CCC8;min-width:0}
.s1 .row3>div:first-child{border-left:0;padding-left:0}
.s1 .k{font-size:10px;letter-spacing:.2em;color:#6E7477}
.s1 .v{font-family:var(--mono);font-size:19px;font-weight:500;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.s1 .v small{font-size:10px;color:#6E7477;margin-left:3px;font-weight:400}
.s1 .ctl{display:flex;gap:8px}
.s1 .btn{flex:1;height:46px;border-radius:12px;background:#1E2326;color:#EDEEEC;display:flex;align-items:center;justify-content:center;gap:9px;font-size:13px;letter-spacing:.14em}
.s1 .btn i{width:7px;height:7px;border-radius:50%;background:#8A9094}
.s1 .btn.on i{background:#D23A2A;box-shadow:0 0 0 3px rgba(210,58,42,.25);animation:blink 1.6s infinite}
.s1 .ghost{height:46px;border-radius:12px;border:1px solid #C9CCC8;padding:0 14px;font-size:12px;letter-spacing:.08em;color:#3B4144}
.s1 .stat{font-family:var(--mono);font-size:10.5px;color:#6E7477;letter-spacing:.04em;margin-top:-6px}
.s1 .cap{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:6px}
.s1 .cap b{font-size:10px;letter-spacing:.24em;font-weight:500}
.s1 .cap span{font-family:var(--mono);font-size:10px;color:#6E7477}
.s1 .paper{background:#F6F7F5;border:1px solid #D5D8D4;border-radius:4px}
.s1 .srv{font-family:var(--mono);font-size:10.5px;color:#3B4144;letter-spacing:.04em;text-align:center;margin-top:-8px}
.s1 .srv b{font-weight:500;color:#1E2326}
.s1 .inf{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #D5D8D4}
.s1 .inf:first-child{border-top:1px solid #1E2326}
.s1 .inf .l{font-size:10px;letter-spacing:.2em;color:#6E7477;white-space:nowrap;padding-top:2px}
.s1 .inf .r{text-align:right;min-width:0;font-family:var(--mono);font-size:12px;overflow-wrap:anywhere}
.s1 .inf small{display:block;font-size:10px;color:#6E7477;margin-top:1px}

/* ===== 2 夜曲錶盤 ===== */
.s2{color:#E6EAF3;padding:0 max(18px,env(safe-area-inset-left,0px)) 0 max(18px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px;
  background:radial-gradient(120% 60% at 50% 12%,#18213A 0%,#0D1222 48%,#0A0E1A 100%);margin-top:-12px;padding-top:12px}
.s2 .hdr{display:flex;justify-content:space-between;align-items:center;gap:8px}
.s2 .hdr h4{margin:0;font-weight:300;font-size:22px;letter-spacing:.04em}
.s2 .pill{font-size:11px;color:#9AA6C2;display:flex;align-items:center;gap:6px;border:.5px solid rgba(255,255,255,.14);border-radius:20px;padding:5px 11px;background:rgba(255,255,255,.04);white-space:nowrap}
.s2 .pill i{width:6px;height:6px;border-radius:50%;background:#5D6886}
.s2 .pill.on i{background:#7FE0CF;box-shadow:0 0 8px #7FE0CF}
.s2 .glass{background:linear-gradient(180deg,rgba(255,255,255,.06),rgba(255,255,255,.025));border:.5px solid rgba(255,255,255,.1);border-radius:22px;padding:14px 16px}
.s2 .trio{display:grid;grid-template-columns:repeat(3,1fr);text-align:center}
.s2 .trio div+div{border-left:.5px solid rgba(255,255,255,.1)}
.s2 .k{font-size:11px;color:#8590AC;letter-spacing:.08em}
.s2 .v{font-family:Sora,var(--sans);font-weight:300;font-size:22px;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.s2 .v small{font-size:11px;color:#8590AC;margin-left:2px}
.s2 .cap{display:flex;justify-content:space-between;font-size:12px;color:#9AA6C2;margin-bottom:8px}
.s2 .cap em{font-style:normal;color:#FF8A6B}
.s2 .srv{text-align:center;font-size:11.5px;color:#8590AC;margin-top:-4px;letter-spacing:.03em}
.s2 .srv b{font-weight:400;color:#C9D1E3}
.s2 .inf{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-top:.5px solid rgba(255,255,255,.08)}
.s2 .inf:first-of-type{border-top:0}
.s2 .inf .l{font-size:12px;color:#8590AC;white-space:nowrap}
.s2 .inf .r{text-align:right;min-width:0;font-size:13px;color:#E6EAF3;overflow-wrap:anywhere}
.s2 .inf small{display:block;font-size:11px;color:#5D6886;margin-top:1px}
.s2 .acts{display:grid;grid-template-columns:1fr 1fr auto;gap:8px}
.s2 .gbtn{height:46px;border-radius:16px;border:.5px solid rgba(255,255,255,.14);background:rgba(255,255,255,.05);font-size:13px;color:#E6EAF3;padding:0 14px}
.s2 .gbtn.pri{background:#7FE0CF;color:#0A1A1A;border-color:#7FE0CF;font-weight:500}
.s2 .gbtn.pri.on{background:rgba(255,122,89,.16);color:#FF9A7E;border-color:rgba(255,122,89,.4)}

/* ===== 3 便當格 ===== */
.s3{color:#17181C;padding:0 max(14px,env(safe-area-inset-left,0px)) 0 max(14px,env(safe-area-inset-right,0px));display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.s3 .hdr{grid-column:span 2;display:flex;justify-content:space-between;align-items:center;padding:2px 6px 4px}
.s3 .hdr h4{margin:0;font-size:26px;font-weight:700;letter-spacing:-.01em}
.s3 .av{width:38px;height:38px;border-radius:50%;background:#17181C;display:flex;align-items:center;justify-content:center}
.s3 .tile{border-radius:26px;padding:16px;position:relative;overflow:hidden;min-width:0}
.s3 .hero{grid-column:span 2;background:#2B3FD6;color:#fff;padding:18px 18px 16px;transition:background .4s}
.s3 .serif{font-family:"Instrument Serif",var(--serif);font-weight:400;letter-spacing:-.02em;line-height:.9;font-variant-numeric:tabular-nums}
.s3 .k{font-size:12px;opacity:.72}
.s3 .chip{display:inline-flex;align-items:center;gap:6px;font-size:11px;border-radius:20px;padding:4px 10px;white-space:nowrap}
.s3 .sand{background:#E8DCC6;color:#3B2F17}
.s3 .mist{background:#D9DBF4;color:#1E2350}
.s3 .white{background:#FBFBFC}
.s3 .ink{background:#17181C;color:#F1F1F3}
.s3 .wide{grid-column:span 2}
.s3 .toggle{width:50px;height:30px;border-radius:15px;background:#D6D7DD;position:relative;flex:none;transition:background .25s}
.s3 .toggle::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.2);transition:left .25s}
.s3 .toggle.on{background:#C8F25A}
.s3 .toggle.on::after{left:23px;background:#17181C}
.s3 .srv{display:flex;align-items:center;gap:6px;font-size:11.5px;opacity:.8;margin-top:10px;padding-top:10px;border-top:1px solid rgba(255,255,255,.18)}
.s3 .inf{display:flex;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid #EFEFF2}
.s3 .inf:first-of-type{border-top:0;padding-top:2px}
.s3 .inf .l{font-size:12.5px;color:#6A6D78;white-space:nowrap}
.s3 .inf .r{text-align:right;min-width:0;font-size:13.5px;font-weight:500;overflow-wrap:anywhere}
.s3 .inf small{display:block;font-size:11px;color:#8A8D98;font-weight:400;margin-top:1px}
.s3 .now{height:34px;border-radius:17px;background:#17181C;color:#fff;font-size:12px;padding:0 14px}

/* ===== 4 聲波週報 ===== */
.s4{color:#111;padding:0 max(22px,env(safe-area-inset-left,0px)) 0 max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:14px}
.s4 .mast{display:flex;justify-content:space-between;align-items:baseline;border-bottom:2px solid #111;padding-bottom:8px;gap:8px}
.s4 .mast h4{margin:0;font-family:var(--serif);font-weight:700;font-size:21px;letter-spacing:.06em}
.s4 .mast span{font-family:var(--mono);font-size:10px;letter-spacing:.12em}
.s4 .big{font-family:"Big Shoulders Display",var(--sans);font-weight:800;font-size:132px;line-height:.78;letter-spacing:-.02em;font-variant-numeric:tabular-nums}
.s4 .unit{font-family:var(--mono);font-size:11px;letter-spacing:.14em}
.s4 .lede{font-family:var(--serif);font-size:15px;line-height:1.6;margin:0}
.s4 .lede em{font-style:normal;color:#E8501C}
.s4 .rule{border-top:1px solid #111}
.s4 .cap{display:flex;justify-content:space-between;font-family:var(--mono);font-size:10px;letter-spacing:.12em;color:#55554F;margin-bottom:6px}
.s4 table{width:100%;border-collapse:collapse;font-family:var(--mono);font-size:11.5px;font-variant-numeric:tabular-nums}
.s4 td{padding:7px 0;border-bottom:1px solid #DCDCD6;text-align:right}
.s4 td:first-child{text-align:left;color:#55554F}
.s4 td.hot{color:#E8501C}
.s4 .inf{display:grid;grid-template-columns:76px minmax(0,1fr);gap:10px;padding:7px 0;border-bottom:1px solid #DCDCD6;align-items:baseline}
.s4 .inf .l{font-family:var(--serif);font-size:12.5px;font-weight:500}
.s4 .inf .r{font-family:var(--mono);font-size:11.5px;overflow-wrap:anywhere}
.s4 .inf small{display:block;color:#55554F;font-size:10px;margin-top:2px}
.s4 .links{display:flex;gap:18px;font-family:var(--mono);font-size:12px;letter-spacing:.08em;border-top:2px solid #111;padding-top:10px}
.s4 .links button{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:1px}
.s4 .links .on{color:#E8501C}

/* ===== 5 瑞士網格 ===== */
.s5{--k:#0A0A0A;--r:#E2001A;--g:#8C8C8C;color:var(--k);font-family:Archivo,var(--sans);
  padding:0 max(22px,env(safe-area-inset-left,0px)) 0 max(22px,env(safe-area-inset-right,0px));
  background-image:linear-gradient(90deg,rgba(0,0,0,.035) 1px,transparent 1px);background-size:calc((100% - 44px)/6) 100%;background-position:22px 0;background-repeat:repeat-x;background-clip:content-box}
.s5 .hd{display:grid;grid-template-columns:repeat(3,1fr);font-size:10.5px;font-weight:500;letter-spacing:.04em;border-top:2px solid var(--k);padding-top:6px}
.s5 .hd>*:nth-child(2){text-align:center}.s5 .hd>*:last-child{text-align:right}
.s5 .hd button{font:inherit;text-align:right;text-decoration:underline;text-underline-offset:3px}
.s5 .num{font-weight:900;font-size:150px;line-height:.8;letter-spacing:-.06em;margin:20px 0 0 -6px;font-variant-numeric:tabular-nums;white-space:nowrap}
.s5 .num small{font-size:.32em;letter-spacing:-.02em;font-weight:800}
.s5 .of{font-weight:300;font-size:26px;letter-spacing:-.02em;margin:6px 0 16px;display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
.s5 .of b{font-weight:500}
.s5 .lab{font-size:10.5px;font-weight:500;letter-spacing:.06em;display:flex;justify-content:space-between;gap:10px;border-top:1px solid var(--k);padding:6px 0 8px}
.s5 .lab span:last-child{text-align:right}
.s5 .tri{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));border-top:1px solid var(--k);margin-top:16px}
.s5 .tri div{padding:8px 0 12px;min-width:0}
.s5 .tri small{font-size:10.5px;font-weight:500}
.s5 .tri b{display:block;font-size:clamp(20px,6.2vw,27px);font-weight:800;letter-spacing:-.03em;font-variant-numeric:tabular-nums;line-height:1.15;white-space:nowrap}
.s5 .tri div+div{padding-left:8px}
.s5 .ctl{display:grid;grid-template-columns:2fr 1fr;border-top:1px solid var(--k);border-bottom:1px solid var(--k)}
.s5 .ctl button{height:58px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;font-family:Archivo,var(--sans);font-size:14px;font-weight:800;letter-spacing:-.01em}
.s5 .ctl .go{background:var(--k);color:#fff}
.s5 .ctl .go.on{background:#fff;color:var(--k);border-right:1px solid var(--k)}
.s5 .ctl .go i{width:8px;height:8px;background:currentColor;display:inline-block}
.s5 .ctl .go.on i{background:var(--r);animation:blink 1.6s infinite}
.s5 .stat{font-size:11px;font-weight:500;padding:8px 0 0;font-variant-numeric:tabular-nums}
.s5 .blk{margin-top:22px}
.s5 .entry{border-top:2px solid var(--k);padding:14px 0 18px;margin-top:26px}
.s5 .entry b{display:block;font-size:20px;font-weight:800;letter-spacing:-.02em}
.s5 .entry span span{font-size:11px;font-weight:500}
.s5 .entry .ar{font-size:30px;font-weight:300}
.s5 .inf{display:grid;grid-template-columns:2fr 4fr;gap:8px;padding:8px 0;border-bottom:1px solid #E2E2E2}
.s5 .inf .l{font-size:10.5px;font-weight:500;letter-spacing:.04em}
.s5 .inf .r{font-size:13px;font-weight:500;min-width:0;overflow-wrap:anywhere}
.s5 .inf small{display:block;font-size:10px;color:var(--g);font-weight:400;margin-top:1px}
.s5 .foot{display:flex;justify-content:space-between;font-size:10px;font-weight:500;color:var(--g);padding:18px 0 4px}
@keyframes blink{50%{opacity:.35}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== 設定面板（共用） ===== */
.scrim{position:fixed;inset:0;background:rgba(10,12,16,.38);z-index:20;-webkit-backdrop-filter:blur(2px);backdrop-filter:blur(2px)}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-height:88vh;overflow-y:auto;background:#FAFAFA;color:#17181C;border-radius:24px 24px 0 0;
  padding:10px max(20px,env(safe-area-inset-left,0px)) calc(env(safe-area-inset-bottom,0px) + 20px) max(20px,env(safe-area-inset-right,0px));
  box-shadow:0 -10px 40px rgba(0,0,0,.18);max-width:520px;margin:0 auto}
.sheet .grab{width:38px;height:5px;border-radius:3px;background:#D4D5DA;margin:0 auto 14px}
.sheet h3{margin:0 0 4px;font-size:18px}
.sheet .sec{padding:14px 0;border-bottom:1px solid #EAEAEE;display:flex;flex-direction:column;gap:10px}
.sheet .lbl{font-size:12px;color:#6A6D78;letter-spacing:.06em}
.skins{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.skins button{border-radius:12px;border:1.5px solid transparent;padding:5px;display:flex;flex-direction:column;align-items:center;gap:5px;font-size:10.5px;color:#3A3D46;white-space:nowrap}
.skins button.on{border-color:#17181C}
.skins i{display:block;width:100%;aspect-ratio:3/4;border-radius:9px}
.segc{display:flex;background:#EEEEF2;border-radius:11px;padding:3px}
.segc button{flex:1;height:34px;border-radius:9px;font-size:13px;color:#5A5D68}
.segc button.on{background:#fff;color:#17181C;box-shadow:0 1px 2px rgba(0,0,0,.08)}
.sheet input[type=number]{font:inherit;font-family:var(--mono);width:110px;height:40px;border-radius:10px;border:1px solid #DCDDE2;padding:0 12px;background:#fff;color:#17181C}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.sheet .b{height:42px;border-radius:12px;border:1px solid #DCDDE2;padding:0 16px;font-size:14px;background:#fff}
.sheet .b.dark{background:#17181C;color:#fff;border-color:#17181C}
.sheet .b.red{background:#D23A2A;color:#fff;border-color:#D23A2A}
.sheet .note{font-size:12px;color:#6A6D78;line-height:1.6;margin:0}
.sheet textarea{width:100%;height:110px;font-family:var(--mono);font-size:11px;border:1px solid #DCDDE2;border-radius:10px;padding:8px;background:#fff;color:#17181C}
.ipbtn{text-decoration:underline;text-decoration-style:dotted;text-underline-offset:3px;cursor:pointer}
/* ===== 診斷與申訴信 ===== */
.rp{position:fixed;inset:0;z-index:22;overflow-y:auto;background:#F2F2F0;color:#1A1C1F;-webkit-overflow-scrolling:touch}
.rp .wrap{max-width:560px;margin:0 auto;padding:calc(env(safe-area-inset-top,0px) + 14px) max(18px,env(safe-area-inset-right,0px)) calc(env(safe-area-inset-bottom,0px) + 40px) max(18px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;gap:18px}
.rp .bar{display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;background:#F2F2F0;padding:8px 0;z-index:2}
.rp .bar h2{margin:0;font-size:17px;font-weight:700;letter-spacing:.02em}
.rp .x{height:34px;padding:0 14px;border-radius:17px;background:#1A1C1F;color:#fff;font-size:13px}
.rp .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;color:#7A7D84}
.rp .segc{background:#E4E4E1}
.rp .verdict{border-radius:20px;padding:18px;background:#1A1C1F;color:#F2F2F0;display:flex;flex-direction:column;gap:6px}
.rp .verdict b{font-family:var(--serif);font-size:22px;font-weight:700;letter-spacing:.02em}
.rp .verdict span{font-size:12.5px;color:#B5B8BE;line-height:1.6}
.rp .verdict.ok{background:#E3EEE6;color:#1D3B27}.rp .verdict.ok span{color:#4D6B57}
.rp .fd{display:flex;flex-direction:column;gap:1px;border-radius:18px;overflow:hidden;background:#DCDCD8}
.rp .f{background:#FBFBFA;padding:14px 16px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:start}
.rp .f h4{margin:0;font-size:14.5px;font-weight:700;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.rp .f p{margin:0;font-size:12.5px;color:#55585F;line-height:1.65;grid-column:1}
.rp .f .n{font-family:var(--mono);font-size:20px;font-weight:500;text-align:right;grid-row:1/3;grid-column:2;white-space:nowrap}
.rp .f .n small{display:block;font-size:10px;color:#7A7D84;font-weight:400}

<script>
/* ================================================================
   測速引擎
   ================================================================ */
const BASE = 'https://speed.cloudflare.com';
const KEY = 'wifi-speed-log-v1', SET = 'wifi-speed-settings-v1';
const DAYS = ['一','二','三','四','五','六','日'];
const $ = id => document.getElementById(id);

let log = [];
let settings = { interval: 15, plan: 300, running: false, skin: 5 };
let running = false, testing = false, nextAt = 0, tick = null, wakeLock = null;
let live = null, phase = '';   // 測速中即時讀數
let meta = null, showIp = false; // 連線資訊

const COLO = {TPE:'台北',RMQ:'台中',KHH:'高雄',HKG:'香港',NRT:'東京',HND:'東京',KIX:'大阪',FUK:'福岡',OKA:'沖繩',ICN:'首爾',SIN:'新加坡',MNL:'馬尼拉',BKK:'曼谷',KUL:'吉隆坡',CGK:'雅加達',SGN:'胡志明市',HAN:'河內',LAX:'洛杉磯',SJC:'聖荷西',SFO:'舊金山',SEA:'西雅圖',ORD:'芝加哥',IAD:'華盛頓',EWR:'紐約',FRA:'法蘭克福',LHR:'倫敦',AMS:'阿姆斯特丹',CDG:'巴黎',SYD:'雪梨',MEL:'墨爾本'};
const COUNTRY = {TW:'台灣',JP:'日本',HK:'香港',SG:'新加坡',US:'美國',KR:'韓國',CN:'中國',MO:'澳門',TH:'泰國',MY:'馬來西亞',PH:'菲律賓',VN:'越南',GB:'英國',DE:'德國',AU:'澳洲'};
async function fetchMeta(){
  try{
    const r = await fetch(`${BASE}/meta?r=${Math.random()}`, {cache:'no-store'});
    if(r.ok){
      const j = await r.json();
      if(j && (j.colo || j.clientIp)) return { colo:j.colo||'', city:j.city||'', region:j.region||'', country:j.country||'', ip:j.clientIp||'', asn:j.asn||'', isp:j.asOrganization||'', proto:j.httpProtocol||'', t:Date.now() };
    }
  }catch(e){}
  try{
    const r = await fetch(`${BASE}/__down?bytes=0&r=${Math.random()}`, {cache:'no-store'});
    const g = k => r.headers.get('cf-meta-' + k) || '';
    if(g('colo') || g('ip')) return { colo:g('colo'), city:g('city'), region:'', country:g('country'), ip:g('ip'), asn:g('asn'), isp:'', proto:'', t:Date.now() };
  }catch(e){}
  return null;
}
async function refreshMeta(){
  const m = await fetchMeta();
  if(m){ meta = m; try{ localStorage.setItem('wifi-speed-meta-v1', JSON.stringify(m)); }catch(e){} }
  return m;
}
const coloName = c => c ? (COLO[c] ? `${c}・${COLO[c]}` : c) : '';
const countryName = c => COUNTRY[c] || c || '';
function maskIp(ip){
  if(!ip) return '—';
  if(showIp) return ip;
  if(ip.includes(':')) return ip.split(':').slice(0,2).join(':') + ':••••';
  const p = ip.split('.'); return p.length === 4 ? `${p[0]}.${p[1]}.•••.•••` : ip;
}
function infoRows(){
  const m = meta;
  const where = m && m.city ? `${m.city}${m.country ? '，' + countryName(m.country) : ''}` : m && m.country ? countryName(m.country) : '—';
  return [
    ['測速伺服器', m && m.colo ? `Cloudflare ${coloName(m.colo)}` : '—', 'speed.cloudflare.com'],
    ['你的位置', where, '依 IP 推估，非精確定位'],
    ['網路業者', m && m.isp ? m.isp : '—', m && m.asn ? 'AS' + m.asn : ''],
    ['對外 IP', `<span class="ipbtn" data-act="ip">${esc(maskIp(m && m.ip))}</span>`, (m && m.proto ? m.proto + ' · ' : '') + (showIp ? '點一下隱藏' : '點一下顯示完整')],
    ['測量方式', '下載、上傳各 4 路並行 8 秒', '延遲取 6 次中位數 · 抖動為相鄰差平均'],
  ];
}
const esc = v => String(v).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function infoHTML(){
  return infoRows().map(([l,v,sub]) => `<div class="inf"><span class="l">${l}</span><span class="r">${l === '對外 IP' ? v : esc(v)}${sub ? `<small>${esc(sub)}</small>` : ''}</span></div>`).join('');
}
function srvLine(){
  if(!meta) return '正在取得伺服器資訊…';
  const parts = [];
  if(meta.colo) parts.push(`伺服器 ${coloName(meta.colo)}`);
  if(meta.isp) parts.push(meta.isp);
  return parts.join(' · ') || '—';
}

function load(){
  try{ log = JSON.parse(localStorage.getItem(KEY) || '[]'); }catch(e){ log = []; }
  try{ Object.assign(settings, JSON.parse(localStorage.getItem(SET) || '{}')); }catch(e){}
  try{ meta = JSON.parse(localStorage.getItem('wifi-speed-meta-v1') || 'null'); }catch(e){ meta = null; }
}
const save = () => { try{ localStorage.setItem(KEY, JSON.stringify(log)); }catch(e){} };
const saveSet = () => { try{ localStorage.setItem(SET, JSON.stringify(settings)); }catch(e){} };

async function measurePing(){
  const arr = [];
  for(let i=0;i<7;i++){
    const t = performance.now();
    await fetch(`${BASE}/__down?bytes=0&r=${Math.random()}`, {cache:'no-store'});
    arr.push(performance.now() - t);
  }
  const raw = arr.slice(1), s = raw.slice().sort((a,b)=>a-b);
  let jit = 0; for(let i=1;i<raw.length;i++) jit += Math.abs(raw[i]-raw[i-1]);
  return { ping: s[Math.floor(s.length/2)], jitter: jit/(raw.length-1) };
}
async function measureDown(onLive){
  const BUDGET = 8000, WARM = 1000, STREAMS = 4, CHUNK = 25e6;
  const start = performance.now(); let counted = 0, done = false;
  const ctrl = new AbortController();
  const timer = setTimeout(()=>{ done = true; ctrl.abort(); }, BUDGET);
  const stream = async () => {
    while(!done){
      const r = await fetch(`${BASE}/__down?bytes=${CHUNK}&r=${Math.random()}`, {signal:ctrl.signal, cache:'no-store'});
      const rd = r.body.getReader();
      for(;;){
        const {done:d, value} = await rd.read();
        if(d) break;
        const el = performance.now() - start;
        if(el > WARM){ counted += value.length; onLive(counted*8/((el-WARM)/1000)/1e6); }
      }
    }
  };
  await Promise.allSettled(Array.from({length:STREAMS}, stream));
  clearTimeout(timer);
  const sec = (Math.min(performance.now()-start, BUDGET) - WARM)/1000;
  if(counted === 0) throw new Error('下載測試沒有收到資料');
  return counted*8/sec/1e6;
}
async function measureUp(onLive){
  const BUDGET = 8000, STREAMS = 4, SIZE = 2e6;
  const blob = new Blob([new Uint8Array(SIZE)]);
  const start = performance.now(); let bytes = 0, last = 0, done = false;
  const ctrl = new AbortController();
  const timer = setTimeout(()=>{ done = true; ctrl.abort(); }, BUDGET);
  const stream = async () => {
    while(!done){
      await fetch(`${BASE}/__up?r=${Math.random()}`, {method:'POST', body:blob, signal:ctrl.signal, cache:'no-store'});
      bytes += SIZE; last = performance.now() - start;
      onLive(bytes*8/(last/1000)/1e6);
    }
  };
  await Promise.allSettled(Array.from({length:STREAMS}, stream));
  clearTimeout(timer);
  if(bytes === 0) throw new Error('上傳測試沒有完成');
  return bytes*8/(last/1000)/1e6;
}

let rafPending = false;
function liveRender(){ if(rafPending) return; rafPending = true; setTimeout(()=>{ rafPending = false; render(); }, 120); }

async function runTest(){
  if(testing) return;
  testing = true;
  const rec = { t: Date.now() };
  live = { down: NaN, up: NaN, ping: NaN, jitter: NaN };
  try{
    phase = '測量延遲'; render();
    Object.assign(rec, await measurePing()); live.ping = rec.ping; live.jitter = rec.jitter;
    phase = '取得伺服器資訊'; render();
    const m = await refreshMeta();
    if(m){ rec.colo = m.colo; rec.isp = m.isp; rec.asn = m.asn; rec.city = m.city; }
    phase = '測量下載'; render();
    rec.down = await measureDown(v => { live.down = v; liveRender(); }); live.down = rec.down;
    phase = '測量上傳'; render();
    rec.up = await measureUp(v => { live.up = v; liveRender(); });
  }catch(e){
    rec.err = (e && e.message) || '連線失敗';
  }
  log.push(rec); save();
  testing = false; live = null; phase = '';
  if(rec.err) toast('測速失敗：' + rec.err + '。請確認網路連線。');
  if(running) nextAt = Date.now() + settings.interval*60000;
  render();
}

/* 排程 */
async function requestWake(){ try{ if('wakeLock' in navigator) wakeLock = await navigator.wakeLock.request('screen'); }catch(e){} }
function start(){
  running = true; settings.running = true; saveSet(); requestWake();
  nextAt = Date.now(); clearInterval(tick);
  tick = setInterval(()=>{ if(running && !testing && Date.now() >= nextAt) runTest(); else if(!testing) renderStatusOnly(); }, 1000);
  runTest();
}
function stop(){
  running = false; settings.running = false; saveSet();
  clearInterval(tick); tick = null;
  try{ wakeLock && wakeLock.release(); }catch(e){} wakeLock = null;
  render();
}
const toggleRun = () => running ? stop() : start();
document.addEventListener('visibilitychange', ()=>{
  if(document.visibilityState === 'visible' && running){ requestWake(); if(!testing && Date.now() >= nextAt) runTest(); }
});

/* ================================================================
   數據整理
   ================================================================ */
const pad = n => String(n).padStart(2,'0');
const hm = t => { const d = new Date(t); return `${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const f1 = v => Number.isFinite(v) ? v.toFixed(1) : '—';
const f0 = v => Number.isFinite(v) ? Math.round(v).toString() : '—';
const big = v => !Number.isFinite(v) ? '—' : v >= 100 ? Math.round(v).toString() : v.toFixed(1);
function niceMax(v){ return [50,100,150,200,300,400,500,600,800,1000,1200,1500,2000,2500,3000].find(s => s >= v) || Math.ceil(v/1000)*1000; }

function derive(){
  const plan = settings.plan, now = Date.now();
  const ok = log.filter(r => !r.err && Number.isFinite(r.down));
  const last = ok[ok.length-1] || null;
  const cur = live ? { down: live.down, up: live.up, ping: live.ping, jitter: live.jitter, t: now }
                   : last ? { down: last.down, up: last.up, ping: last.ping, jitter: last.jitter, t: last.t } : null;
  const t1 = now, t0 = now - 864e5;
  const recs = ok.filter(r => r.t >= t0);
  // 一週 × 24（近 28 天）
  const wk = Array.from({length:7}, () => Array.from({length:24}, () => ({s:0,n:0})));
  const hr = Array.from({length:24}, () => ({s:0,n:0}));
  ok.filter(r => r.t >= now - 28*864e5).forEach(r => {
    const d = new Date(r.t), w = (d.getDay()+6)%7, h = d.getHours();
    wk[w][h].s += r.down; wk[w][h].n++;
    if(r.t >= now - 7*864e5){ hr[h].s += r.down; hr[h].n++; }
  });
  const week = wk.map(row => row.map(c => c.n ? c.s/c.n : null));
  const hourly = hr.map(c => c.n ? c.s/c.n : null);
  let worst = null;
  week.forEach((row,w) => row.forEach((v,h) => { if(v != null && (!worst || v < worst.v)) worst = {w,h,v}; }));
  const recent = ok.filter(r => r.t >= now - 7*864e5);
  const night = recent.filter(r => new Date(r.t).getHours() >= 19), day = recent.filter(r => new Date(r.t).getHours() < 19);
  const avg = a => a.length ? a.reduce((s,r)=>s+r.down,0)/a.length : null;
  return { plan, cur, last, recs, t0, t1, week, hourly, worst, nightAvg: avg(night), dayAvg: avg(day),
           avg24: avg(recs), count: log.length, okCount: ok.length,
           ratio: cur && Number.isFinite(cur.down) ? cur.down/plan : null };
}
function statusText(D){
  if(testing) return phase + '…';
  if(running){
    const left = Math.max(0, nextAt - Date.now());
    return `偵測中 · 下次 ${hm(nextAt)}（${Math.floor(left/60000)}:${pad(Math.floor(left%60000/1000))}）`;
  }
  return D.last ? `已暫停 · 最近一次 ${hm(D.last.t)}` : '尚未測速 · 按下開始';
}
function nightBands(t0, t1){

const roc = t => { const d = new Date(t); return `${d.getFullYear()-1911} 年 ${d.getMonth()+1} 月 ${d.getDate()} 日`; };
const rocShort = t => { const d = new Date(t); return `${d.getFullYear()-1911}/${d.getMonth()+1}/${d.getDate()}`; };
const dayKey = t => { const d = new Date(t); return `${d.getFullYear()}-${d.getMonth()}-${d.getDate()}`; };
const avgOf = (a, k='down') => { const v = a.map(r => r[k]).filter(Number.isFinite); return v.length ? v.reduce((x,y)=>x+y,0)/v.length : null; };
function hourRanges(hours){
  // [20,21,22,23] → "20:00–24:00"；可跨午夜
  if(!hours.length) return [];
  const set = new Set(hours), out = [];
  let start = hours.find(h => !set.has((h+23)%24));
  if(start === undefined) return ['全天'];
  const seen = new Set();
  hours.forEach(h0 => {
    if(set.has((h0+23)%24) || seen.has(h0)) return;
    let h = h0, len = 0; while(set.has(h) && len < 24){ seen.add(h); h = (h+1)%24; len++; }
    out.push(`${pad(h0)}:00–${h === 0 ? '24' : pad(h)}:00`);
  });
  return out;
}

function analyze(days){
  const plan = settings.plan, now = Date.now(), from = days ? now - days*864e5 : 0;
  const all = log.filter(r => r.t >= from);
  const ok = all.filter(r => !r.err && Number.isFinite(r.down)), errs = all.filter(r => r.err);
  const A = { plan, days, n: ok.length, errs, ok, findings: [], enough: ok.length >= 8 };
  if(!ok.length) return A;
  A.start = ok[0].t; A.end = ok[ok.length-1].t;
  A.avg = avgOf(ok); A.upAvg = avgOf(ok,'up');
  const hr = h => new Date(h.t).getHours();
  const night = ok.filter(r => hr(r) >= 19), day = ok.filter(r => hr(r) >= 8 && hr(r) < 19);
  A.nightAvg = avgOf(night); A.dayAvg = avgOf(day);
  A.nightPing = avgOf(night,'ping'); A.dayPing = avgOf(day,'ping');
  const half = plan*.5;
  A.below = ok.filter(r => r.down < half).length; A.belowPct = A.below/ok.length;
  A.min = ok.reduce((m,r) => r.down < m.down ? r : m, ok[0]);
  // 各小時平均
  const byH = Array.from({length:24}, () => []); ok.forEach(r => byH[hr(r)].push(r));
  A.hourAvg = byH.map(a => a.length ? avgOf(a) : null);
  A.slowHours = A.hourAvg.map((v,h) => v != null && v < half ? h : -1).filter(h => h >= 0);
  A.slowRanges = hourRanges(A.slowHours);
  // 逐日重複發生：有晚間紀錄的日子中，有幾天晚間出現低於一半
  const nightDays = new Map();
  night.forEach(r => { const k = dayKey(r.t); const v = nightDays.get(k) || {n:0,low:0}; v.n++; if(r.down < half) v.low++; nightDays.set(k, v); });
  A.nightDayN = nightDays.size; A.nightDayLow = [...nightDays.values()].filter(v => v.low > 0).length;
  A.colo = (ok.find(r => r.colo) || {}).colo || (meta && meta.colo) || '';
  A.isp = (ok.slice().reverse().find(r => r.isp) || {}).isp || (meta && meta.isp) || '';
  A.sample = ok.some(r => r.sample);

  const F = A.findings, pctTxt = v => Math.round(v*100) + '%';
  if(A.nightAvg != null && A.dayAvg != null){
    const drop = 1 - A.nightAvg/A.dayAvg;
    if(drop >= .3 && A.nightAvg < plan*.7) F.push({ key:'night', sev: A.nightAvg < half ? 'hi' : 'md', title:'晚間尖峰時段速率大幅下降',
      num: pctTxt(drop), unit:'晚間降幅',
      text:`晚間 19–24 時平均下載 ${A.nightAvg.toFixed(1)} Mbps，白天 8–19 時為 ${A.dayAvg.toFixed(1)} Mbps，晚間慢了 ${pctTxt(drop)}，僅達方案的 ${pctTxt(A.nightAvg/plan)}。`,
      letter:`晚間 19 時至 24 時平均下載速率僅 ${A.nightAvg.toFixed(1)} Mbps，為約定方案（${plan} Mbps）之 ${pctTxt(A.nightAvg/plan)}；同期白天平均為 ${A.dayAvg.toFixed(1)} Mbps，晚間降幅達 ${pctTxt(drop)}。` });
  }
  if(A.belowPct >= .15) F.push({ key:'below', sev: A.belowPct >= .35 ? 'hi' : 'md', title:'速率頻繁低於方案一半',
    num: pctTxt(A.belowPct), unit:`${A.below}/${A.n} 次`,
    text:`${A.n} 次有效量測中有 ${A.below} 次下載低於 ${Math.round(half)} Mbps（方案的一半）。`,
    letter:`有效量測共 ${A.n} 次，其中 ${A.below} 次（${pctTxt(A.belowPct)}）下載速率低於方案之一半（${Math.round(half)} Mbps）。` });
  if(A.slowRanges.length && A.nightDayN >= 2 && A.nightDayLow/A.nightDayN >= .5) F.push({ key:'daily', sev: A.nightDayLow/A.nightDayN >= .7 ? 'hi' : 'md', title:'問題時段固定、逐日重複發生',
    num: `${A.nightDayLow}/${A.nightDayN}`, unit:'天',
    text:`平均低於方案一半的時段為 ${A.slowRanges.join('、')}；有晚間紀錄的 ${A.nightDayN} 天中，有 ${A.nightDayLow} 天晚間出現低於一半的情形。`,
    letter:`速率低落集中於每日 ${A.slowRanges.join('、')}，於有晚間紀錄之 ${A.nightDayN} 日中有 ${A.nightDayLow} 日重複發生，呈現固定時段、逐日發生之規律。` });
  if(A.nightPing != null && A.dayPing != null && A.nightPing > A.dayPing*1.5 && A.nightPing - A.dayPing > 8) F.push({ key:'ping', sev:'md', title:'晚間延遲明顯升高',
    num: `+${Math.round(A.nightPing - A.dayPing)}`, unit:'ms',
    text:`晚間平均延遲 ${Math.round(A.nightPing)} ms，白天 ${Math.round(A.dayPing)} ms，晚間高出 ${Math.round(A.nightPing - A.dayPing)} ms，符合網路壅塞的特徵。`,
    letter:`晚間平均延遲 ${Math.round(A.nightPing)} 毫秒，較白天之 ${Math.round(A.dayPing)} 毫秒明顯升高，顯示晚間存在網路壅塞。` });
  if(errs.length) F.push({ key:'err', sev: errs.length >= 3 ? 'hi' : 'md', title:'連線中斷或測速失敗',
    num: String(errs.length), unit:'次',
    text:`期間有 ${errs.length} 次無法完成測速，最近一次在 ${rocShort(errs[errs.length-1].t)} ${hm(errs[errs.length-1].t)}。`,
    letter:`期間另有 ${errs.length} 次因連線異常無法完成測速（如 ${errs.slice(-3).map(r => `${rocShort(r.t)} ${hm(r.t)}`).join('、')}）。` });
  if(A.upAvg != null && A.upAvg < plan*.3) F.push({ key:'up', sev:'lo', title:'上傳速率偏低',
    num: A.upAvg.toFixed(0), unit:'Mbps 平均',
    text:`平均上傳 ${A.upAvg.toFixed(1)} Mbps。若方案為對稱頻寬，上傳也明顯未達約定。`, letter:null });
  F.push({ key:'min', sev:'lo', title:'期間最低速率', num: A.min.down.toFixed(1), unit:'Mbps',
    text:`發生於 ${rocShort(A.min.t)} ${hm(A.min.t)}，僅達方案的 ${pctTxt(A.min.down/plan)}。`,
    letter:`期間最低下載速率為 ${A.min.down.toFixed(1)} Mbps（${rocShort(A.min.t)} ${hm(A.min.t)}），僅達方案之 ${pctTxt(A.min.down/plan)}。` });
  A.issues = F.filter(f => f.sev !== 'lo');
  return A;
}

  h += `<p class="ln" style="margin-bottom:2px"><b>說明：</b><span></span></p><ol>`;
  L.ex.forEach((e,i) => {
    h += `<li class="it"><span>${CN[i]}、</span><span>${segHTML(e.seg)}</span></li>`;
    if(e.sub) e.sub.forEach((s,j) => h += `<li class="it2"><span></span><span>（${CN[j]}）</span><span>${esc(s)}</span></li>`);
  });
  h += `</ol><div class="gap"></div><p class="ln" style="margin-bottom:2px"><b>請求事項：</b><span></span></p><ol>`;
  L.req.forEach((r,i) => h += `<li class="it"><span>${CN[i]}、</span><span>${esc(r)}</span></li>`);
  h += `</ol><div class="gap"></div><p class="ln"><b>附件：</b><span>網路測速紀錄（CSV 檔，共 ${L.n} 筆）乙份。</span></p>`;
  h += `<div class="gap"></div><p style="margin:0">此致</p><p style="margin:0">${segHTML([L.to])}</p>`;
  h += `<div class="sign">用戶　${segHTML([L.name])}<br>聯絡電話　${segHTML([L.tel])}<br>中華民國 ${L.date}</div>`;
  return h;
}
function letterTXT(L){
  const out = ['意見反映函', '', `主旨：${L.subject}`, '', '說明：'];
  L.ex.forEach((e,i) => { out.push(`${CN[i]}、${segTXT(e.seg)}`); if(e.sub) e.sub.forEach((s,j) => out.push(`　　（${CN[j]}）${s}`)); });
  out.push('', '請求事項：'); L.req.forEach((r,i) => out.push(`${CN[i]}、${r}`));
  out.push('', `附件：網路測速紀錄（CSV 檔，共 ${L.n} 筆）乙份。`, '', '此致', segTXT([L.to]), '', `用戶　${segTXT([L.name])}`, `聯絡電話　${segTXT([L.tel])}`, `中華民國 ${L.date}`);
  return out.join('\n');
}

let curLetter = null;
function drawReport(){
  document.querySelectorAll('#rpRange button').forEach(b => b.classList.toggle('on', +b.dataset.d === rpDays));
  const A = analyze(rpDays);
  const V = $('rpVerdict'), Fd = $('rpFind'), Lt = $('rpLetter');
  if(!A.enough){
    V.innerHTML = `<div class="verdict ok"><b>資料還不夠</b><span>這段期間只有 ${A.n} 筆有效紀錄，至少需要 8 筆、而且最好涵蓋白天與晚間，才能判斷問題。開啟「持續偵測」累積一兩天後再回來。</span></div>`;
    Fd.innerHTML = ''; Lt.innerHTML = '<p style="margin:0;color:#8A8D93;text-align:center">累積足夠紀錄後，這裡會自動產生申訴信。</p>'; curLetter = null; return;
  }
  const hi = A.issues.filter(f => f.sev === 'hi').length;
  V.innerHTML = A.issues.length
    ? `<div class="verdict"><b>發現 ${A.issues.length} 項問題${hi ? `，其中 ${hi} 項嚴重` : ''}</b><span>${rocShort(A.start)} – ${rocShort(A.end)} · ${A.n} 筆有效量測 · 平均下載 ${A.avg.toFixed(1)} Mbps（方案的 ${Math.round(A.avg/A.plan*100)}%）${A.sample ? ' · 含範例資料' : ''}</span></div>`
    : `<div class="verdict ok"><b>未發現明顯問題</b><span>${A.n} 筆量測平均下載 ${A.avg.toFixed(1)} Mbps，達方案的 ${Math.round(A.avg/A.plan*100)}%。信件仍可產生，但說服力較弱。</span></div>`;
  const lbl = { hi:'嚴重', md:'注意', lo:'參考' };
  Fd.innerHTML = A.findings.map(f => `<div class="f ${f.sev}"><h4><span class="sev ${f.sev}">${lbl[f.sev]}</span>${esc(f.title)}</h4><div class="n">${esc(f.num)}<small>${esc(f.unit)}</small></div><p>${esc(f.text)}</p></div>`).join('');
  curLetter = buildLetter(A);
  Lt.innerHTML = letterHTML(curLetter);
}
function openReport(){
  ['to','name','tel','addr','id','days','prev'].forEach(k => { $('lf_'+k).value = lf[k] ?? ''; });
  $('rpFallback').hidden = true;
  $('rp').hidden = false; document.body.style.overflow = 'hidden';
  drawReport();
}
$('rpClose').onclick = () => { $('rp').hidden = true; document.body.style.overflow = ''; };
$('rpRange').onclick = e => { const b = e.target.closest('button'); if(!b) return; rpDays = +b.dataset.d; drawReport(); };
['to','name','tel','addr','id','days','prev'].forEach(k => $('lf_'+k).addEventListener('input', () => {
  lf[k] = k === 'days' ? (+$('lf_days').value || 7) : $('lf_'+k).value.trim();
  try{ localStorage.setItem(LF, JSON.stringify(lf)); }catch(e){}
  drawReport();
}));
$('rpCopy').onclick = async () => {
  if(!curLetter){ toast('資料還不夠，暫時無法產生信件'); return; }
  const txt = letterTXT(curLetter);
  try{ await navigator.clipboard.writeText(txt); toast('已複製全文，可貼到 Email 或 LINE'); }
  catch(e){ const f = $('rpFallback'); f.value = txt; f.hidden = false; f.focus(); f.select(); toast('請長按下方文字全選後複製'); }
};
$('rpTxt').onclick = () => {
  if(!curLetter){ toast('資料還不夠，暫時無法產生信件'); return; }
  try{ const url = URL.createObjectURL(new Blob(['﻿' + letterTXT(curLetter)], {type:'text/plain'})); const a = document.createElement('a'); a.href = url; a.download = `網路服務意見反映函_${new Date().toISOString().slice(0,10)}.txt`; document.body.appendChild(a); a.click(); a.remove(); setTimeout(() => URL.revokeObjectURL(url), 2000); }catch(e){ toast('下載失敗，請改用複製全文'); }
};
$('rpCsv').onclick = () => $('btnCsv').click();

/* 啟動 */
load();
if(settings.skinV !== 2){ settings.skin = 5; settings.skinV = 2; saveSet(); }   // 改版後預設切到瑞士網格
if(![1,2,3,4,5].includes(settings.skin)) settings.skin = 5;
render();
refreshMeta().then(m => { if(!testing) render(); });
if(settings.running) start();
setInterval(() => { if(!testing) render(); }, 60000);   // 每分鐘刷新時間軸與錶盤時刻
</script>
