<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#2a2f36">
<title>停車快繳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
/* 單欄手機 App：目前停車票卡 → 即時空位看板 → 常用停車場（繳費）。柏油灰＋號誌黃 */
:root{
  --bg:#eef0f2; --surface:#ffffff; --ink:#1b1f24; --muted:#5f6772; --line:#d6dae0;
  --signal:#f2b705; --signal-ink:#1b1f24; --asphalt:#2a2f36; --asphalt-ink:#f4f5f7;
  --danger:#c2410c; --ok:#1f7a4d; --warn:#b45309;
  --f-body:"Noto Sans TC","PingFang TC","Heiti TC",system-ui,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SF Mono",Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --bg:#121417; --surface:#1c2025; --ink:#eceef1; --muted:#9aa3ae; --line:#2e343c;
  --signal:#f5c518; --signal-ink:#16181b; --asphalt:#0b0d10; --asphalt-ink:#eceef1;
  --danger:#fb923c; --ok:#4ade80; --warn:#fbbf24; color-scheme:dark}}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%;touch-action:manipulation}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55;overflow-x:clip;
  padding:max(12px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) calc(40px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left))}
.wrap{max-width:560px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
header{display:flex;align-items:center;gap:12px}
.mark{width:42px;height:42px;border-radius:9px;background:var(--signal);color:var(--signal-ink);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:24px;flex:none}
header h1{margin:0;font-weight:900;font-size:22px;letter-spacing:.02em;flex:1}
header p{margin:0;color:var(--muted);font-size:12.5px}
.gear{margin-left:auto;display:flex;align-items:center;gap:7px;border:1.5px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:12.5px;color:var(--muted);min-height:40px;min-width:40px;justify-content:center}
.gear.ok{padding:6px 10px}.gear.ok #tdxLabel{display:none}
.sec{display:flex;flex-direction:column;gap:10px}
.iconbtn{width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-size:16px;display:grid;place-items:center}
.chip.lnk{color:var(--ink);font-weight:700;background:var(--surface)}
.parkbar{display:flex;align-items:center;justify-content:space-between;gap:10px;width:100%;background:var(--asphalt);color:var(--asphalt-ink);border:0;border-radius:12px;padding:0 14px;min-height:50px;font-size:15px;font-weight:700;position:relative;overflow:hidden}
.parkbar::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:repeating-linear-gradient(180deg,var(--signal) 0 10px,transparent 10px 16px)}
.parkbar span{color:var(--signal)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--muted);flex:none}
.dot.on{background:var(--ok)}.dot.err{background:var(--danger)}
h2{margin:0;font-size:13px;color:var(--muted);font-weight:700}
button,input,select,textarea{font:inherit;color:inherit}
input,select,textarea{font-size:16px}
button{cursor:pointer;touch-action:manipulation}
:focus-visible{outline:3px solid var(--signal);outline-offset:2px}

.ticket{background:var(--asphalt);color:var(--asphalt-ink);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden}
.ticket::before{content:"";position:absolute;inset:0 0 auto 0;height:6px;background:repeating-linear-gradient(90deg,var(--signal) 0 22px,transparent 22px 34px)}
.ticket .row{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap}
.ticket .lot{font-weight:700;font-size:18px}
.ticket .spot{font-family:var(--f-mono);background:var(--signal);color:var(--signal-ink);padding:1px 8px;border-radius:5px;font-size:13px;font-weight:700}
.elapsed{font-family:var(--f-mono);font-size:40px;font-weight:700;line-height:1.05;font-variant-numeric:tabular-nums}
.ticket .since{font-size:12.5px;opacity:.72}
.ticket .actions{display:flex;gap:8px;flex-wrap:wrap}
.ticket.idle .elapsed{font-size:22px;font-family:var(--f-body)}
.btn{border:0;border-radius:10px;padding:10px 14px;font-weight:700;display:inline-flex;align-items:center;justify-content:center;gap:6px;text-decoration:none;min-height:44px}
.btn-pay{background:var(--signal);color:var(--signal-ink);flex:1 1 140px;font-size:16px}
.btn-ghost{background:transparent;border:1.5px solid currentColor;color:inherit;opacity:.85}
.btn-plain{background:var(--surface);border:1.5px solid var(--line);color:var(--ink)}
.btn-danger{background:var(--danger);color:#fff}
.btn[aria-disabled="true"]{opacity:.45;pointer-events:none}
.wide{width:100%}

.plate-row{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:8px 10px}
.plate-row label{font-size:12px;color:var(--muted);flex:none}
.plate{flex:1;border:2px solid var(--ink);border-radius:6px;padding:2px 8px;font-family:var(--f-mono);font-weight:700;font-size:18px;letter-spacing:.12em;text-transform:uppercase;text-align:center;background:var(--surface)}

.list-head{display:flex;align-items:center;gap:10px}
.list-head .right{margin-left:auto;display:flex;gap:6px;align-items:center}
.list-head .btn{padding:8px 12px;min-height:40px}
.upd{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums}
.list{display:flex;flex-direction:column;gap:10px}

/* 即時空位看板 */
.board{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (max-width:360px){.board{grid-template-columns:1fr}}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;flex-direction:column;gap:6px;position:relative}
.tile .tn{font-weight:700;font-size:14.5px;line-height:1.35;overflow-wrap:anywhere;padding-right:4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.7em}
.big{display:flex;align-items:baseline;gap:6px}
.big b{font-family:var(--f-mono);font-size:34px;line-height:1;font-variant-numeric:tabular-nums}
.big span{font-size:12px;color:var(--muted)}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:currentColor}
.st{font-size:12px;font-weight:700;display:flex;align-items:center;gap:5px}
.st::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.lv-ok{color:var(--ok)}.lv-low{color:var(--warn)}.lv-full{color:var(--danger)}.lv-unk{color:var(--muted)}
.tile .sub{font-size:12px;color:var(--muted);display:flex;gap:8px;flex-wrap:wrap}
.tile .ta{display:flex;gap:6px;margin-top:2px}
.tile .ta a,.tile .ta button{flex:1;font-size:12.5px;min-height:36px;border-radius:8px;border:1px solid var(--line);background:transparent;color:var(--ink);display:grid;place-items:center;text-decoration:none;padding:0 6px}
.setup{background:var(--asphalt);color:var(--asphalt-ink);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.setup ol{margin:0;padding-left:20px;opacity:.85}
.setup a{color:var(--signal)}

.lotcard{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px;align-items:center}
.lotcard .name{font-weight:700;font-size:16.5px;overflow-wrap:anywhere}
.lotcard .meta{grid-column:1;color:var(--muted);font-size:12.5px;overflow-wrap:anywhere}
.lotcard .host{font-family:var(--f-mono);font-size:11.5px}
.lotcard .pay{grid-column:2;grid-row:1 / span 2;background:var(--signal);color:var(--signal-ink);min-width:84px}
.lotcard .tools{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;padding-top:8px;border-top:1px dashed var(--line)}
.lb{display:inline-flex;align-items:center;gap:4px;font-weight:700;font-size:12px;border:1px solid currentColor;border-radius:999px;padding:0 8px;margin-right:4px;font-variant-numeric:tabular-nums}
.chip{border:1px solid var(--line);background:transparent;border-radius:999px;padding:5px 11px;font-size:12.5px;color:var(--muted);min-height:34px}
.chip.on{border-color:var(--ink);color:var(--ink);font-weight:700}
.chip.del{align-self:flex-start}
.example{opacity:.75;border-style:dashed}
.tag{display:inline-block;font-size:11px;font-weight:700;border:1px solid var(--muted);color:var(--muted);border-radius:4px;padding:0 5px;margin-left:6px;vertical-align:2px}
.empty{color:var(--muted);font-size:13.5px;text-align:center;padding:6px 0;margin:0}

.sheet{position:fixed;inset:0;background:rgba(10,12,15,.55);display:flex;align-items:flex-end;justify-content:center;z-index:20;overscroll-behavior:contain}
#searchSheet{z-index:25}
.panel{background:var(--surface);width:100%;max-width:560px;border-radius:16px 16px 0 0;
  padding:18px max(16px,env(safe-area-inset-right)) calc(18px + env(safe-area-inset-bottom)) max(16px,env(safe-area-inset-left));
  display:flex;flex-direction:column;gap:12px;max-height:92vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.panel.tall{height:92vh}
.panel h3{margin:0;font-size:18px}
.phead{display:flex;align-items:center;gap:8px}
.phead .x{margin-left:auto;min-height:40px}
.field{display:flex;flex-direction:column;gap:4px}
.field>span{font-size:12.5px;color:var(--muted);font-weight:500}
.field input,.field select{border:1.5px solid var(--line);border-radius:9px;padding:10px 11px;background:var(--bg);width:100%}
.field input:focus,.field select:focus{border-color:var(--ink);outline:none}
.linkrow{display:flex;align-items:center;gap:8px;border:1.5px dashed var(--line);border-radius:9px;padding:8px 10px;font-size:13.5px}
.linkrow b{flex:1;font-weight:500;overflow-wrap:anywhere}
.hint{font-size:12px;color:var(--muted);margin:0}
.err{font-size:12.5px;color:var(--danger);margin:0}
.panel .actions{display:flex;gap:8px}
.panel .actions .btn{flex:1}
.confirm{border:1px solid var(--danger);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:8px}
.srow{display:flex;gap:8px}
.srow select{flex:0 0 120px}
.srow input{flex:1}
.filters{display:flex;gap:6px;flex-wrap:wrap}
.res{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:6px 12px;align-items:center}
.rname{font-weight:700;font-size:15px;overflow-wrap:anywhere}
.raddr{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
.rnum{text-align:right;grid-row:1 / span 2;grid-column:2}
.rnum b{font-family:var(--f-mono);font-size:24px;line-height:1;display:block;font-variant-numeric:tabular-nums}
.rnum small{font-size:11px;font-weight:700}
.ract{grid-column:1 / -1;display:flex;gap:6px;flex-wrap:wrap}
.ract a{text-decoration:none;display:inline-flex;align-items:center}
.nsearch{display:flex;gap:8px}
.nsearch input{flex:1;border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;background:var(--surface);font-size:16px}
.nsearch input:focus{border-color:var(--ink);outline:none}
.nsearch .btn{flex:0 0 auto;font-size:15px}
.chip.rec{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dest{background:var(--asphalt);color:var(--asphalt-ink);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.dest .dl{font-size:12px;opacity:.7}
.dest b{font-size:15px;line-height:1.4;overflow-wrap:anywhere}
.dest .sum{font-size:13px}
.dest .sum strong{font-family:var(--f-mono);font-size:18px;color:var(--signal)}
.dest .da{display:flex;gap:6px;flex-wrap:wrap}
.dest .da a,.dest .da button{border:1px solid rgba(255,255,255,.3);background:transparent;color:inherit;border-radius:999px;padding:4px 11px;font-size:12.5px;min-height:34px;text-decoration:none;display:inline-flex;align-items:center}
.dest .da .on{border-color:var(--signal);color:var(--signal)}
.dest .dad{font-size:12.5px;opacity:.75;margin-top:-4px;overflow-wrap:anywhere}
.cands{border:1px solid var(--line);border-radius:12px;background:var(--surface);padding:0 12px}
.cands summary{font-size:13px;font-weight:700;padding:11px 0;cursor:pointer;color:var(--ink)}
.cand{display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:100%;text-align:left;background:transparent;border:0;border-top:1px dashed var(--line);padding:10px 0;min-height:48px}
.cand b{font-size:14.5px}.cand span{font-size:12px;color:var(--muted);overflow-wrap:anywhere}
/* 搜尋：一個欄位、兩顆按鈕 */
.nform{display:flex;flex-direction:column;gap:8px}
.nform input{width:100%;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;background:var(--surface);font-size:16px}
.nform input:focus{border-color:var(--signal);outline:none}
.nbtns{display:flex;gap:8px}
.nbtns .btn{flex:1 1 0;min-height:48px;font-size:15.5px;border-radius:12px}
.gbtn{gap:7px}
.gbtn span{white-space:nowrap}
.gbtn.gwait{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 16%,var(--surface))}
.gre{flex:0 0 48px!important;padding:0}
.miss{background:var(--surface);border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;font-size:13.5px;display:flex;flex-direction:column;gap:2px}
.miss b{font-size:15px}.miss span{color:var(--muted)}
@media (prefers-reduced-motion:no-preference){
  .glow{animation:ring 1.5s ease-out infinite}
}
/* Google 地圖接力卡 */
.relay{background:var(--surface);border:1.5px solid var(--signal);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:12px}
.rhead{display:flex;align-items:flex-start;gap:10px}
.rpin{width:38px;height:38px;border-radius:10px;background:var(--signal);color:var(--signal-ink);display:grid;place-items:center;flex:none}
.rt{flex:1;display:flex;flex-direction:column;gap:2px}
.rt b{font-size:16px;line-height:1.35;overflow-wrap:anywhere}
.rt small{font-size:12.5px;color:var(--muted)}
.rx{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--muted);font-size:20px;line-height:1;display:grid;place-items:center}
.steps{list-style:none;margin:0;padding:0;display:flex;align-items:center}
.steps li{display:flex;align-items:center;gap:7px;font-size:13px;color:var(--muted);white-space:nowrap}
.steps li:first-child{flex:1}
.steps li:first-child::after{content:"";flex:1;height:2px;border-radius:1px;background:var(--line);margin:0 10px;min-width:14px}
.steps li.done::after{background:var(--ok)}
.steps i{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-weight:700;font-size:12.5px;border:1.5px solid var(--line);background:var(--surface);flex:none;font-family:var(--f-mono)}
.steps li.now{color:var(--ink);font-weight:700}
.steps li.now i{background:var(--signal);border-color:var(--signal);color:var(--signal-ink)}
.steps li.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.rbig{flex:none;min-height:54px;font-size:16.5px;border-radius:12px;gap:8px}
.rtip{margin:0;font-size:13px;color:var(--muted);text-align:center}
.rtip b{color:var(--ink)}
.rlink{align-self:center;background:transparent;border:0;color:var(--ink);font-size:13px;font-weight:700;text-decoration:underline;text-underline-offset:3px;min-height:40px;padding:0 6px;display:inline-flex;align-items:center}
.rnote{background:color-mix(in srgb,var(--warn) 12%,var(--surface));border:1px solid color-mix(in srgb,var(--warn) 45%,transparent);color:var(--ink);border-radius:10px;padding:9px 11px;font-size:13px;line-height:1.5}
.rback{margin:0;text-align:center;font-weight:700;font-size:14px;color:var(--ok)}
.ill{display:grid;grid-template-columns:minmax(0,1fr) 22px minmax(0,1fr);align-items:center;gap:6px;background:var(--bg);border-radius:12px;padding:12px}
.illar{color:var(--muted);display:grid;place-items:center}
.ph{aspect-ratio:10/11;max-height:150px;border:1.5px solid var(--line);border-radius:14px;background:var(--surface);overflow:hidden;display:flex;flex-direction:column}
.phmap{flex:1;position:relative;background:
  linear-gradient(90deg,transparent 46%,var(--line) 46% 50%,transparent 50%) 0 0/100% 100%,
  linear-gradient(0deg,transparent 58%,var(--line) 58% 62%,transparent 62%) 0 0/100% 100%,
  linear-gradient(135deg,color-mix(in srgb,var(--ok) 14%,var(--surface)),var(--surface))}
.phpin{position:absolute;left:50%;top:50%;transform:translate(-50%,-70%);color:var(--danger)}
.ph.dim .phmap{background:color-mix(in srgb,var(--ink) 18%,var(--surface))}
.phsheet{padding:7px 7px 8px;border-top:1px solid var(--line);background:var(--surface)}
.phsheet b{display:block;font-size:11px;line-height:1.2;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.phsheet em{display:block;height:5px;width:62%;background:var(--line);border-radius:3px;margin:4px 0 6px}
.phacts{display:flex;gap:3px}
.phacts span{flex:1;font-size:10px;text-align:center;border:1px solid var(--line);border-radius:999px;padding:2px 0;color:var(--muted);white-space:nowrap}
.phacts .hl{border-color:var(--signal);background:color-mix(in srgb,var(--signal) 26%,var(--surface));color:var(--ink);font-weight:700;position:relative}
.tap{position:absolute;right:-3px;bottom:-7px;width:13px;height:13px;border-radius:50%;background:var(--ink);opacity:.3}
.srcb{display:inline-block;margin-left:8px;font-size:11px;font-weight:700;color:var(--signal-ink);background:var(--signal);border-radius:4px;padding:0 6px;opacity:1;vertical-align:1px}
.gmcand{flex-direction:row!important;align-items:center!important;gap:8px!important;text-decoration:none;color:inherit}
.gmcand span{color:var(--ink)!important;font-weight:500;text-decoration:underline;text-underline-offset:3px}
@media (prefers-reduced-motion:no-preference){
  .tap{animation:tap 1.6s ease-out infinite}
  @keyframes tap{0%{transform:scale(.6);opacity:.45}70%{transform:scale(1.6);opacity:0}100%{opacity:0}}
  .relay.back .rpaste{animation:ring 1.5s ease-out infinite}
  @keyframes ring{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--signal) 75%,transparent)}100%{box-shadow:0 0 0 16px transparent}}
}
.dkm{font-family:var(--f-mono);font-weight:700;color:var(--ink)}
.ov{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;align-items:center;gap:10px;background:transparent;width:100%;text-align:left;min-height:52px}
.ov b{flex:1;font-size:15px}
.ov span{font-size:12px;color:var(--muted);text-align:right}
.ov strong{font-family:var(--f-mono);font-size:18px;display:block;color:var(--ok)}
.loading{color:var(--muted);text-align:center;padding:20px 0;font-size:13.5px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13.5px;z-index:40;font-weight:500;max-width:90vw;text-align:center}
.tips{font-size:12.5px;color:var(--muted);background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px}
.tips b{color:var(--ink)}
.tips ol{margin:6px 0 0;padding-left:20px}
[hidden]{display:none!important}
@keyframes spin{to{transform:rotate(360deg)}}
.spin{display:inline-block;animation:spin .8s linear infinite}
@media (prefers-reduced-motion:no-preference){.panel{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="mark" aria-hidden="true">P</div>
    <h1>停車快繳</h1>

<script>
{
  const KEY = "parking-pay-v1", CRED = "parking-pay-tdx-cred", TOK = "parking-pay-tdx-token", CP = "parking-pay-cp-";
  const AUTH = "https://tdx.transportdata.tw/auth/realms/TDXConnect/protocol/openid-connect/token";
  const BASE = "https://tdx.transportdata.tw/api/basic";
  const CITIES = [["Taipei","臺北市"],["NewTaipei","新北市"],["Taoyuan","桃園市"],["Taichung","臺中市"],["Tainan","臺南市"],["Kaohsiung","高雄市"],
    ["Keelung","基隆市"],["Hsinchu","新竹市"],["HsinchuCounty","新竹縣"],["MiaoliCounty","苗栗縣"],["ChanghuaCounty","彰化縣"],["NantouCounty","南投縣"],
    ["YunlinCounty","雲林縣"],["Chiayi","嘉義市"],["ChiayiCounty","嘉義縣"],["PingtungCounty","屏東縣"],["YilanCounty","宜蘭縣"],["HualienCounty","花蓮縣"],
    ["TaitungCounty","臺東縣"],["PenghuCounty","澎湖縣"],["KinmenCounty","金門縣"],["LienchiangCounty","連江縣"]];
  const cityName = c => (CITIES.find(x => x[0] === c) || [c, c])[1];

  let state = { lots: [], plate: "", session: null, updated: 0, watch: [], city: "Taipei", recent: [], nRadius: 500 };
  const ADV = "https://tdx.transportdata.tw/api/advanced";
  // 各縣市概略中心點（判斷目的地附近要載入哪些縣市）
  const CENT = { Taipei:[25.05,121.55], NewTaipei:[25.01,121.46], Keelung:[25.13,121.74], Taoyuan:[24.99,121.30], Hsinchu:[24.80,120.97],
    HsinchuCounty:[24.83,121.01], MiaoliCounty:[24.56,120.82], Taichung:[24.15,120.67], ChanghuaCounty:[24.08,120.54], NantouCounty:[23.91,120.68],
    YunlinCounty:[23.71,120.43], Chiayi:[23.48,120.45], ChiayiCounty:[23.46,120.29], Tainan:[22.99,120.21], Kaohsiung:[22.63,120.30],
    PingtungCounty:[22.67,120.49], YilanCounty:[24.75,121.75], HualienCounty:[23.98,121.60], TaitungCounty:[22.76,121.14],
    PenghuCounty:[23.57,119.58], KinmenCounty:[24.43,118.32], LienchiangCounty:[26.16,119.95] };
  let editingId = null, formLink = null, nDest = null, nCands = [], nOnly = false, nBusy = "", nErr = "";
  const live = {};          // city → { at, map: { id: info } }
  const carParks = {};      // city → [{id,name,addr,lat,lon}]
  let liveErr = "", loadingLive = false;
  const $ = s => document.querySelector(s);
  const rj = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
  const wj = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

  function loadLocal(){ const d = rj(KEY); if (d && Array.isArray(d.lots)) state = Object.assign(state, d); if (!Array.isArray(state.watch)) state.watch = []; if (!Array.isArray(state.recent)) state.recent = []; if (!state.nRadius) state.nRadius = 500; if (!CENT[state.city]) state.city = "Taipei"; state.watch = state.watch.filter(w => !String(w.id).startsWith("DEMO-")); try { localStorage.removeItem("parking-pay-demo"); } catch (e) {} }
  function persist(){ state.updated = Date.now(); wj(KEY, state); }
  function toast(t){ const el = $("#toast"); el.textContent = t; el.hidden = false; clearTimeout(toast._t); toast._t = setTimeout(() => el.hidden = true, 2000); }
  const uid = () => Math.random().toString(36).slice(2, 9);
  function host(u){ try { return new URL(u).hostname.replace(/^www\./, ""); } catch (e) { return ""; } }
  function esc(s){ return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
  const safeUrl = u => /^https?:\/\//i.test(u || "") ? u : "";
  // 內建 TDX 金鑰（設定頁改過會以設定頁為準）
  const BUILTIN = { id: "gogoahoo-8f2c3ad7-07ef-4601", secret: "fa2278a9-f192-4a62-9112-e2e749713f59" };
  const cred = () => { const c = rj(CRED) || {}; return (c.id && c.secret) ? c : Object.assign({}, BUILTIN, { gkey: c.gkey || "" }); };
  const hasKey = () => { const c = cred(); return !!(c.id && c.secret); };

  /* ---------- TDX ---------- */
  // 帶逾時的 fetch：網路卡住時不會無限轉圈
  async function tfetch(url, opt = {}, ms = 15000){
    const ac = new AbortController(); const tm = setTimeout(() => ac.abort(), ms);
    try { return await fetch(url, Object.assign({}, opt, { signal: ac.signal })); }
    catch (e) { throw new Error(e.name === "AbortError" ? "TIMEOUT" : "NET"); }
    finally { clearTimeout(tm); }
  }
  let tokP = null;   // 同時多個請求時只申請一次權杖
  function getToken(){
    const c = cred(); if (!c.id || !c.secret) return Promise.reject(new Error("NOKEY"));
    const tk = rj(TOK); if (tk && tk.t && tk.cid === c.id && tk.exp > Date.now() + 60000) return Promise.resolve(tk.t);
    if (tokP) return tokP;
    tokP = (async () => {
      const r = await tfetch(AUTH, { method: "POST", headers: { "content-type": "application/x-www-form-urlencoded" },
        body: new URLSearchParams({ grant_type: "client_credentials", client_id: c.id, client_secret: c.secret }) });
      if (!r.ok) throw new Error(r.status === 400 || r.status === 401 ? "BADKEY" : r.status === 429 ? "RATE" : "HTTP" + r.status);
      const j = await r.json(); if (!j.access_token) throw new Error("BADKEY");
      wj(TOK, { t: j.access_token, exp: Date.now() + (j.expires_in || 3600) * 1000, cid: c.id });
      return j.access_token;
    })().finally(() => { tokP = null; });
    return tokP;
  }
  async function api(path, retry = true){
    const t = await getToken();
    const r = await tfetch((/^https?:/.test(path) ? "" : BASE) + path, { headers: { authorization: "Bearer " + t } });
    if (r.status === 401 && retry) { localStorage.removeItem(TOK); return api(path, false); }
    if (r.status === 429) throw new Error("RATE");
    if (!r.ok) throw new Error("HTTP" + r.status);
    try { return await r.json(); } catch (e) { throw new Error("BADJSON"); }
  }
  function errText(e){
    const m = String(e && e.message || e);
    const map = { NOKEY: "尚未設定 TDX 金鑰", BADKEY: "TDX 金鑰錯誤，或帳號尚未通過審核", NET: (/^https?:$/.test(location.protocol) ? "連不上 TDX，請檢查網路" : "連不上 TDX：目前是在預覽畫面打開，預覽不能連網，請改用 Safari 開啟"), TIMEOUT: "TDX 回應逾時，稍後再試",
      RATE: "查詢太頻繁，稍等一下再試", BADJSON: "TDX 回傳的資料格式異常", HTTP403: "TDX 拒絕存取（金鑰權限或使用額度問題）", HTTP404: "這個縣市沒有提供停車資料" };
    if (map[m]) return map[m];
    if (/^HTTP5/.test(m)) return "TDX 伺服器暫時異常（" + m.slice(4) + "），稍後再試";
    return m.startsWith("HTTP") ? "TDX 回應錯誤（" + m.slice(4) + "）" : "讀取失敗";
  }
  const zh = v => (v && typeof v === "object") ? (v.Zh_tw || v.En || "") : (v || "");

  function parseAvail(p){
    const out = { name: zh(p.CarParkName), car: null, moto: null, time: p.DataCollectTime || p.SrcUpdateTime || "" };
    (p.Availabilities || []).forEach(a => {
      const v = { a: +a.AvailableSpaces, t: +a.NumberOfSpaces };
      if (a.SpaceType === 1 && !out.car) out.car = v;          // 1：汽車
      else if (a.SpaceType === 2 && !out.moto) out.moto = v;   // 2：機車
    });
    if (!out.car && p.AvailableSpaces != null) out.car = { a: +p.AvailableSpaces, t: +p.TotalSpaces };
    if (out.car && !(out.car.a >= 0)) out.car = null;
    if (out.moto && !(out.moto.a >= 0)) out.moto = null;
    out.full = p.FullStatus === 1;
    return out;
  }
  async function refreshCity(city){
    const j = await api(`/v1/Parking/OffStreet/ParkingAvailability/City/${city}?$top=10000&$format=JSON`);
    const arr = Array.isArray(j) ? j : (j.ParkingAvailabilities || []);
    const map = {}; arr.forEach(p => { if (p.CarParkID) map[p.CarParkID] = parseAvail(p); });
    live[city] = { at: Date.now(), map };
  }
  async function loadCarParks(city){
    if (carParks[city]) return carParks[city];
    const c = rj(CP + city);
    if (c && Date.now() - c.at < 864e5) { carParks[city] = c.list.map(r => ({ id: r[0], name: r[1], addr: r[2], lat: r[3], lon: r[4] })); return carParks[city]; }
    const j = await api(`/v1/Parking/OffStreet/CarPark/City/${city}?$top=10000&$format=JSON`);
    const arr = Array.isArray(j) ? j : (j.CarParks || []);
    const list = arr.map(p => ({ id: p.CarParkID, name: zh(p.CarParkName), addr: zh(p.Address),
      lat: p.CarParkPosition ? +p.CarParkPosition.PositionLat : null, lon: p.CarParkPosition ? +p.CarParkPosition.PositionLon : null })).filter(p => p.id);
    carParks[city] = list;
    wj(CP + city, { at: Date.now(), list: list.map(p => [p.id, p.name, p.addr, p.lat, p.lon]) });
    return list;
  }
  function trackedCities(){
    const s = new Set(state.watch.map(w => w.city));
    state.lots.forEach(l => l.tdx && s.add(l.tdx.city));
    if (nDest) nDest.cities.forEach(c => s.add(c));
    return [...s];
  }
  async function refreshAll(force){
    if (!hasKey()) { renderLive(); return; }
    const cities = trackedCities();
    if (!cities.length || loadingLive) { renderLive(); return; }
    if (!force && cities.every(c => live[c] && Date.now() - live[c].at < 30000)) return;
    loadingLive = true; renderLive();
    const res = await Promise.allSettled(cities.map(refreshCity));
    const bad = res.find(r => r.status === "rejected");
    liveErr = bad ? errText(bad.reason) : "";
    loadingLive = false; setDot(bad ? "err" : "on"); render();
  }

  /* ---------- 呈現 ---------- */
  function level(v, full){
    if (!v) return ["lv-unk", "無即時資料"];
    if (full || v.a === 0) return ["lv-full", "已滿"];
    if (v.a <= 5 || (v.t > 0 && v.a / v.t < 0.1)) return ["lv-low", "快滿"];
    return ["lv-ok", "有空位"];
  }
  function ago(ts){
    const d = new Date(ts); if (isNaN(d)) return "";
    const m = Math.round((Date.now() - d) / 60000);
    return m < 1 ? "剛剛" : m < 60 ? m + " 分鐘前" : Math.floor(m / 60) + " 小時前";
  }
  const info = (city, id) => live[city] && live[city].map[id];
  function mapUrl(name, lat, lon){ return `https://maps.apple.com/?q=${encodeURIComponent(name)}${lat && lon ? `&ll=${lat},${lon}` : ""}`; }

  function setDot(s){
    const d = $("#tdxDot"); d.className = "dot" + (s === "on" ? " on" : s === "err" ? " err" : "");
    $("#gearBtn").classList.toggle("ok", s === "on" && hasKey());
    $("#tdxLabel").textContent = !hasKey() ? "TDX 設定" : s === "on" ? "TDX 已連線" : s === "err" ? "TDX 異常" : "TDX 連線中";
  }

  function renderLive(){
    const box = $("#liveBox");
    const newest = Math.max(0, ...Object.values(live).map(x => x.at));
    $("#liveUpd").innerHTML = loadingLive ? '<span class="spin">↻</span> 更新中' : (newest ? "更新 " + ago(newest) : "");
    if (!hasKey()) {
      box.innerHTML = `<div class="setup"><b>接上 TDX，看即時剩餘車位</b>
        <ol><li>到 TDX 運輸資料流通服務平臺註冊會員（免費）</li><li>會員中心 → 取得 API 金鑰（Client ID / Secret）</li><li>按下方按鈕貼上，就能查全台停車場空位</li></ol>
        <button class="btn btn-pay" type="button" data-open-set>設定 TDX 金鑰</button></div>`;
      $("#findBtn").hidden = true; $("#refreshBtn").hidden = true; return;
    }
    $("#findBtn").hidden = false; $("#refreshBtn").hidden = !state.watch.length;
    let html = liveErr ? `<p class="err">${esc(liveErr)}</p>` : "";
    if (!state.watch.length) {

    } else {
      html += `<div class="board">` + state.watch.map(w => {
        const d = info(w.city, w.id); const v = d && d.car; const [cls, lab] = level(v, d && d.full);
        const pct = v && v.t > 0 ? Math.min(100, Math.round(v.a / v.t * 100)) : 0;
        return `<div class="tile">
          <div class="tn">${esc(w.name)}</div>
          <div class="big"><b class="${cls}">${v ? v.a : "—"}</b><span>${v && v.t ? "/ " + v.t + " 汽車" : "汽車空位"}</span></div>
          <div class="bar ${cls}"><i style="width:${pct}%"></i></div>
          <div class="st ${cls}">${d ? lab : (loadingLive ? "讀取中" : "無即時資料")}</div>
          <div class="sub">${d && d.moto ? `<span>機車 ${d.moto.a}${d.moto.t ? "/" + d.moto.t : ""}</span>` : ""}${d && d.time ? `<span>${ago(d.time)}</span>` : ""}</div>
          <div class="ta"><a href="${esc(mapUrl(w.name, w.lat, w.lon))}" target="_blank" rel="noopener">導航</a><button type="button" data-unwatch="${esc(w.id)}">移除</button></div>
        </div>`;
      }).join("") + `</div>`;
    }
    box.innerHTML = html;
  }

  function badge(t){

    const R = 6371e3, r = x => x * Math.PI / 180;

    const h = Math.sin(dLat / 2) ** 2 + Math.cos(r(a.lat)) * Math.cos(r(b.lat)) * Math.sin(dLon / 2) ** 2;
    return 2 * R * Math.asin(Math.sqrt(h));
  }

  });

  /* ---------- 開始停車 ---------- */
  const localISO = d => new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 16);
  function openPark(lotId){
    if (!state.lots.length) { openForm(); return; }
    $("#pLot").innerHTML = sortedLots().map(l => `<option value="${l.id}">${esc(l.name)}</option>`).join("");
    if (lotId) $("#pLot").value = lotId;
    $("#pSpot").value = ""; $("#pTime").value = localISO(new Date()); $("#parkSheet").hidden = false;
  }
  $("#pCancel").addEventListener("click", () => $("#parkSheet").hidden = true);
  $("#parkForm").addEventListener("submit", e => {
    e.preventDefault();
    const t = new Date($("#pTime").value); const start = isNaN(t) ? Date.now() : Math.min(t.getTime(), Date.now());
    state.session = { lotId: $("#pLot").value, spot: $("#pSpot").value.trim(), start };
    persist(); $("#parkSheet").hidden = true; render(); window.scrollTo({ top: 0, behavior: "smooth" }); toast("開始計時");
  });

  ["sheet", "parkSheet", "setSheet", "searchSheet"].forEach(id => $("#" + id).addEventListener("click", e => { if (e.target.id === id) { $("#" + id).hidden = true; if (id === "sheet") editingId = null; render(); } }));

  /* ---------- 啟動與自動更新 ---------- */
  loadLocal(); setDot(""); renderRecent(); render();
  getToken().then(() => { setDot("on"); refreshAll(true); }).catch(e => { liveErr = errText(e); setDot("err"); renderLive(); });
  setInterval(() => { if (document.visibilityState === "visible") { if (state.session) renderTicket(); renderLive(); } }, 30000);
  setInterval(() => { if (document.visibilityState === "visible") refreshAll(true); }, 90000);
  document.addEventListener("visibilitychange", () => {
    if (document.visibilityState !== "visible") return;
    if (gWait) { $("#gPasteBtn").classList.add("glow"); toast("按「貼上地址」帶入位置"); }
    render(); refreshAll(false);
  });
}
</script>
</body>
</html>
