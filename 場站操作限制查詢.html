<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>場站操作限制查詢</title>
<style>
:root{
  --ink:#0A1420; --panel:#12202E; --panel2:#182C3E; --raise:#20384C;
  --line:rgba(190,215,235,.14); --line2:rgba(190,215,235,.07);
  --text:#E9F0F6; --muted:#8CA3B8; --dim:#5F7387;
  --gold:#DCC086;
  --ok:#3FC492; --warn:#F0A73E; --no:#F0665C; --na:#7A8DA0;
  --r:14px;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{
  background:
    radial-gradient(1100px 620px at 78% -12%, rgba(220,192,134,.10), transparent 62%),
    radial-gradient(900px 520px at 5% 0%, rgba(63,196,146,.07), transparent 60%),
    var(--ink);
  color:var(--text);
  font-family:"Noto Sans TC","PingFang TC","Microsoft JhengHei",-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
  font-size:15px; line-height:1.62; -webkit-font-smoothing:antialiased;
  min-height:100vh;
}
.wrap{max-width:1180px;margin:0 auto;padding:0 18px 72px}

/* ---------- header ---------- */
header.top{padding:26px 0 14px;display:flex;align-items:flex-end;gap:18px;flex-wrap:wrap}
.mark{display:flex;align-items:center;gap:12px}
.mark .jx{
  width:44px;height:44px;border-radius:11px;display:grid;place-items:center;
  background:linear-gradient(145deg,#26415a,#101d29);
  border:1px solid rgba(220,192,134,.35);
  color:var(--gold);font-weight:700;letter-spacing:.06em;font-size:17px;
}
h1{font-size:22px;line-height:1.25;margin:0;font-weight:700;letter-spacing:.01em}
.sub{color:var(--muted);font-size:12.5px;margin-top:2px}
.stat{margin-left:auto;display:flex;gap:22px}
.stat div{text-align:right}
.stat b{display:block;font-size:21px;font-weight:700;color:var(--gold);line-height:1.2}
.stat span{font-size:11.5px;color:var(--muted)}

/* ---------- tabs ---------- */
nav.tabs{
  display:flex;gap:4px;background:rgba(255,255,255,.045);border:1px solid var(--line2);
  padding:4px;border-radius:12px;margin:14px 0 22px;overflow-x:auto;-webkit-overflow-scrolling:touch;
}
nav.tabs button{
  flex:1 0 auto;min-width:96px;appearance:none;border:0;background:transparent;color:var(--muted);
  font:inherit;font-size:14px;font-weight:600;padding:9px 14px;border-radius:9px;cursor:pointer;
  transition:background .15s,color .15s;white-space:nowrap;
}
nav.tabs button:hover{color:var(--text)}
nav.tabs button[aria-selected="true"]{background:var(--raise);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
nav.tabs button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- controls ---------- */
.controls{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1 1 240px;min-width:200px}
.search input{
  width:100%;background:var(--panel);border:1px solid var(--line);color:var(--text);
  font:inherit;padding:11px 14px 11px 38px;border-radius:11px;
}
.search input::placeholder{color:#66809a}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);opacity:.5}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{
  appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);
  font:inherit;font-size:13px;padding:7px 13px;border-radius:999px;cursor:pointer;transition:.15s;
}
.chip:hover{color:var(--text);border-color:rgba(220,192,134,.4)}
.chip[aria-pressed="true"]{background:var(--gold);color:#15202b;border-color:var(--gold);font-weight:600}
input:focus-visible,button:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--gold);outline-offset:2px}

/* ---------- station grid ---------- */
.regionrow{margin-bottom:14px}
.regionrow h3{
  font-size:12px;font-weight:600;color:var(--muted);margin:0 0 8px;
  display:flex;align-items:center;gap:10px;
}
.regionrow h3::after{content:"";flex:1;height:1px;background:var(--line2)}
.codes{display:grid;grid-template-columns:repeat(auto-fill,minmax(78px,1fr));gap:7px}
.code{
  appearance:none;border:1px solid var(--line);background:var(--panel);color:var(--text);
  font:inherit;font-weight:700;font-size:15px;letter-spacing:.06em;
  padding:11px 4px 9px;border-radius:11px;cursor:pointer;transition:.14s;position:relative;
}
.code:hover{background:var(--panel2);transform:translateY(-1px)}
.code[aria-pressed="true"]{background:var(--gold);color:#15202b;border-color:var(--gold)}
.code .bar{display:flex;gap:2px;justify-content:center;margin-top:6px}
.code .bar i{width:5px;height:3px;border-radius:2px;background:var(--na);opacity:.85}
.code[aria-pressed="true"] .bar i{opacity:1}
.code.empty{opacity:.55}

/* ---------- detail ---------- */
.detail{margin-top:22px}
.stationhead{
  display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap;
  padding:20px 22px;border-radius:var(--r) var(--r) 0 0;
  background:linear-gradient(180deg,var(--panel2),var(--panel));
  border:1px solid var(--line);border-bottom:0;
}
.bigcode{font-size:44px;font-weight:800;letter-spacing:.06em;line-height:1;color:var(--gold)}
.stationhead .meta{color:var(--muted);font-size:13px;padding-bottom:5px}
.actions{margin-left:auto;display:flex;gap:8px;padding-bottom:4px}
.btn{
  appearance:none;border:1px solid var(--line);background:transparent;color:var(--muted);
  font:inherit;font-size:13px;padding:7px 13px;border-radius:9px;cursor:pointer
}
.btn:hover{color:var(--text);border-color:rgba(220,192,134,.45)}

.strip{
  display:grid;grid-template-columns:repeat(9,1fr);gap:1px;background:var(--line2);
  border:1px solid var(--line);border-top:0;overflow:hidden;
}
.slot{
  background:var(--panel);padding:11px 6px 12px;text-align:center;cursor:pointer;transition:.14s;
  border:0;color:inherit;font:inherit;
}
.slot:hover{background:var(--panel2)}
.slot .lb{font-size:10.5px;color:var(--muted);display:block;line-height:1.35;min-height:2.7em}
.slot .dot{
  display:inline-flex;align-items:center;justify-content:center;
  width:26px;height:26px;border-radius:50%;font-size:13px;font-weight:700;margin-top:5px;
}
.slot.on{box-shadow:inset 0 -3px 0 var(--gold)}
.d-ok{background:rgba(63,196,146,.16);color:var(--ok);border:1px solid rgba(63,196,146,.4)}
.d-warn{background:rgba(240,167,62,.16);color:var(--warn);border:1px solid rgba(240,167,62,.42)}
.d-no{background:rgba(240,102,92,.16);color:var(--no);border:1px solid rgba(240,102,92,.42)}
.d-na{background:rgba(122,141,160,.14);color:var(--na);border:1px solid rgba(122,141,160,.32)}

.cards{margin-top:18px;display:grid;gap:11px}
.card{
  background:var(--panel);border:1px solid var(--line);border-radius:var(--r);
  padding:15px 17px;border-left:3px solid var(--na);
}
.card.k-ok{border-left-color:var(--ok)}
.card.k-warn{border-left-color:var(--warn)}
.card.k-no{border-left-color:var(--no)}
.card h4{margin:0;font-size:15px;font-weight:700;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.tag{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:6px}
.t-ok{background:rgba(63,196,146,.15);color:var(--ok)}
.t-warn{background:rgba(240,167,62,.15);color:var(--warn)}
.t-no{background:rgba(240,102,92,.15);color:var(--no)}
.t-na{background:rgba(122,141,160,.14);color:var(--na)}
.timepill{
  font-size:12.5px;font-weight:600;color:var(--gold);background:rgba(220,192,134,.1);
  border:1px solid rgba(220,192,134,.28);padding:3px 10px;border-radius:6px;white-space:pre-line
}
.note{margin:9px 0 0;color:#C6D5E2;font-size:13.6px;white-space:pre-line}
.nonote{margin:7px 0 0;color:var(--muted);font-size:13px}

/* ---------- matrix ---------- */
.tablewrap{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:9px 8px;text-align:center;border-bottom:1px solid var(--line2);white-space:nowrap}
thead th{
  position:sticky;top:0;z-index:3;background:var(--panel2);color:var(--muted);
  font-size:11.5px;font-weight:600;border-bottom:1px solid var(--line)
}
tbody th{
  position:sticky;left:0;z-index:2;background:var(--panel);text-align:left;
  font-weight:700;letter-spacing:.05em;padding-left:14px
}
thead th:first-child{left:0;z-index:4}
tbody tr:hover td{background:rgba(255,255,255,.03)}
td.cell{cursor:pointer}
.mk{display:inline-grid;place-items:center;width:24px;height:24px;border-radius:7px;font-weight:700;font-size:12px}
.m-ok{background:rgba(63,196,146,.17);color:var(--ok)}
.m-warn{background:rgba(240,167,62,.17);color:var(--warn)}
.m-no{background:rgba(240,102,92,.17);color:var(--no)}
.m-na{background:rgba(122,141,160,.12);color:var(--na)}
.legend{display:flex;gap:16px;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin:12px 2px 0}
.legend span{display:flex;align-items:center;gap:7px}
.legend i{width:11px;height:11px;border-radius:3px;display:inline-block}

/* ---------- contacts ---------- */
.contactgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.ccard{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.ccard header{
  display:flex;align-items:baseline;gap:12px;padding:14px 17px;
  background:linear-gradient(180deg,var(--panel2),transparent);border-bottom:1px solid var(--line2)
}
.ccard header b{font-size:22px;letter-spacing:.07em;color:var(--gold)}
.ccard header span{font-size:12.5px;color:var(--muted)}
.side{padding:13px 17px;border-bottom:1px solid var(--line2)}
.side:last-child{border-bottom:0}
.side .role{font-size:11.5px;color:var(--muted);margin-bottom:5px}
.side .unit{font-weight:700;margin-bottom:6px}
.lines{white-space:pre-line;font-size:13.3px;color:#C6D5E2}
.lines a{color:var(--gold);text-decoration:none;border-bottom:1px dotted rgba(220,192,134,.5)}
.lines a:hover{border-bottom-style:solid}
.cnote{padding:12px 17px;background:rgba(240,167,62,.07);font-size:13px;white-space:pre-line;color:#DCC9AC}

/* ---------- calculator ---------- */
.calcnote{color:var(--muted);font-size:13px;margin:0 0 16px}
.leg{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:15px 17px;margin-bottom:11px}
.leg .lhead{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.leg .lhead .n{
  width:24px;height:24px;border-radius:7px;background:var(--raise);color:var(--gold);
  display:grid;place-items:center;font-size:12px;font-weight:700
}
.leg .lhead strong{font-size:14px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(122px,1fr));gap:10px}
.f label{display:block;font-size:11.5px;color:var(--muted);margin-bottom:4px}
.f input{
  width:100%;background:var(--panel2);border:1px solid var(--line);color:var(--text);
  font:inherit;font-size:14px;padding:8px 10px;border-radius:9px
}
.f input::-webkit-calendar-picker-indicator{filter:invert(.7)}
.out{
  margin-top:12px;padding-top:12px;border-top:1px dashed var(--line);
  display:flex;gap:22px;flex-wrap:wrap;align-items:baseline
}
.out div span{display:block;font-size:11.5px;color:var(--muted)}
.out div b{font-size:20px;font-weight:700;color:var(--gold);font-variant-numeric:tabular-nums}
.out div b small{font-size:11px;color:var(--warn);margin-left:3px;font-weight:700}
.rm{margin-left:auto;appearance:none;background:transparent;border:0;color:var(--muted);cursor:pointer;font:inherit;font-size:13px}
.rm:hover{color:var(--no)}
.addleg{
  width:100%;padding:12px;border:1px dashed var(--line);background:transparent;color:var(--muted);
  border-radius:var(--r);font:inherit;font-size:14px;cursor:pointer
}
.addleg:hover{color:var(--gold);border-color:rgba(220,192,134,.45)}

.hint{color:var(--muted);font-size:12.5px;margin-top:26px;padding-top:14px;border-top:1px solid var(--line2)}
.hidden{display:none !important}

@media (max-width:820px){
  .strip{grid-template-columns:repeat(3,1fr)}
  .slot .lb{min-height:auto}
  .bigcode{font-size:36px}
  .stat{margin-left:0;width:100%;justify-content:flex-start;gap:26px}
  .stat div{text-align:left}
}
@media print{
  body{background:#fff;color:#000}
  nav.tabs,.controls,.actions,.addleg,.rm,.codes,.regionrow{display:none !important}
  .card,.stationhead,.strip,.slot{background:#fff !important;color:#000 !important;border-color:#bbb !important}
  .bigcode,.timepill{color:#000 !important}
  .note{color:#222 !important}
}
@media (prefers-reduced-motion:reduce){*{transition:none !important;animation:none !important}}
</style>
</head>
<body>
<div class="wrap">

<header class="top">
  <div class="mark">
    <div class="jx">JX</div>
    <div>
      <h1>場站操作限制查詢</h1>
      <div class="sub">轉降、滯機加油、下客入境的第一線判斷依據</div>
    </div>
  </div>
  <div class="stat">
    <div><b id="statStations">0</b><span>收錄場站</span></div>
    <div><b id="statRegions">0</b><span>營運區域</span></div>
    <div><b id="statPending">0</b><span>資料待補</span></div>
  </div>
</header>

<nav class="tabs" role="tablist">
  <button role="tab" id="t-lookup" aria-selected="true" data-panel="p-lookup">場站限制</button>
  <button role="tab" id="t-matrix" aria-selected="false" data-panel="p-matrix">全站對照</button>
  <button role="tab" id="t-contact" aria-selected="false" data-panel="p-contact">備降聯絡</button>
  <button role="tab" id="t-calc" aria-selected="false" data-panel="p-calc">到離試算</button>
</nav>

<!-- ===== 場站限制 ===== -->
<section id="p-lookup" role="tabpanel" aria-labelledby="t-lookup">
  <div class="controls">
    <div class="search">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>
      <input id="q" type="search" placeholder="輸入場站代碼，例如 NRT、BKK" autocomplete="off">
    </div>
    <div class="chips" id="regionChips"></div>
  </div>
  <div id="stationList"></div>
  <div class="detail" id="detail"></div>
</section>

<!-- ===== 全站對照 ===== -->
<section id="p-matrix" role="tabpanel" aria-labelledby="t-matrix" class="hidden">
  <div class="controls">
    <div class="chips" id="matrixChips"></div>
  </div>
  <div class="tablewrap"><table id="matrix"></table></div>
  <div class="legend">
    <span><i style="background:var(--ok)"></i>可／無限制</span>
    <span><i style="background:var(--warn)"></i>需申請或有條件</span>
    <span><i style="background:var(--no)"></i>不可</span>
    <span><i style="background:var(--na)"></i>不適用或待補</span>
    <span>點任一格看詳細備註</span>
  </div>
  <div class="cards" id="matrixDetail"></div>
</section>

<!-- ===== 備降聯絡 ===== -->
<section id="p-contact" role="tabpanel" aria-labelledby="t-contact" class="hidden">
  <p class="calcnote">台灣區備降站翼上／翼下單位聯絡窗口。號碼與信箱可直接點擊撥出或寄信。</p>
  <div class="contactgrid" id="contacts"></div>
</section>

<!-- ===== 到離試算 ===== -->
<section id="p-calc" role="tabpanel" aria-labelledby="t-calc" class="hidden">
  <p class="calcnote">逐段串接：填入起飛時間、飛時與時差，往下自動推算各段到達與再起飛時間。時差填「本段目的地時間 − 本段出發地時間」，例如 TPE 飛 BKK 填 −1。</p>
  <div id="legs"></div>
  <button class="addleg" id="addLeg">＋ 增加下一段航段</button>
</section>

<p class="hint">資料來源：各站操作限制表（各站資料庫）。內容以場站最新公告為準，作業前請再與當站確認。</p>
</div>

/* 判讀規則：permit 類 V=可、△=需申請、X=不可；presence 類 V=有規定要注意、X=無 */
function read(key, st){
  const pol = (ITEMS.find(i=>i.key===key)||{}).polarity;
  if(!st) return {k:"na", mark:"–", text:"資料待補"};
  if(st==="N/A") return {k:"na", mark:"—", text:"不適用"};
  if(pol==="presence"){
    if(st==="V") return {k:"warn", mark:"!", text:key==="curfew"?"有宵禁":"有規定"};
    if(st==="X") return {k:"ok", mark:"○", text:key==="curfew"?"無宵禁":"無特別限制"};
    return {k:"warn", mark:"!", text:st};
  }
  if(st==="V") return {k:"ok", mark:"✓", text:"可"};
  if(st==="△") return {k:"warn", mark:"△", text:"需申請／有條件"};
  if(st==="X") return {k:"no", mark:"✕", text:"不可"};
  return {k:"na", mark:"?", text:st};
}

function renderList(){

  groups.forEach(r=>{

    const box=document.createElement("div"); box.className="regionrow";
    const h=document.createElement("h3"); h.textContent=r; box.appendChild(h);
    const grid=document.createElement("div"); grid.className="codes";

      b.className="code"+(s.filled?"":" empty");
      b.setAttribute("aria-pressed", current && current.code===s.code);
      const bar = ITEMS.map(i=>{
        const c = read(i.key, s.items[i.key].status).k;
        return `<i style="background:var(--${c==='ok'?'ok':c==='warn'?'warn':c==='no'?'no':'na'})"></i>`;
      }).join("");
      b.innerHTML = s.code + `<span class="bar">${bar}</span>`;
      b.onclick = ()=>{ current = s; renderList(); renderDetail(); };
      grid.appendChild(b);
    });
    box.appendChild(grid); host.appendChild(box);
  });
  if(!shown) host.innerHTML = `<p class="calcnote">找不到「${query}」。換個代碼或清除搜尋條件試試。</p>`;
}

function linkify(text){
  let out = esc(text);
  out = out.replace(/([\w.+-]+@[\w.-]+\.\w+)/g, '<a href="mailto:$1">$1</a>');
  out = out.replace(/(?<![\w@.-])(\d{2,4}-\d{3,4}-?\d{3,4}(?:#\d+)?|\d{4}-\d{4}|\d{9,10})(?![\w@.-])/g,
    m=>`<a href="tel:${m.replace(/[^\d#]/g,"")}">${m}</a>`);
  return out;
}

let legs = [
  {no:"", dep:"19:30", ft:"01:30", tz:"0", aabi:"00:10", gt:"01:00"},
  {no:"", dep:"", ft:"02:00", tz:"0", aabi:"00:10", gt:"01:00"}
];
function toMin(v){ if(!v) return null; const m=/^(\d{1,2}):(\d{2})$/.exec(v.trim()); return m? (+m[1])*60 + (+m[2]) : null; }
function fmt(min){ const d=Math.floor(min/1440); const t=((min%1440)+1440)%1440;
  return {t:String(Math.floor(t/60)).padStart(2,"0")+":"+String(t%60).padStart(2,"0"), d:d};
}
function renderLegs(){
  const host = document.getElementById("legs");
  host.innerHTML = "";
  let carry = null;
  legs.forEach((L,idx)=>{
    if(idx>0 && carry!==null){ const f=fmt(carry); L.dep = f.t; }
    const dep = toMin(L.dep), ft = toMin(L.ft), aabi = toMin(L.aabi)||0, gt = toMin(L.gt)||0;
    const tz = parseFloat(L.tz||"0");
    let etaLocal=null, next=null;
    if(dep!==null && ft!==null){
      let base = dep + ft + (idx>0 && carry!==null ? Math.floor(carry/1440)*1440 : 0);
      etaLocal = base + Math.round(tz*60);
      next = etaLocal + aabi + gt;
    }
    carry = next;
    const e = etaLocal!==null?fmt(etaLocal):null, n = next!==null?fmt(next):null;
    const el = document.createElement("div"); el.className="leg";
    el.innerHTML = `
      <div class="lhead"><span class="n">${idx+1}</span><strong>第 ${idx+1} 段</strong>
        ${legs.length>1?`<button class="rm" data-rm="${idx}">移除</button>`:""}</div>
      <div class="fields">
        <div class="f"><label>航班號</label><input data-i="${idx}" data-k="no" value="${L.no}" placeholder="JX316"></div>
        <div class="f"><label>起飛 ETD（當地）</label><input data-i="${idx}" data-k="dep" value="${L.dep}" placeholder="19:30"${idx>0?" readonly":""}></div>
        <div class="f"><label>飛時</label><input data-i="${idx}" data-k="ft" value="${L.ft}" placeholder="02:00"></div>
        <div class="f"><label>時差（小時）</label><input data-i="${idx}" data-k="tz" value="${L.tz}" placeholder="-1"></div>
        <div class="f"><label>抵達→靠檔</label><input data-i="${idx}" data-k="aabi" value="${L.aabi}" placeholder="00:10"></div>
        <div class="f"><label>地停</label><input data-i="${idx}" data-k="gt" value="${L.gt}" placeholder="01:00"></div>
      </div>
      <div class="out">
        <div><span>抵達 ETA（當地）</span><b>${e?e.t:"--:--"}${e&&e.d?`<small>+${e.d}</small>`:""}</b></div>
        <div><span>可再起飛</span><b>${n?n.t:"--:--"}${n&&n.d?`<small>+${n.d}</small>`:""}</b></div>
      </div>`;
    host.appendChild(el);
  });
  host.querySelectorAll("input").forEach(inp=>{
    inp.oninput = ()=>{ legs[+inp.dataset.i][inp.dataset.k] = inp.value;
      const pos = inp.selectionStart; renderLegs();
      const again = document.querySelector(`input[data-i="${inp.dataset.i}"][data-k="${inp.dataset.k}"]`);
      if(again){ again.focus(); try{again.setSelectionRange(pos,pos);}catch(e){} }
    };
  });
  host.querySelectorAll("[data-rm]").forEach(b=>{
    b.onclick=()=>{ legs.splice(+b.dataset.rm,1); renderLegs(); };
  });
}
document.getElementById("addLeg").onclick = ()=>{
  legs.push({no:"", dep:"", ft:"02:00", tz:"0", aabi:"00:10", gt:"01:00"}); renderLegs();
};

renderMatrix(); renderMatrixDetail(); renderLegs();
current = DATA.stations.find(s=>s.code==="NRT") || DATA.stations[0];
renderList();
(function(){ const s=Element.prototype.scrollIntoView; Element.prototype.scrollIntoView=function(){};
  renderDetail(); Element.prototype.scrollIntoView=s; })();
</script>
</body>
</html>
