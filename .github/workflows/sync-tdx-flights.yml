name: Sync TDX Flights

# Auto every 30 minutes + manual trigger (Run workflow)
on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: sync-tdx-flights
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # Needed to commit data/flights.json back to repo
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Fetch TDX & write data/flights.json
        env:
          TDX_CLIENT_ID: ${{ secrets.TDX_CLIENT_ID }}
          TDX_CLIENT_SECRET: ${{ secrets.TDX_CLIENT_SECRET }}
        run: node .github/scripts/sync-tdx-flights.js

      - name: Commit if changed
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/flights.json
          if git diff --cached --quiet; then
            echo "✓ No changes — TDX returned identical data"
          else
            git commit -m "chore: sync TDX flights [skip ci]"
            git push
            echo "✓ Committed new flights.json"
          fi
