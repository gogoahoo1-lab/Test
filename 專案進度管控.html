<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="color-scheme" content="light">
<!-- 伺服器網址：部署好 Cloudflare Worker 後，把網址填在下面 content 裡（例如 https://project-tracker.xxx.workers.dev），同仁打開這個檔案就不用再輸入 -->
<meta name="pc-api" content="">
<meta name="theme-color" content="#f3f4f9">
<title>專案進度管控</title>
<link rel="manifest" href="/manifest.json">
<link rel="apple-touch-icon" href="/icon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
/* VOICE iOS 原生 App 的安靜與清楚：先把落後的挑出來，正常的放後面
   IDEA Apple「提醒事項」式圓角分組清單
   PICTURE 大標題「專案」＋兩格計數，下面兩組清單：落後・需處理／正常進行
   COLOUR iOS 系統色：#f2f2f7 底、白卡、紅 #ff3b30、橘 #ff9500、綠 #34c759、藍 #007aff
   TYPE 系統字（SF／蘋方）；LAYOUT 手機為 App 版，電腦版為可左右拖動的時間軸 */
:root{color-scheme:light;
--bg:#f2f2f7;--card:#fff;--ink:#000;--mute:#6d6d72;--line:#e5e5ea;--sep:#c6c6c8;--track:#e5e5ea;--soft:#f2f2f7;
--red:#ff3b30;--redt:#d70015;--redbg:#ffe9e7;--amb:#ff9500;--ambt:#c93400;--ambbg:#fff3e0;
--grn:#34c759;--grnt:#248a3d;--grnbg:#e5f8ea;--gry:#e5e5ea;--blue:#007aff;--bluebg:#e5f1ff;--sh:none;
--sf:-apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang TC","Noto Sans TC","Helvetica Neue",sans-serif}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 var(--sf);overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;color:inherit}
[hidden]{display:none!important}
.wrap{max-width:760px;margin:0 auto;padding:20px max(4vw,16px) 72px}
#nav{display:flex;gap:6px;align-items:center;margin-bottom:20px}
.tab{appearance:none;border:0;background:transparent;color:var(--mute);font:700 15px/1 inherit;padding:0 16px;height:44px;border-radius:999px;cursor:pointer}
.tab[aria-current=true]{background:var(--ink);color:#fff}
.btn{appearance:none;border:0;background:var(--blue);color:#fff;font:800 15px/1 inherit;padding:0 18px;min-height:46px;border-radius:12px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn.ghost{background:var(--card);color:var(--ink);box-shadow:var(--sh),0 0 0 1px var(--line)}
.btn.warn{background:var(--red)}
.btn.sm{min-height:38px;font-size:13.5px;padding:0 12px;border-radius:10px}
.btn:disabled{opacity:.5}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
h1{font:800 34px/1.12 var(--sf);margin:0;text-wrap:balance}
.date{font-size:13px;color:var(--mute);font-weight:700}
.card{background:var(--card);border-radius:16px;box-shadow:var(--sh)}
.sum{padding:14px;margin-top:16px}
.stk{display:flex;height:12px;border-radius:6px;overflow:hidden;gap:2px;background:var(--track)}
.cnt{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));margin-top:12px}
.cnt b{display:block;font:700 24px/1.1 var(--sf);font-variant-numeric:tabular-nums}
.cnt span{font-size:12px;color:var(--mute);font-weight:700}
.alert{margin-top:10px;background:var(--redbg);color:var(--redt);border-radius:14px;padding:10px 10px 10px 14px;display:flex;align-items:center;gap:10px}
.alert p{flex:1;margin:0;font-size:14px;font-weight:800;line-height:1.4}
.alert button{all:unset;background:var(--red);color:#fff;font-size:13px;font-weight:800;padding:0 14px;height:38px;border-radius:10px;cursor:pointer;white-space:nowrap}
.sec{margin-top:18px;overflow:hidden}
.sh{display:flex;align-items:center;gap:10px;padding:13px 14px;font-size:15px;font-weight:900}
.sh i{width:10px;height:10px;border-radius:3px}
.sh span{margin-left:auto;font-size:13px;color:var(--mute);font-weight:800}
.sec.bad .sh{background:var(--redbg);color:var(--redt)}
.sec.good .sh{background:var(--grnbg);color:var(--grnt)}
.row{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:center;width:100%;padding:14px;border-top:1px solid var(--line);cursor:pointer}
.row:active{background:var(--soft)}
.row .m{flex:1;min-width:0}
.nm{font-size:15px;font-weight:800;line-height:1.3;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12.5px;color:var(--mute);margin-top:3px;display:flex;align-items:center;gap:6px;flex-wrap:wrap;font-weight:600}
.sub .w{color:var(--redt);font-weight:800}
.av{width:22px;height:22px;border-radius:50%;display:inline-grid;place-items:center;font-size:10px;font-weight:900;color:#fff;flex:none}
.bar{height:6px;border-radius:3px;background:var(--track);position:relative;margin-top:9px}
.bar i{position:absolute;left:0;top:0;bottom:0;border-radius:3px}
.bar em{position:absolute;top:-3px;bottom:-3px;width:2px;border-radius:1px;background:var(--ink)}
.pill{flex:none;font-size:12px;font-weight:900;padding:7px 0;border-radius:9px;width:64px;text-align:center}
.p-red{background:var(--red);color:#fff}.p-amb{background:var(--amb);color:#3b2a00}.p-gry{background:var(--gry);color:var(--ink)}.p-grn{background:var(--grn);color:#073b22}.p-done{background:var(--soft);color:var(--mute)}
.f-red{background:var(--red)}.f-amb{background:var(--amb)}.f-grn{background:var(--grn)}.f-gry{background:var(--mute)}
.empty{padding:22px 16px;text-align:center;color:var(--mute);font-size:14px;font-weight:600}
.empty b{display:block;color:var(--ink);font-size:17px;margin-bottom:4px}
.note-s{font-size:12.5px;color:var(--mute);margin-top:16px;line-height:1.6}
label{display:block;font-weight:800;font-size:14px;margin:16px 0 6px}
input,textarea,select{width:100%;font:16px/1.4 inherit;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:12px;padding:11px 12px;min-height:46px}
input[type=date]{min-width:0;-webkit-appearance:none;appearance:none}
textarea{min-height:88px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.fl{display:block;font-size:11.5px;color:var(--mute);font-weight:800;margin:0 0 4px}
.ms{display:grid;grid-template-columns:minmax(0,1fr) 44px;gap:8px;margin-bottom:10px;background:var(--card);border-radius:12px;padding:10px;box-shadow:var(--sh)}
.ms .dd{grid-column:1/2;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:8px}
.ms .x{grid-row:1/3;grid-column:2}
.x{all:unset;display:grid;place-items:center;width:44px;height:44px;border-radius:12px;cursor:pointer;color:var(--mute);font-size:22px;flex:none}
.ib{all:unset;display:grid;place-items:center;width:40px;height:40px;border-radius:10px;cursor:pointer;color:var(--mute);flex:none}
.ib svg{width:19px;height:19px}
.items{display:flex;flex-direction:column;gap:8px}
.it{display:block;background:var(--card);border-radius:14px;padding:12px;box-shadow:var(--sh)}
.itop{display:flex;gap:10px;align-items:flex-start}
.itop .acts2{display:flex;margin:-8px -6px 0 0}
.dot{width:12px;height:12px;border-radius:50%;flex:none;margin-top:5px;border:2px solid var(--mute)}
.s-doing .dot{border-color:var(--blue);background:conic-gradient(var(--blue) 0 50%,transparent 0)}
.s-done .dot{border-color:var(--grn);background:var(--grn)}
.it .tx{flex:1;min-width:0;font-weight:800;font-size:15.5px;line-height:1.35}
.it .tx small{display:block;font-size:12.5px;color:var(--mute);font-weight:600;margin-top:2px}
.it .tx small b{font-weight:800}
.it .tx .fr{color:var(--redt)}.it .tx .fa{color:var(--ambt)}
.it.s-done .tx{color:var(--mute)}
.seg3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px;background:var(--soft);border-radius:11px;padding:4px;margin-top:10px}
.seg3 button{all:unset;text-align:center;height:38px;line-height:38px;border-radius:8px;font-size:14px;font-weight:800;color:var(--mute);cursor:pointer;transition:background .15s,color .15s}
.seg3 button:focus-visible{outline:3px solid var(--blue)}
.seg3 .k-todo[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.seg3 .k-doing[aria-pressed=true]{background:var(--blue);color:#fff}
.seg3 .k-done[aria-pressed=true]{background:var(--grn);color:#073b22}
.irow{display:flex;gap:8px;margin-top:8px}
.note{all:unset;box-sizing:border-box;flex:1;padding:9px 11px;border-radius:10px;background:var(--soft);cursor:pointer;font-size:14px;line-height:1.45;min-height:44px}
.note .nt{display:block;color:var(--ink);font-weight:600}
.note small{display:block;color:var(--mute);font-size:12px;font-weight:600;margin-top:2px}
.note.empty .nt{color:var(--blue);font-weight:800}
.cam{all:unset;flex:none;width:52px;border-radius:10px;background:var(--soft);display:grid;place-items:center;cursor:pointer;color:var(--blue);font-size:11px;font-weight:800;gap:0;padding:6px 0}
.cam svg{width:20px;height:20px}
.ph-strip{display:flex;gap:6px;margin-top:8px;overflow-x:auto;padding-bottom:2px}
.ph-strip button{all:unset;flex:none;width:64px;height:64px;border-radius:10px;overflow:hidden;background:var(--track);cursor:pointer;position:relative}
.ph-strip img{width:100%;height:100%;object-fit:cover;display:block}
.upl{font-size:12.5px;color:var(--blue);font-weight:800;margin-top:6px}
.ned,.ied{margin-top:8px}
.ned textarea{min-height:76px}
.qn{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.qn button{all:unset;font-size:13px;font-weight:700;padding:7px 11px;border-radius:999px;background:var(--soft);cursor:pointer}
.nb{display:flex;gap:8px;margin-top:10px}.nb .btn{flex:1;min-height:44px}.nb .btn.ghost{background:var(--soft);box-shadow:none}
.nh{list-style:none;margin:12px 0 0;padding:0;border-top:1px solid var(--line)}
.nh li{padding:8px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.nh small{display:block;color:var(--mute);font-size:12px;font-weight:600}
.ipb{display:flex;height:8px;border-radius:4px;overflow:hidden;gap:2px;background:var(--track);margin-bottom:10px}
.ipb .k-done{background:var(--grn)}.ipb .k-doing{background:var(--blue)}.ipb .k-todo{background:var(--track)}
.ih{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.ih span{font-size:13px;color:var(--mute);font-weight:700}.c-doing{color:var(--blue)}.c-done{color:var(--grnt)}
.addit{background:var(--card);border-radius:14px;padding:12px;margin-top:10px;box-shadow:var(--sh)}
.addit .ttl{font-size:13px;font-weight:900;margin-bottom:8px}
.addit .two{gap:8px;margin-top:8px}
.imp{display:flex;gap:8px;margin-top:10px}.imp .btn{flex:1}
.pct{display:flex;gap:14px;align-items:center}
.pct input[type=range]{flex:1;accent-color:var(--blue);border:0;background:none;padding:0;height:44px}
.pct output{font:700 40px/1 var(--sf);min-width:96px;text-align:right;font-variant-numeric:tabular-nums}
.qp{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.qp button{all:unset;flex:1;min-width:52px;text-align:center;font-weight:800;font-size:14px;padding:11px 0;border-radius:10px;background:var(--card);box-shadow:var(--sh);cursor:pointer;font-variant-numeric:tabular-nums}
.qp button[aria-pressed=true]{background:var(--blue);color:#fff;box-shadow:none}
.qp .sug{flex-basis:100%;background:var(--grnbg);color:var(--grnt);box-shadow:none}
.acts{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.acts .btn{flex:1}
#sheet{position:fixed;inset:0;background:rgb(10 12 20/.5);display:flex;align-items:flex-end;justify-content:center;z-index:9}
.pane{background:var(--bg);width:min(720px,100%);max-height:92vh;overflow:auto;border-radius:22px 22px 0 0;padding:0 max(4vw,18px) calc(env(safe-area-inset-bottom) + 24px);animation:up .22s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:0}}
@media(prefers-reduced-motion:reduce){.pane{animation:none}}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 0}
.ph{position:sticky;top:0;z-index:2;background:var(--bg);display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:12px 0 8px}
.ph h2{font:900 23px/1.2 var(--sf);margin:0;padding-top:8px}
h3{font-size:15px;font-weight:900;margin:22px 0 10px}
.kv{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:12px}
.kv div{background:var(--card);border-radius:12px;padding:10px 12px;box-shadow:var(--sh)}
.kv span{display:block;font-size:12px;color:var(--mute);font-weight:700}
.kv b{font:700 20px var(--sf);font-variant-numeric:tabular-nums}
.tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}
.tag{font-size:12px;font-weight:800;padding:4px 10px;border-radius:7px;background:var(--redbg);color:var(--redt)}
.blk{margin-top:12px;padding:12px 14px;background:var(--redbg);border-radius:12px;font-size:14px;line-height:1.5}
.blk b{color:var(--redt)}
.log{list-style:none;margin:0;padding:0}
.log li{padding:12px 0;border-bottom:1px solid var(--line)}
.log .t{font-size:12.5px;color:var(--mute);display:flex;justify-content:space-between;gap:8px;font-weight:700}
.log p{margin:4px 0 0;font-size:14.5px}
.log .bk{color:var(--redt);font-weight:700}
.okbox{background:var(--card);border-radius:18px;padding:28px 20px;text-align:center;margin-top:16px;box-shadow:var(--sh)}
.okbox b{display:block;font:900 24px/1.2 var(--sf);margin-bottom:6px;color:var(--grnt)}
.err{color:var(--redt);font-weight:800;font-size:14px;margin:10px 0 0}
.tbl{width:100%;border-collapse:collapse;font-size:13.5px;background:var(--card);border-radius:12px;overflow:hidden;box-shadow:var(--sh)}
.tbl th{font-size:12px;color:var(--mute);text-align:left;padding:8px;background:var(--soft)}
.tbl td{padding:9px 8px;border-top:1px solid var(--line);vertical-align:top}
.tbl td.bad{color:var(--redt);font-weight:800}
.tbl tr.no td{background:#fff7f8}
.wkbar{display:flex;align-items:center;gap:8px;margin-top:12px}
.wkbar .lbl{flex:1;text-align:center;font-weight:900;font-size:16px}
.ai{padding:16px;margin-top:14px}
.ai .out{white-space:pre-wrap;font-size:14.5px;line-height:1.7;margin-top:10px}
.wp{padding:14px;margin-top:12px}
.wp .hd{display:flex;align-items:flex-start;gap:10px}
.wp .hd b{flex:1;font-size:16px;font-weight:900;line-height:1.3}
.wp .kpi{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:10px}
.wp .kpi div{background:var(--soft);border-radius:10px;padding:8px}
.wp .kpi span{display:block;font-size:11px;color:var(--mute);font-weight:800}
.wp .kpi b{font:700 17px var(--sf);font-variant-numeric:tabular-nums}
.wp h4{font-size:13px;font-weight:900;margin:12px 0 4px;color:var(--mute)}
.wp ul{margin:0;padding-left:18px;font-size:14px;line-height:1.6}
.wp .gal{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:6px}
.wp .gal button{all:unset;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--track);cursor:pointer}
.wp .gal img{width:100%;height:100%;object-fit:cover;display:block}
#lb{position:fixed;inset:0;background:rgb(0 0 0/.92);z-index:30;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:calc(env(safe-area-inset-top) + 50px) 12px calc(env(safe-area-inset-bottom) + 20px)}
#lb img{max-width:100%;max-height:calc(100% - 90px);object-fit:contain;border-radius:8px}
#lb .cap{color:#fff;font-size:14px;font-weight:600;margin-top:12px;text-align:center}
#lb .lbb{display:flex;gap:10px;margin-top:12px}
#lb .x{position:absolute;top:calc(env(safe-area-inset-top) + 8px);right:10px;color:#fff;font-size:28px}
#toast{position:fixed;left:50%;bottom:calc(env(safe-area-inset-bottom) + 96px);transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:14px;font-weight:700;padding:10px 16px;border-radius:999px;opacity:0;pointer-events:none;transition:.2s;z-index:40;white-space:nowrap}
#toast.on{opacity:1;transform:translate(-50%,0)}
.tplp{background:var(--card);border-radius:14px;padding:10px;margin-bottom:12px;box-shadow:var(--sh),0 0 0 2px var(--blue)}
.tplh{display:flex;align-items:center;justify-content:space-between;padding:0 2px 6px}
.tplc{all:unset;box-sizing:border-box;display:block;width:100%;padding:12px;border-radius:10px;cursor:pointer;border-top:1px solid var(--line)}
.tplc:hover,.tplc:focus-visible{background:var(--bluebg)}
.tplc b{display:block;font-size:15px;font-weight:900}
.tplc span{display:block;font-size:13px;color:var(--mute);margin-top:2px;line-height:1.45}
.tplc em{display:inline-block;font-style:normal;font-size:12px;font-weight:800;color:var(--blue);margin-top:4px}

@media(min-width:900px){.wrap{max-width:1480px}}
.vsw{display:inline-flex;gap:4px;background:var(--card);border-radius:12px;padding:4px;margin-top:18px;box-shadow:var(--sh)}
.vsw button{all:unset;padding:0 16px;height:36px;line-height:36px;border-radius:9px;font-size:14px;font-weight:800;color:var(--mute);cursor:pointer}
.vsw button[aria-pressed=true]{background:var(--ink);color:#fff}
.tl{margin-top:12px;overflow:hidden}
.tl-bar0{display:flex;align-items:center;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tl-zoom{display:inline-flex;gap:3px;background:var(--soft);border-radius:10px;padding:3px}
.tl-zoom button{all:unset;width:40px;text-align:center;height:32px;line-height:32px;border-radius:8px;font-size:13px;font-weight:800;color:var(--mute);cursor:pointer}
.tl-zoom button[aria-pressed=true]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px rgb(0 0 0/.12)}
.tl-hint{margin-left:auto;font-size:12.5px;color:var(--mute);font-weight:700}
.tl-lg{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--mute);font-weight:700;flex-basis:100%;flex-wrap:wrap}
.tl-lg i{display:inline-block;width:16px;height:8px;border-radius:3px;margin-left:8px}
.tl-lg i:first-child{margin-left:0}
.lg-p{background:var(--grn)}.lg-e{width:2px!important;height:12px!important;background:var(--ink)}.lg-d{background:var(--blue)}.lg-g{background:#9be3c4}.lg-r{background:var(--red)}
.tl-scroll{overflow:auto;max-height:calc(100vh - 230px);position:relative;cursor:grab;overscroll-behavior-x:contain}
.tl-scroll.dragging{cursor:grabbing;user-select:none}
.tl-in0{position:relative}
.tl-head{display:flex;position:sticky;top:0;z-index:4;background:var(--card);border-bottom:1px solid var(--line)}
.tl-name{position:sticky;left:0;z-index:3;width:300px;flex:none;background:var(--card);border-right:1px solid var(--line);display:flex;align-items:center;gap:6px;padding:0 10px 0 8px}
.tl-hn{font-size:12px;color:var(--mute);font-weight:800;z-index:5;padding-left:14px}
.tl-hd{position:relative;height:52px;flex:none}
.tl-mr,.tl-sr{position:relative;height:26px}
.tl-m{position:absolute;top:0;height:26px;line-height:26px;padding-left:8px;font-size:13px;font-weight:900;border-left:1px solid var(--line);white-space:nowrap;overflow:hidden}
.tl-w{position:absolute;top:0;height:26px;line-height:26px;padding-left:4px;font-size:11.5px;color:var(--mute);font-weight:700;border-left:1px solid var(--line);white-space:nowrap}
.tl-d{position:absolute;top:0;height:26px;line-height:26px;text-align:center;font-size:11px;color:var(--mute);font-weight:700;font-variant-numeric:tabular-nums}
.tl-d.we{background:var(--soft)}.tl-d.td{background:var(--red);color:#fff;border-radius:6px}
.tl-row,.tl-sec{display:flex}

<body>

  <button data-go="grid" id="m-gd"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 9.5h18M3 14.5h18M9 4v16"/></svg><span>管控表</span></button>
  <button data-go="weekly" id="m-wk" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4M7 14h5M7 17h8"/></svg><span>週報</span></button>
  <button data-go="admin" id="m-ad" hidden><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><circle cx="9" cy="8" r="3.5"/><path d="M3 20c0-3.3 2.7-6 6-6s6 2.7 6 6M16 4.5a3.5 3.5 0 0 1 0 7M18 14c2 .8 3 2.8 3 6"/></svg><span>帳號</span></button>
  <button data-go="report" id="m-rp"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 4h11l3 3v13H5z"/><path d="M9 12l2 2 4-4"/></svg><span>回報</span></button>

<script>
{
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const DAY=864e5;
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const pd=s=>{const a=String(s||'').split('-').map(Number);return new Date(a[0]||1970,(a[1]||1)-1,a[2]||1)};
const iso=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const md=s=>{if(!s)return'';const d=pd(s);return `${d.getMonth()+1}/${d.getDate()}`};
const when=t=>{const d=new Date(t);return `${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`};
const AVC=['#e2445c','#579bfc','#a25ddc','#ff158a','#00a9c5','#784bd1','#bb3354','#037f4c','#ff642e'];
const firstName=s=>String(s||'').split(/[、,，\s]+/).filter(Boolean)[0]||'';
const avatar=s=>{const n=firstName(s);if(!n)return'';let h=0;for(const c of n)h=(h*31+c.charCodeAt(0))>>>0;return `<span class="av" style="background:${AVC[h%AVC.length]}">${esc(n.slice(-1))}</span>`};
let PCB=(()=>{let b='';try{b=localStorage.getItem('pc-api')||''}catch(e){}const m=document.querySelector('meta[name=pc-api]');if(!b&&m&&m.content)b=m.content;return b.replace(/\/+$/,'')})();
const blob=id=>PCB+'/api/photos/'+id;
const IC={edit:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20h4L19 9l-4-4L4 16z"/><path d="M13 7l4 4"/></svg>',cam:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round" aria-hidden="true"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg>'};
let xTarget='detail',db=null,assets=null,downloads=null,sample=null,admin=false,uid='',P=[],loaded=false,failed='',view='',sheetMode='',openId='',editId='',pickId='',delArm=false,showDone=false,wk=0,UPD=null,impRows=null,photoTarget=null;
let me='';try{me=localStorage.getItem('pc-me')||''}catch(e){}
const who=()=>me||(admin?'主管':'');

/* ---------- 作業項目 ---------- */
const SO=m=>m.status||(m.done?'done':'todo');
const SL={todo:'待進行',doing:'進行中',done:'完成'};
const QN=['已開始進行','等待他人回覆','完成待確認','遇到問題，需要協助'];
const itLate=(m,t)=>SO(m)!=='done'&&m.due&&pd(m.due)<t;
const itNS=(m,t)=>SO(m)==='todo'&&m.start&&pd(m.start)<t&&!itLate(m,t);
const itND=m=>!m.start||!m.due;
const sugOf=ms=>ms.length?Math.round(ms.reduce((a,m)=>a+(SO(m)==='done'?1:SO(m)==='doing'?.5:0),0)/ms.length*100):null;
function itemCounts(ms){const c={todo:0,doing:0,done:0};ms.forEach(m=>c[SO(m)]++);return c}

function st(p){
  const t=today(),s=pd(p.start),e=pd(p.due),span=Math.max(1,(e-s)/DAY);
  const exp=Math.round(Math.min(100,Math.max(0,(t-s)/DAY/span*100)));
  const pr=Math.round(Number(p.progress)||0),ms=p.milestones||[];
  const odm=ms.filter(m=>itLate(m,t)),nsm=ms.filter(m=>itNS(m,t)),ndm=ms.filter(itND);
  const last=new Date(p.lastAt||p.createdAt||Date.now());
  const since=Math.max(0,Math.floor((Date.now()-last)/DAY)),cad=Number(p.cadence)||4;
  const done=pr>=100,stale=!done&&since>cad,late=!done&&t>e,gap=exp-pr,noPlan=!done&&!ms.length;
  let lv='ok';if(done)lv='done';else if(late||gap>25||odm.length)lv='red';else if(gap>10||nsm.length)lv='amber';
  const bad=!done&&(lv!=='ok'||stale||noPlan||!!p.lastBlock||ndm.length>0);
  const nd=ms.filter(m=>SO(m)==='done').length;
  return{exp,pr,gap,odm,nsm,ndm,since,cad,stale,late,lv,noPlan,bad,left:Math.ceil((e-t)/DAY),never:!p.lastAt,nd,nt:ms.length};
}
function pill(p,x){
  if(x.lv==='done')return['p-done','完成'];
  if(x.lv==='red')return['p-red',p.lastBlock?'卡關':'落後'];
  if(x.lv==='amber')return['p-amb','進度慢'];
  if(x.noPlan)return['p-gry','未規劃'];
  if(x.stale)return['p-red','未回報'];
  if(p.lastBlock)return['p-amb','卡關'];
  if(x.ndm.length)return['p-gry','缺日期'];
  return['p-grn',x.gap<-5?'超前':'正常'];
}
function reasons(p,x){
  const a=[];
  if(x.late)a.push(`已過截止 ${-x.left} 天`);
  else if(x.gap>10)a.push(`落後 ${x.gap}%`);
  if(x.odm.length)a.push(`${x.odm.length} 項逾期`);
  if(x.nsm.length)a.push(`${x.nsm.length} 項應開始未開始`);
  if(x.ndm.length)a.push(`${x.ndm.length} 項缺起訖日`);
  if(x.stale)a.push(x.never?`開工 ${x.since} 天從未回報`:`${x.since} 天未回報`);
  if(x.noPlan)a.push('尚未建立作業項目');
  if(p.lastBlock&&x.lv!=='done')a.push('回報卡關');
  return a;
}
const fillC=x=>x.lv==='red'?'f-red':x.lv==='amber'?'f-amb':x.lv==='done'?'f-gry':'f-grn';
function rowHTML(p,attr){
  const x=st(p),pl=pill(p,x),rs=reasons(p,x);
  const info=`${x.pr}% · ${x.lv==='done'?'已完成':x.left<0?'已過截止':`${md(p.due)} 截止`}${x.nt?` · 項目 ${x.nd}/${x.nt}`:''}`;
  const icb={'p-red':'var(--red)','p-amb':'var(--amb)','p-gry':'#8e8e93','p-grn':'var(--grn)','p-done':'#c7c7cc'}[pl[0]];
  const subt=rs.length?`<small class="w${pl[0]==='p-amb'?' a':''}">${esc(pl[1])} · ${esc(rs.join(' · '))}</small>`:`<small>${esc(p.owners)} · ${x.nt?`項目 ${x.nd}/${x.nt} · `:''}${x.lv==='done'?'已完成':x.left<0?'已過截止':`${md(p.due)} 截止`}</small>`;
  return `<button class="cell" ${attr||'data-open'}="${esc(p.id)}"><span class="ic" style="background:${icb}">${esc(firstName(p.owners).slice(-1)||'?')}</span><div class="t"><b>${esc(p.name)}</b>${rs.length?`<small>${esc(p.owners)}${x.nt?` · 項目 ${x.nd}/${x.nt}`:''}</small>`:''}${subt}
  ${x.lv==='done'?'':`<div class="bar" aria-label="完成 ${x.pr}%，應達 ${x.exp}%"><i class="${fillC(x)}" style="width:${x.pr}%"></i><em style="left:${x.exp}%"></em></div>`}</div>
  <span class="v">${x.pr}%</span><span class="ch" aria-hidden="true">›</span></button>`;
}
const score=x=>(x.lv==='red'?4:x.lv==='amber'?2:0)+(x.stale?3:0)+(x.noPlan?1:0);
function dateStr(){const n=new Date();return `${n.getMonth()+1} 月 ${n.getDate()} 日 週${'日一二三四五六'[n.getDay()]}`}

function overview(){
  if(!P.length)return `<div class="date">${dateStr()}</div><h1 style="margin-top:4px">還沒有專案</h1>
  <div class="card empty" style="margin-top:16px"><b>新增第一個專案</b>設定截止日與回報週期，系統就會開始幫你盯進度。${admin?'<div style="margin-top:16px"><button class="btn" data-act="new">＋ 新增專案</button></div>':''}</div>
  <p class="note-s">讓員工回報：到「帳號」頁替每位同仁建立帳號，把網址、帳號和臨時密碼傳給他們；他們登入後會直接進到「回報進度」。</p>`;
  const xs=P.map(p=>({p,x:st(p)}));
  const bad=xs.filter(o=>o.x.bad).sort((a,b)=>score(b.x)-score(a.x)||(a.p.due<b.p.due?-1:1));
  const good=xs.filter(o=>!o.x.bad&&o.x.lv!=='done').sort((a,b)=>a.p.due<b.p.due?-1:1);
  const fin=xs.filter(o=>o.x.lv==='done'),act=xs.filter(o=>o.x.lv!=='done');
  const cR=act.filter(o=>o.x.bad&&o.x.lv==='red').length,cA=act.filter(o=>o.x.bad&&o.x.lv==='amber').length,cG=good.length;
  const names=[...new Set(act.filter(o=>o.x.stale).map(o=>firstName(o.p.owners)).filter(Boolean))];
  const seg=(n,c)=>n?`<span class="${c}" style="flex:${n}"></span>`:'';
  return `<h1 class="lt">專案</h1><div class="date" style="margin-top:2px">${dateStr()} · ${bad.length?`<span style="color:var(--redt)">${bad.length} 個需要你注意</span>`:'全部正常進行'}</div>
  <div class="tiles"><button class="tile" data-act="jump" data-to="g-bad"><div class="th"><span class="ic" style="background:var(--red)">!</span><b>${bad.length}</b></div><em>需處理</em><small>落後 ${cR} · 進度慢 ${cA} · 其他 ${bad.length-cR-cA}</small></button>
  <button class="tile" data-act="jump" data-to="g-good"><div class="th"><span class="ic" style="background:var(--grn)"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="3.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg></span><b>${cG}</b></div><em>正常進行</em><small>已完成 ${fin.length}</small></button></div>
  ${names.length?`<div class="grp" style="margin-top:14px"><div class="cell"><span class="ic" style="background:var(--amb)"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" aria-hidden="true"><path d="M6 8a6 6 0 1 1 12 0c0 7 3 8 3 8H3s3-1 3-8M10 20a2 2 0 0 0 4 0"/></svg></span><div class="t"><b>${esc(names.join('、'))} 逾期未回報</b></div><button class="lnk" data-act="copyremind">複製提醒</button></div></div>`:''}
  ${isDesk()?`<div class="vsw" role="group" aria-label="檢視方式"><button data-act="vmode" data-m="timeline" aria-pressed="${tlMode==='timeline'}">時間軸</button><button data-act="vmode" data-m="list" aria-pressed="${tlMode==='list'}">清單</button></div>`:''}
  ${isDesk()&&tlMode==='timeline'?timelineHTML(bad,good,fin):`
  <div class="gh" id="g-bad"><span>落後・需處理</span><span>${bad.length}</span></div><div class="grp">${bad.length?bad.map(o=>rowHTML(o.p)).join(''):'<div class="empty">目前沒有落後的專案</div>'}</div>

function tplItems(k,S,D){

  return T.items.map(([cat,t,a,b])=>{let s,e;if(T.mode==='before'){s=add(D,-a);e=add(D,-b)}else{s=add(S,Math.round(a*span));e=add(S,Math.round(b*span))}if(s>e)[s,e]=[e,s];return{cat,t,start:s,due:e}});
}

const API={key:''};

let ME=null;
async function api(path,opt={}){
  const h={'X-Key':API.key,...(opt.headers||{})};if(opt.json)h['Content-Type']='application/json';
  let r;try{r=await fetch(PCB+'/api'+path,{method:opt.method||'GET',headers:h,body:opt.json?JSON.stringify(opt.json):opt.body})}catch(e){throw{code:'unavailable',message:'連不上伺服器，請檢查網路或伺服器網址'}}
  const d=r.status===204?null:await r.json().catch(()=>null);
  if(r.status===401&&!opt.open){if(!opt.noLogout)logout(true);throw{code:'unauth',message:(d&&d.error)||'請重新登入'}}
  if(r.status===403&&d&&d.mustChange){showPw(true);throw{code:'mustchange'}}
  if(!r.ok)throw{code:r.status===403?'invalid_argument':r.status===423?'locked':'unavailable',status:r.status,message:(d&&d.error)||'發生錯誤，請稍後再試'};
  return d;
}
const mkSnap=a=>({docs:a.map(o=>({id:o.id,exists:true,data:()=>o.data})),size:a.length,empty:!a.length,metadata:{fromCache:false,hasPendingWrites:false},docChanges:()=>[]});

async function poll(force){const r=await api('/state'+(force?'':'?v='+sver));if(r&&r.projects){sver=r.ver;const sn=mkSnap(r.projects.map(p=>({id:p.id,data:p})));subs.forEach(f=>f(sn))}}
function startPoll(){if(pollT)return;pollT=setInterval(()=>{if(!document.hidden)poll().catch(()=>{})},4000);document.addEventListener('visibilitychange',()=>{if(!document.hidden)poll().catch(()=>{})})}
const refresh=()=>setTimeout(()=>poll().catch(()=>{}),120);
const newKey=()=>(crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)).replace(/-/g,'').slice(0,20);
const DBX={
  collection(c){const q={w:{},l:0};const o={
    where(f,op,v){q.w[f]=v;return o},orderBy(){return o},limit(n){q.l=n;return o},
    onSnapshot(next,err){subs.push(next);poll(true).catch(e=>err&&err(e));startPoll();return()=>{}},
    async get(){const u=new URLSearchParams();if(q.w.pid)u.set('pid',q.w.pid);u.set('limit',q.l||1000);const r=await api('/updates?'+u);return mkSnap(r.map(x=>({id:x.id,data:x})))},
    async add(d){const r=await api('/updates',{method:'POST',json:d});refresh();return{id:r.id}},
    doc(id){return DBX.doc(c+'/'+(id||newKey()))}};return o},
  doc(path){const [c,id]=path.split('/');return{id,path,
    async get(){const r=await api('/reports/'+encodeURIComponent(id));return{id,exists:!!r,data:()=>r}},
    async set(d){await api((c==='projects'?'/projects/':'/reports/')+encodeURIComponent(id),{method:'PUT',json:d});refresh()},
    async update(d){await api('/projects/'+encodeURIComponent(id),{method:'PATCH',json:d});refresh()},
    async delete(){await api('/projects/'+encodeURIComponent(id),{method:'DELETE'});refresh()}}}
};
const ASSETS={async upload(b,o){const r=await api('/photos',{method:'POST',body:b,headers:{'Content-Type':(o&&o.type)||b.type||'image/jpeg'}});return{id:r.id,url:blob(r.id)}},async delete(id){await api('/photos/'+id,{method:'DELETE'});return{deleted:true}}};
const DOWNLOADS={async save({filename,data}){const b=data instanceof Blob?data:new Blob([data],{type:/\.html$/.test(filename)?'text/html':'application/octet-stream'});const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=filename;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),8000);return{status:'saved'}}};
const SAMPLE=async(prompt,opts)=>{try{const r=await api('/ai',{method:'POST',json:{prompt}});opts&&opts.onText&&opts.onText({text:r.text,delta:r.text});return{text:r.text,truncated:false}}catch(e){throw{code:e.code==='invalid_argument'?'not_granted':'upstream_error',message:e.message}}};

function normDate(v,X){
  if(v===''||v==null)return'';
  if(typeof v==='number'&&v>20000&&v<80000){const d=new Date(Math.round((v-25569)*DAY));return `${d.getUTCFullYear()}-${String(d.getUTCMonth()+1).padStart(2,'0')}-${String(d.getUTCDate()).padStart(2,'0')}`}
  if(v instanceof Date&&!isNaN(v))return iso(v);
  const s=String(v).trim().replace(/[年月]/g,'/').replace(/日/,'');let m=s.match(/^(\d{4})[\/\-.](\d{1,2})[\/\-.](\d{1,2})/);
  if(m)return `${m[1]}-${m[2].padStart(2,'0')}-${m[3].padStart(2,'0')}`;
  m=s.match(/^(\d{1,2})[\/\-.](\d{1,2})$/);if(m)return `${today().getFullYear()}-${m[1].padStart(2,'0')}-${m[2].padStart(2,'0')}`;

  return 'x';
}

  catch(e){if(['image/jpeg','image/png','image/webp','image/gif'].includes(file.type))return file;throw{code:'decode'}}

  }else if(f.id==='rf'){
    const p=P.find(q=>q.id===pickId);if(!p)return;
    const pct=Number($('#r-p').value),did=$('#r-d').value.trim(),block=$('#r-b').value.trim();
    if(!did){$('#ferr').textContent='請寫下這段時間完成的事。';$('#r-d').focus();return}
    const ms=p.milestones||[],cc=itemCounts(ms),at=new Date().toISOString(),name=me||'';
    busy(true);
    try{await db.collection('updates').add({pid:p.id,pct,did,block,at,by:uid,name});
      await db.doc('projects/'+p.id).update({progress:pct,lastAt:at,lastNote:did,lastBlock:block,lastBy:name});
      openSheet('done',`<div class="grab"></div><div class="okbox"><b>已送出回報</b>${esc(p.name)} · 完成 ${pct}% · 作業項目完成 ${cc.done}/${ms.length}<div class="acts" style="justify-content:center"><button class="btn" data-act="close">好</button></div></div>`)}catch(err){busy(false);fail(err)}
  }
});
window.addEventListener('scroll',()=>$('#appbar').classList.toggle('sc',scrollY>4),{passive:true});
window.addEventListener('hashchange',()=>{const h=location.hash.slice(1);if(['overview','report','weekly','grid','admin'].includes(h)&&h!==view)setView(h)});

(async()=>{
  const h=location.hash.slice(1);view=['overview','report','weekly','grid','admin'].includes(h)?h:'';
  if(!API.key){
    if(location.protocol==='file:'&&!PCB){showLogin();return}
    try{const st=await api('/status',{open:true});if(st.setup){showSetup();return}}catch(e){showLogin(e.message);return}
    showLogin();return}
  let info;try{info=await api('/me',{noLogout:true})}catch(e){if(e.code==='unauth')logout(true);else if(e.code!=='mustchange'){failed='連不上伺服器';render()}return}
  ME=info;me=info.name;try{localStorage.setItem('pc-me',me)}catch(x){}
  if(info.mustChange){showPw(true);return}
  admin=info.role==='admin';uid=info.id;db=DBX;assets=ASSETS;downloads=DOWNLOADS;sample=info.ai?SAMPLE:null;
  if(!view||((view==='weekly'||view==='admin')&&!admin))view=admin?'overview':'report';
  const timer=setTimeout(()=>{if(!loaded){failed='暫時連不上資料';render()}},12000);
  db.collection('projects').onSnapshot(s=>{P=s.docs.map(d=>({id:d.id,...d.data()}));clearTimeout(timer);failed='';const first=!loaded;loaded=true;render();if(first&&(view==='weekly'||view==='admin'))setView(view)},
    err=>{clearTimeout(timer);failed='資料讀取中斷';render()});
  render();
})();
}
</script>
</body>
</html>
